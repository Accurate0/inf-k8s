pre-commit:
  parallel: true
  commands:
    yamllint:
      glob: "*.{yml,yaml}"
      run: yamllint {staged_files}

    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    actionlint:
      glob: "{.github,.forgejo}/workflows/*.{yml,yaml}"
      run: actionlint

    typos:
      run: typos

    gitleaks:
      run: gitleaks protect --staged --redact --no-banner

    helmlint:
      glob: "**/Chart.yaml"
      run: 'printf "%s\n" {staged_files} | xargs -n1 dirname | sort -u | xargs -r -n1 helm lint'

    prettier:
      glob: "packages/**/*.{ts,mts,mjs}"
      exclude: "packages/feature-flag-client/**"
      run: packages/node_modules/.bin/prettier --check {staged_files}

    tofu-fmt:
      glob: "*.tf"
      run: tofu fmt -check -diff {staged_files}

    tofu-validate:
      glob: "*.tf"
      run: tofu -chdir=terraform validate

    render-apps:
      glob: "{**/app.yaml,platform/versions.yaml,platform/exports/**,charts/**,**/application.yaml,**/*.application.yaml,**/manifests/**,**/kustomization.{yml,yaml},{selfhosted,system-components}/*/*.values.yaml}"
      run: |
        out=$(ortzi update app && ortzi app render --changed) || { echo "$out"; exit 1; }
        echo "$out"
        echo "$out" | sed -nE '/^(wrote|removed) terraform\//d; s/^(wrote|removed) //p' | xargs -r git add -A --

    check-merge-conflict:
      run: 'git diff --cached --check'

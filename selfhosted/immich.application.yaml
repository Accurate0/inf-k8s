# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: selfhosted
  sources:
    - chart: k8s-oidc
      repoURL: oci://ghcr.io/accurate0/charts/k8s-oidc
      targetRevision: 0.3.0
      helm:
        valuesObject:
          clients:
            - name: immich
              namespace: immich
              displayName: Immich
              host: photos.anurag.sh
              callbackPath: /auth/login
              extraRedirectUrls:
                - https://photos.anurag.sh/user-settings
                - https://photos.anurag.sh/api/oauth/mobile-redirect
              preferShortUsername: true
              secretKeys:
                clientId: client-id
                clientSecret: client-secret
              claimMaps:
                immich_role:
                  join: ssv
                  valuesByGroup:
                    immich_admins:
                      - admin
              secretName: kanidm-immich-oidc
              secretNamespace: immich
    - chart: k8s-postgres
      repoURL: oci://ghcr.io/accurate0/charts/k8s-postgres
      targetRevision: 1.0.1
      helm:
        valuesObject:
          databases:
            - name: immich
              namespace: immich
              secretName: immich-db-credentials
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      path: selfhosted/immich
  destination:
    server: https://kubernetes.default.svc
    namespace: immich

operation:
  initiatedBy:
    username: github-actions
  sync:
    syncStrategy:
      hook: {}

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dawarich
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: selfhosted
  sources:
    - chart: k8s-oidc
      repoURL: oci://ghcr.io/accurate0/charts/k8s-oidc
      targetRevision: 0.2.2
      helm:
        valuesObject:
          clients:
            - name: dawarich
              namespace: dawarich
              displayName: Dawarich
              host: timeline.anurag.sh
              callbackPath: /users/auth/openid_connect/callback
              preferShortUsername: true
              secretKeys:
                clientId: client-id
                clientSecret: client-secret
              scopeMaps:
                dawarich_users:
                  - openid
                  - email
                  - profile
              secretName: kanidm-dawarich-oidc
              secretNamespace: dawarich
    - chart: k8s-postgres
      repoURL: oci://ghcr.io/accurate0/charts/k8s-postgres
      targetRevision: 1.0.1
      helm:
        valuesObject:
          databases:
            - name: dawarich
              namespace: dawarich
              databaseName: dawarich_2
              secretName: dawarich-db-credentials
    - chart: k8s-secrets
      repoURL: oci://ghcr.io/accurate0/charts/k8s-secrets
      targetRevision: 0.5.1
      helm:
        valuesObject:
          defaults:
            namespace: dawarich
            provider: openbao
            resyncInterval: 900
          secrets:
            - name: dawarich
              managedSecrets:
                - secretName: dawarich-managed-secrets
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      path: selfhosted/dawarich
  destination:
    server: https://kubernetes.default.svc
    namespace: dawarich

operation:
  initiatedBy:
    username: github-actions
  sync:
    syncStrategy:
      hook: {}

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: firefly
network:
  ingress: [firefly-up-sync]
resources:
  - {name: firefly, type: secret, secretName: firefly-managed-secrets}
  - name: integrations
    type: secret
    secretName: firefly-importer-managed-secrets
    secretTemplate: {includeAllSecrets: false, data: {accessToken: "{{ .FIREFLY_ACCESS_TOKEN }}"}}
  - {name: firefly, type: database, secretName: firefly-db-credentials, enableConnectionPooling: false}
  - name: upload
    type: volume
    claimName: firefly-upload
    class: replicated
    size: 5Gi
    access: ReadWriteOnce
    backup: daily
  - name: firefly
    type: route
    gateways:
      - {gateway: internal-gateway, hosts: [firefly.ortzi.cloud]}
    auth:
      mode: oidc
      client: firefly
      scopes: [openid, email, profile]
      jwt: {cacheDuration: 3600s, idToken: true, claimToHeaders: [{claim: email, header: x-firefly-user-email}]}
    backend: {name: firefly, port: 80}
    paths: [/]
    timeouts: {request: 0s}
  - name: firefly-importer
    type: route
    gateways:
      - {gateway: internal-gateway, hosts: [firefly-importer.ortzi.cloud]}
    auth: {mode: oidc, client: firefly-importer, scopes: [openid, email, profile]}
    backend: {name: firefly-importer, port: 80}
    paths: [/]
    timeouts: {request: 0s}
  - name: firefly
    type: oidc
    secretName: kanidm-firefly-oidc
    host: firefly.ortzi.cloud
    displayName: Firefly III
    preferShortUsername: true
    allowInsecureClientDisablePkce: true
    secretKeys: {clientId: client-id, clientSecret: client-secret}
  - name: firefly-importer
    type: oidc
    secretName: kanidm-firefly-importer-oidc
    host: firefly-importer.ortzi.cloud
    displayName: Firefly III Importer
    preferShortUsername: true
    allowInsecureClientDisablePkce: true
    secretKeys: {clientId: client-id, clientSecret: client-secret}
sources:
  - type: helm
    chart: firefly-iii
    repo: https://firefly-iii.github.io/kubernetes/
    version: 1.10.2
    values: firefly-iii.values.yaml
  - type: helm
    chart: importer
    repo: https://firefly-iii.github.io/kubernetes/
    version: 1.6.1
    values: importer.values.yaml
    releaseName: firefly-importer
artifact:
  repo: oci://registry.anurag.sh/manifests/firefly
  tag: main

fullnameOverride: firefly-importer
image:
  tag: version-2.2.3
replicaCount: 1
podAnnotations:
  reloader.stakater.com/auto: "true"
fireflyiii:
  url: http://firefly.firefly.svc.cluster.local
  vanityUrl: https://firefly.ortzi.cloud
  auth:
    existingSecret: firefly-importer-managed-secrets
config:
  env:
    IGNORE_DUPLICATE_ERRORS: "true"
    IMPORT_DIR_ALLOWLIST: /var/www/html/storage/configurations,/var/www/html/storage/uploads
    TZ: Australia/Perth
  files:
    - mountPath: /var/www/html/storage/configurations
      name: amex-au.json
      content: |
        {
          "version": 3,
          "source": "ff3-importer-2.2.3",
          "created_at": "2026-10-07T23:50:00+08:00",
          "date": "d/m/Y",
          "default_account": 44,
          "delimiter": "comma",
          "headers": true,
          "rules": true,
          "webhooks": true,
          "skip_form": false,
          "add_import_tag": true,
          "roles": [
            "date_transaction",
            "date_process",
            "description",
            "amount_negated",
            "note",
            "_ignore",
            "_ignore",
            "note",
            "opposing-name",
            "_ignore",
            "_ignore",
            "_ignore",
            "_ignore",
            "external-id"
          ],
          "do_mapping": [
            false,
            false,
            false,
            false,
            false,
            false,
            false,
            false,
            false,
            false,
            false,
            false,
            false,
            false
          ],
          "mapping": [],
          "duplicate_detection_method": "cell",
          "ignore_duplicate_lines": true,
          "ignore_duplicate_transactions": true,
          "unique_column_index": 13,
          "unique_column_type": "external-id",
          "flow": "file",
          "content_type": "csv",
          "custom_tag": "",
          "identifier": "0",
          "connection": "0",
          "ignore_spectre_categories": false,
          "grouped_transaction_handling": "",
          "use_entire_opposing_address": false,
          "map_all_data": false,
          "accounts": [],
          "date_range": "",
          "date_range_number": 30,
          "date_range_unit": "d",
          "date_not_before": "",
          "date_not_after": "",
          "conversion": false
        }
httpRoute:
  enabled: false
resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 512Mi

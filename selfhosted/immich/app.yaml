# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: immich
network:
  ingress:
    - home-gateway
resources:
  - name: immich
    type: route
    auth:
      mode: app
      reason: immich requires a kanidm login or api key on every api route
    hosts:
      - photos.anurag.sh
    backend:
      name: immich-server
      port: 80
    paths:
      - /
    dns: {provider: cloudflare, proxied: false}
    timeouts:
      request: 3600s
      backendRequest: 3600s
  - name: immich
    type: oidc
    secretName: kanidm-immich-oidc
    host: photos.anurag.sh
    displayName: Immich
    callbackPath: /auth/login
    extraRedirectUrls:
      - https://photos.anurag.sh/user-settings
      - https://photos.anurag.sh/api/oauth/mobile-redirect
    preferShortUsername: true
    secretKeys:
      clientId: client-id
      clientSecret: client-secret
    claimMaps:
      immich_role:
        join: ssv
        valuesByGroup:
          immich_admins:
            - admin
  - name: immich
    type: database
    secretName: immich-db-credentials
    enableConnectionPooling: false
    extensions: [vector, vchord, cube, earthdistance]
  - {name: library, type: volume, claimName: immich-library, class: nfs-perth, size: 1Ti, access: ReadWriteMany}
sources:
  - type: manifests
    path: .

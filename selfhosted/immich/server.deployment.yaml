# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: inf-k8s.net/location
                    operator: In
                    values:
                      - perth
      initContainers:
        - name: render-config
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -euc
            - |
              sed -e "s|__OIDC_CLIENT_ID__|$OIDC_CLIENT_ID|" \
                  -e "s|__OIDC_CLIENT_SECRET__|$OIDC_CLIENT_SECRET|" \
                  /template/immich.json.tmpl > /config/immich.json
          env:
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kanidm-immich-oidc
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kanidm-immich-oidc
                  key: client-secret
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: config
              mountPath: /config
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2283
          env:
            - name: TZ
              value: Australia/Perth
            - name: IMMICH_CONFIG_FILE
              value: /config/immich.json
            - name: IMMICH_TRUSTED_PROXIES
              value: 10.42.0.0/16
            - name: IMMICH_ALLOW_SETUP
              value: "false"
            - name: DB_VECTOR_EXTENSION
              value: vectorchord
            - name: REDIS_HOSTNAME
              value: perth.dragonfly.svc.cluster.local
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: PGHOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: PGPORT
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: PGUSER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: PGPASSWORD
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: PGDATABASE
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 60
            timeoutSeconds: 5
          volumeMounts:
            - name: library
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library
        - name: config-template
          configMap:
            name: immich-config
        - name: config
          emptyDir: {}

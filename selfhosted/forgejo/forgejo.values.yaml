extraVolumes:
  - name: forgejo-themes
    configMap:
      name: forgejo-themes
  - name: forgejo-ssh-host
    secret:
      secretName: forgejo-ssh-host-managed-secrets
  - name: forgejo-ssh-signing
    secret:
      secretName: forgejo-ssh-signing-managed-secrets
      defaultMode: 0o444
  - name: anubis-policy
    configMap:
      name: forgejo-anubis-policy

extraContainers:
  - name: anubis
    image: ghcr.io/techarohq/anubis:v1.25.0@sha256:5cf4c0d6c7ea01a356c6685a779971bdd28d6a5a4a6719201f73a9c4ae108db0
    imagePullPolicy: IfNotPresent
    ports:
      - name: anubis-http
        containerPort: 8923
      - name: anubis-metrics
        containerPort: 9090
    env:
      - name: BIND
        value: ":8923"
      - name: METRICS_BIND
        value: ":9090"
      - name: TARGET
        value: "http://localhost:3000"
      - name: DIFFICULTY
        value: "4"
      - name: SERVE_ROBOTS_TXT
        value: "true"
      - name: OG_PASSTHROUGH
        value: "true"
      - name: OG_EXPIRY_TIME
        value: "24h"
      - name: POLICY_FNAME
        value: /data/cfg/botPolicies.yaml
      - name: ED25519_PRIVATE_KEY_HEX
        valueFrom:
          secretKeyRef:
            name: forgejo-anubis-managed-secrets
            key: ED25519_PRIVATE_KEY_HEX
    volumeMounts:
      - name: anubis-policy
        mountPath: /data/cfg/botPolicies.yaml
        subPath: botPolicies.yaml
        readOnly: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault

extraContainerVolumeMounts:
  - name: forgejo-themes
    readOnly: true
    mountPath: "/data/gitea/public/assets/css"
  - name: forgejo-ssh-host
    mountPath: "/data/gitea/ssh/ssh_host_ed25519_key"
    subPath: ssh_host_ed25519_key
  - name: forgejo-ssh-signing
    mountPath: /data/signing
    readOnly: true

extraInitVolumeMounts:
  - name: forgejo-ssh-signing
    mountPath: /data/signing
    readOnly: true

image:
  rootless: true
  tag: 17.0.1
  digest: sha256:5ef02fbcf22beef56b8c844952ffad58cfe177b6f98e46e6abb5df90b88dc8d3

replicaCount: 1
topologySpreadConstraints:
  - topologyKey: inf-k8s.net/location
    whenUnsatisfiable: ScheduleAnyway
    maxSkew: 1
    nodeTaintsPolicy: Honor
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: forgejo

# HTTPRoute is owned by the kustomize source so it can target the
# anubis sidecar service instead of forgejo-http directly.
httpRoute:
  enabled: false
tcpRoute:
  enabled: false
persistence:
  enabled: true
  size: 100Gi
  storageClass: longhorn-replicated
  accessModes:
    - ReadWriteOnce
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/daily-backup: enabled
signing:
  enabled: false
gitea:
  readinessProbe:
    enabled: true
    httpGet:
      path: /api/healthz
      port: http
    initialDelaySeconds: 5
    timeoutSeconds: 1
    periodSeconds: 120
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 200
    timeoutSeconds: 1
    periodSeconds: 120
    successThreshold: 1
    failureThreshold: 10
  admin:
    username: ""
    existingSecret: ""
  config:
    APP_NAME: "git"
    APP_SLOGAN: ""
    ui:
      THEMES: forgejo-auto,forgejo-light,forgejo-dark,anthracite,anthracite-dark,anthracite-light
      DEFAULT_THEME: anthracite
    admin:
      EXTERNAL_USER_DISABLE_FEATURES: "manage_password, deletion"
    indexer:
      REPO_INDEXER_ENABLED: true
    storage:
      STORAGE_TYPE: minio
      MINIO_BUCKET: forgejo-storage
      MINIO_USE_SSL: "true"
    storage.avatars:
      STORAGE_TYPE: local
      PATH: /data/avatars
    storage.repo-avatars:
      STORAGE_TYPE: local
      PATH: /data/repo-avatars
    database:
      DB_TYPE: postgres
    queue:
      TYPE: redis
      CONN_STR: redis://cache.dragonfly.svc.cluster.local:6379?pool_size=100&idle_timeout=180s
    session:
      COOKIE_NAME: "git_session"
      PROVIDER: memory
      SESSION_LIFE_TIME: "1209600"
    cache:
      ENABLED: true
      ADAPTER: redis
      HOST: redis://cache.dragonfly.svc.cluster.local:6379?pool_size=100&idle_timeout=180s
    repository:
      DISABLE_DOWNLOAD_SOURCE_ARCHIVES: "true"
    repository.signing:
      FORMAT: ssh
      SIGNING_KEY: /data/signing/ed25519.pub
      SIGNING_NAME: git.anurag.sh Instance
      SIGNING_EMAIL: noreply@git.anurag.sh
      INITIAL_COMMIT: pubkey
      CRUD_ACTIONS: pubkey, parentsigned
      WIKI: never
      MERGES: pubkey, approved
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: "true"
    openid:
      ENABLE_OPENID_SIGNUP: "false"
    security:
      INSTALL_LOCK: "true"
    server:
      DOMAIN: git.anurag.sh
      ROOT_URL: https://git.anurag.sh/
      SSH_SERVER_HOST_KEYS: ssh/ssh_host_ed25519_key
      SSH_EXPOSE_ANONYMOUS: "false"
    service:
      DISABLE_REGISTRATION: "true"
      ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      ENABLE_INTERNAL_SIGNIN: "false"
      DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      ENABLE_BASIC_AUTHENTICATION: "false"
    service.explore:
      REQUIRE_SIGNIN_VIEW: "true"
      DISABLE_USERS_PAGE: "false"
      DISABLE_ORGANIZATIONS_PAGE: "false"
      DISABLE_CODE_PAGE: "false"
    api:
      ENABLE_SWAGGER: "false"
    webhook:
      ALLOWED_HOST_LIST: "api.janitor-bot.svc.cluster.local,external"
    other:
      SHOW_FOOTER_VERSION: "false"
      SHOW_FOOTER_TEMPLATE_LOAD_TIME: "false"
      SHOW_FOOTER_POWERED_BY: "false"
      ENABLE_SITEMAP: "false"
      ENABLE_FEED: "false"
  additionalConfigFromEnvs:
    - name: FORGEJO__STORAGE__MINIO_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: forgejo-storage-bucket-secrets
          key: MINIO_ENDPOINT
    - name: FORGEJO__STORAGE__MINIO_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: forgejo-storage-bucket-secrets
          key: MINIO_ACCESS_KEY_ID
    - name: FORGEJO__STORAGE__MINIO_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: forgejo-storage-bucket-secrets
          key: MINIO_SECRET_ACCESS_KEY

    - name: FORGEJO__DATABASE__NAME
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: PGDATABASE
    - name: FORGEJO__DATABASE__USER
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: PGUSER
    - name: FORGEJO__DATABASE__HOST
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: PGHOST
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: PGPASSWORD
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  oauth:
    - name: "kanidm"
      provider: "openidConnect"
      existingSecret: kanidm-forgejo-oidc
      autoDiscoverUrl: "https://idm.anurag.sh/oauth2/openid/forgejo/.well-known/openid-configuration"
      scopes: "email profile openid groups"
      groupClaimName: "forgejo"
      adminGroup: "admin"

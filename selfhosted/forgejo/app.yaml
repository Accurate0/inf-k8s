# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: forgejo
namespace:
  labels:
    gateway.inf-k8s.net/anurag-sh: "true"
network:
  ingress: [graph, janitor-bot, monitoring]
resources:
  - name: ssh-signing
    type: secret
    secretName: forgejo-ssh-signing-managed-secrets
    secretTemplate:
      includeAllSecrets: false
      data: {ed25519: "{{ .SSH_SIGNING_KEY }}", ed25519.pub: "{{ .SSH_SIGNING_KEY_PUBLIC }}"}
  - name: ssh-host
    type: secret
    secretName: forgejo-ssh-host-managed-secrets
    secretTemplate: {includeAllSecrets: false, data: {ssh_host_ed25519_key: "{{ .SSH_HOST_KEY }}"}}
  - name: gpg
    type: secret
    secretName: forgejo-gpg-managed-secrets
    secretTemplate: {includeAllSecrets: false, data: {privateKey: "{{ .GPG_PRIVATE_KEY }}"}}
  - name: runner
    type: secret
    secretName: forgejo-runner-secret
    secretTemplate:
      includeAllSecrets: false
      data: {uuid: "{{ .UUID }}", token: "{{ .TOKEN }}", cache-secret: "{{ .CACHE_SECRET }}"}
  - name: anubis
    type: secret
    secretName: forgejo-anubis-managed-secrets
    secretTemplate: {includeAllSecrets: false, data: {ED25519_PRIVATE_KEY_HEX: "{{ .ED25519_PRIVATE_KEY_HEX }}"}}
  - {name: forgejo, type: database, secretName: forgejo-db-credentials}
  - name: storage
    type: bucket
    provider: r2
    bucket: forgejo-storage
    secretName: forgejo-storage-bucket-secrets
    secretTemplate:
      data:
        MINIO_ENDPOINT: '{{ .S3_ENDPOINT | trimPrefix "https://" }}'
        MINIO_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
        MINIO_SECRET_ACCESS_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"
  - name: forgejo
    type: route
    auth: {mode: app, reason: "forgejo requires a kanidm login or token, with anubis in front of the web ui"}
    gateways:
      - {gateway: public-gateway, hosts: [git.anurag.sh], dns: {provider: cloudflare, proxied: false}}
    backend: {name: forgejo-anubis, port: 8923}
    paths: [/]
    timeouts: {request: 90s, backendRequest: 90s}
    loadBalancer: {type: consistentHash, headers: [Cookie, User-Agent]}
  - name: forgejo-ssh
    type: route
    protocol: tcp
    auth: {mode: app, reason: forgejo checks the ssh key of every git connection}
    backend: {name: forgejo-ssh, port: 22}
    gateways:
      - {gateway: public-gateway, listener: git-ssh}
  - name: forgejo
    type: oidc
    secretName: kanidm-forgejo-oidc
    host: git.anurag.sh
    displayName: Forgejo
    callbackPath: /user/oauth2/kanidm/callback
    preferShortUsername: true
    secretKeys: {clientId: key, clientSecret: secret}
    scopes: [openid, email, profile, groups]
    claimMaps:
      forgejo: {join: ssv, valuesByGroup: {forgejo_admins: [admin]}}
    icon: {configMap: forgejo-kanidm-icon, key: Forgejo.svg}
sources:
  - type: helm
    chart: forgejo
    repo: oci://code.forgejo.org/forgejo-helm/forgejo
    version: 17.3.3
    values: forgejo.values.yaml
  - type: helm
    chart: forgejo-runner
    repo: oci://registry.anurag.sh/erwanleboucher-git/eleboucher/charts/forgejo-runner
    version: 13.2.1
    values: forgejo-runner.values.yaml
    releaseName: forgejo-runner
  - type: manifests
    path: .
artifact:
  repo: oci://registry.anurag.sh/manifests/forgejo
  tag: main

name: Build & deploy waf-manager
on:
  push:
    branches:
      - main
    paths:
      - platform-services/waf-manager/**
      - '!platform-services/waf-manager/manifests/**'
      - '!platform-services/waf-manager/application.yaml'
      - .github/workflows/build-deploy-waf-manager.yaml
  workflow_dispatch:

jobs:
  build:
    permissions:
      packages: write

    uses: Accurate0/workflows/.github/workflows/build-push-docker.yaml@9611c57c4fee8a271c037bfc3c9a389d39b52d2f # main
    with:
      directory: ./platform-services/waf-manager
      image-name: waf-manager
      docker-build-args: |
        BINARY_NAME=waf-manager
      use-rust-caching: true

  deploy:
    needs:
      - build
    uses: Accurate0/workflows/.github/workflows/deploy-app-k8s-v2.yaml@9611c57c4fee8a271c037bfc3c9a389d39b52d2f # main
    with:
      service-name: waf-manager
      images: ghcr.io/accurate0/waf-manager
      manifests-path: platform-services/waf-manager/manifests
      tag: ${{ github.sha }}
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_CI_IMAGE_UPDATER }}

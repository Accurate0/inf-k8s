name: Build & deploy registry
on:
  push:
    branches:
      - main
    paths:
      - platform-services/registry/**
      - "!platform-services/registry/manifests/**"
      - "!platform-services/registry/application.yaml"
      - .github/workflows/build-deploy-registry.yaml
  workflow_dispatch:

jobs:
  build:
    permissions:
      packages: write

    uses: Accurate0/workflows/.github/workflows/build-push-docker.yaml@9611c57c4fee8a271c037bfc3c9a389d39b52d2f # main
    with:
      directory: ./platform-services/registry
      image-name: registry
      docker-build-args: |
        BINARY_NAME=registry
      use-rust-caching: true

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/registry
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: platform-services/registry/target
          key: ${{ runner.os }}-app-target-${{ hashFiles('**/Cargo.lock') }}-registry
      - run: cargo test --workspace
        working-directory: platform-services/registry

  deploy:
    needs:
      - build
      - test
    uses: Accurate0/workflows/.github/workflows/deploy-app-k8s-v2.yaml@9611c57c4fee8a271c037bfc3c9a389d39b52d2f # main
    with:
      service-name: registry
      images: ghcr.io/accurate0/registry
      manifests-path: platform-services/registry/manifests
      tag: ${{ github.sha }}
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_CI_IMAGE_UPDATER }}

name: Build & deploy firefly-up-sync
on:
  push:
    branches:
      - main
    paths:
      - platform-services/firefly-up-sync/**
      - '!platform-services/firefly-up-sync/manifests/**'
      - '!platform-services/firefly-up-sync/application.yaml'
      - .github/workflows/build-deploy-firefly-up-sync.yaml
  workflow_dispatch:

jobs:
  build:
    permissions:
      packages: write

    uses: Accurate0/workflows/.github/workflows/build-push-docker.yaml@ac9012a26474aa89e9ab8f6926d64ca34c9dc36c # main
    with:
      directory: ./platform-services/firefly-up-sync
      image-name: firefly-up-sync
      docker-build-args: ""
      use-rust-caching: false

  deploy:
    needs:
      - build
    uses: Accurate0/workflows/.github/workflows/deploy-app-k8s-v2.yaml@ac9012a26474aa89e9ab8f6926d64ca34c9dc36c # main
    with:
      service-name: firefly-up-sync
      images: ghcr.io/accurate0/firefly-up-sync
      manifests-path: platform-services/firefly-up-sync/manifests
      tag: ${{ github.sha }}
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_CI_IMAGE_UPDATER }}

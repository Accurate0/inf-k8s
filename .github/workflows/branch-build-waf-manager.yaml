name: Branch build waf-manager
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - platform-services/waf-manager/**
      - .github/workflows/branch-build-waf-manager.yaml

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./platform-services/waf-manager
          push: false
          build-args: |
            BINARY_NAME=waf-manager

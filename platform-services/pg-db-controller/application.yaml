# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pg-db-controller
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: platform-services
  sources:
    - chart: k8s-postgres
      repoURL: oci://ghcr.io/accurate0/charts/k8s-postgres
      targetRevision: 0.2.0
      helm:
        valuesObject:
          databases:
            - name: pg-db-controller
              resourceName: pg-db-controller
              namespace: pg-db-controller
              databaseName: k8s_pg_db_controller
              secretName: pg-db-controller-test-secret
              secretNamespace: pg-db-controller
              annotations:
                inf-k8s.net/app: pg-db-controller
                inf-k8s.net/repository: https://github.com/Accurate0/inf-k8s
    - chart: k8s-secrets
      repoURL: oci://ghcr.io/accurate0/charts/k8s-secrets
      targetRevision: 0.5.1
      helm:
        valuesObject:
          defaults:
            namespace: pg-db-controller
            provider: azurekv
            resyncInterval: 900
            annotations:
              inf-k8s.net/app: pg-db-controller
              inf-k8s.net/repository: https://github.com/Accurate0/inf-k8s
          secrets:
            - name: pg-db-controller
              managedSecrets:
                - secretName: pg-db-controller-managed-secrets
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      path: platform-services/pg-db-controller/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: pg-db-controller
operation:
  initiatedBy:
    username: github-actions
  sync:
    prune: true
    syncStrategy:
      hook: {}

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/apiextensions.k8s.io/customresourcedefinition_v1.json
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresdatabases.inf-k8s.net
spec:
  group: inf-k8s.net
  names:
    categories:
    - databases
    kind: PostgresDatabase
    plural: postgresdatabases
    shortNames:
    - pgdb
    singular: postgresdatabase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.databaseName
      name: Database
      type: string
    - jsonPath: .status.conditions[?(@.type=="Programmed")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for PgDatabaseSpec via `CustomResource`
        properties:
          spec:
            properties:
              additionalDatabases:
                description: |-
                  Existing databases this role should also get access to. The role is granted
                  ALL PRIVILEGES on each one plus membership in that database's owning role, so
                  it can act with owner rights via SET ROLE. Ownership itself is never
                  reassigned - a Postgres database has exactly one owner, and it stays with
                  whichever role already holds it. Databases that do not exist are skipped.
                items:
                  pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                  type: string
                nullable: true
                type: array
              databaseName:
                description: |-
                  The database this resource owns. It is created if missing, and its owner is
                  set to this resource's role on every reconcile - so two PostgresDatabase
                  resources must never name the same database here, or they will flap
                  ownership between their roles. To share an existing database, list it under
                  additionalDatabases instead.
                pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                type: string
              roleName:
                nullable: true
                pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                type: string
              secretName:
                type: string
              secretNamespace:
                type: string
            required:
            - databaseName
            - secretName
            - secretNamespace
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - observedGeneration
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        title: PostgresDatabase
        type: object
    served: true
    storage: true
    subresources:
      status: {}

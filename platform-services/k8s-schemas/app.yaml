# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: k8s-schemas
secrets:
  - k8s-schemas
network:
  ingress: []
workloads:
  k8s-schemas:
    image: ghcr.io/accurate0/k8s-schemas
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    env:
      - name: K8S_VERSION
        value: v1.37.1
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    kind: CronJob
    schedule: 0 0 * * 0
    backoffLimit: 2
    serviceAccountName: k8s-schemas
    volumes:
      - name: tmp
        emptyDir: {}
serviceAccounts:
  - k8s-schemas
build:
  image: ghcr.io/accurate0/k8s-schemas

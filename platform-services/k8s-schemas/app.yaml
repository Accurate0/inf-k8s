# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: k8s-schemas
network:
  ingress: []
resources:
  - name: k8s-schemas
    type: serviceAccount
    clusterRole: k8s-schemas-crd-reader
    clusterRules:
      - {apiGroups: [apiextensions.k8s.io], resources: [customresourcedefinitions], verbs: [get, list]}
  - {name: k8s-schemas, type: secret, secretName: k8s-schemas-managed-secrets}
  - {name: schemas, type: bucket, provider: r2, bucket: k8s-schemas, secretName: schemas-bucket-secrets}
workloads:
  - name: k8s-schemas
    image: registry.anurag.sh/containers/k8s-schemas
    kind: CronJob
    schedule: 0 0 * * 0
    backoffLimit: 2
    resources: {cpu: 50m, memory: 128Mi, memoryLimit: 512Mi}
    env:
      S3_BUCKET: {bucket: schemas, key: S3_BUCKET}
      S3_ENDPOINT: {bucket: schemas, key: S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: {bucket: schemas, key: S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: {bucket: schemas, key: S3_SECRET_ACCESS_KEY}
      K8S_VERSION: v1.37.1
    envFrom:
      - secret: k8s-schemas
    mounts:
      tmp: {path: /tmp, emptyDir: true}
    serviceAccount: k8s-schemas
build:
  image: registry.anurag.sh/containers/k8s-schemas
  ci: forgejo
sources:
  - type: manifests
    path: .
    artifact: oci://registry.anurag.sh/manifests/k8s-schemas
    tag: main

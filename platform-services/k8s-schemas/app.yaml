# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: k8s-schemas
network:
  ingress: []
resources:
  - {name: schemas, type: bucket, provider: r2, bucket: k8s-schemas, secretName: schemas-bucket-secrets}
  - name: k8s-schemas
    type: serviceAccount
    clusterRole: k8s-schemas-crd-reader
    clusterRules:
      - {apiGroups: [apiextensions.k8s.io], resources: [customresourcedefinitions], verbs: [get, list]}
sources:
  - type: manifests
    path: .
artifact:
  repo: oci://registry.anurag.sh/manifests/k8s-schemas
  tag: main
ci:
  secrets:
    repos: [anurag/k8s]
    resources: [schemas, k8s-schemas]
workflows:
  - name: publish
    schedule: 0 0 * * 0
    paths:
      - platform-services/k8s-schemas/*.sh
      - platform-services/k8s-schemas/*.py
      - platform-services/k8s-schemas/requirements.txt
      - packages/ortzi-app/app.schema.json
      - charts/*/values.schema.json
    serviceAccount: k8s-schemas
    setup: platform-services/k8s-schemas/setup.sh
    run: platform-services/k8s-schemas/publish.sh
    env:
      S3_BUCKET: {bucket: schemas, key: S3_BUCKET}
      S3_ENDPOINT: {bucket: schemas, key: S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: {bucket: schemas, key: S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: {bucket: schemas, key: S3_SECRET_ACCESS_KEY}
      K8S_VERSION: v1.37.1

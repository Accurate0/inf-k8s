# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: kanidm-sync
network:
  ingress: []
workloads:
  kanidm-sync:
    image: ghcr.io/accurate0/kanidm-sync
    resources: {memory: 16Mi}
    env:
      KANIDM_URL: https://idm.anurag.sh
    envFrom:
      - secretRef:
          name: kanidm-sync-managed-secrets
    serviceAccountName: kanidm-sync
serviceAccounts:
  - kanidm-sync
build:
  image: ghcr.io/accurate0/kanidm-sync
  args:
    BINARY_NAME: kanidm-sync

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: kanidm-sync
network:
  ingress: []
resources:
  - name: kanidm-sync
    type: serviceAccount
    clusterRole: kanidm-sync-access
    clusterRules:
      - apiGroups: [inf-k8s.net]
        resources: [kanidmoauth2clients, kanidmgroups, kanidmusers, kanidmserviceaccounts]
        verbs: [get, list, watch]
      - apiGroups: [inf-k8s.net]
        resources: [kanidmoauth2clients, kanidmgroups, kanidmusers, kanidmserviceaccounts]
        verbs: [update, patch]
      - apiGroups: [inf-k8s.net]
        resources: [kanidmoauth2clients/status, kanidmgroups/status, kanidmusers/status, kanidmserviceaccounts/status]
        verbs: [get, update, patch]
      - {apiGroups: [""], resources: [secrets], verbs: [get, list, watch, create, update, patch]}
      - {apiGroups: [""], resources: [configmaps], verbs: [get, list, watch]}
workloads:
  - name: kanidm-sync
    image: registry.anurag.sh/containers/kanidm-sync
    resources: {memory: 16Mi}
    env:
      KANIDM_URL: https://idm.anurag.sh
    envFrom:
      - {secretRef: {name: kanidm-sync-managed-secrets}}
    serviceAccount: kanidm-sync
    release: latest
build:
  image: registry.anurag.sh/containers/kanidm-sync
  ci: forgejo
  args:
    BINARY_NAME: kanidm-sync
sources:
  - type: manifests
    path: .
artifact:
  repo: oci://registry.anurag.sh/manifests/kanidm-sync
  tag: main

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: kanidm-sync
network:
  ingress: []
resources:
  - name: kanidm-sync
    type: serviceAccount
    clusterRole: kanidm-sync-access
    clusterRules:
      - {apiGroups: [inf-k8s.net], resources: [kanidmoauth2clients, kanidmgroups, kanidmusers], verbs: [get, list, watch]}
      - {apiGroups: [inf-k8s.net], resources: [kanidmoauth2clients, kanidmgroups, kanidmusers], verbs: [update, patch]}
      - {apiGroups: [inf-k8s.net], resources: [kanidmoauth2clients/status, kanidmgroups/status, kanidmusers/status], verbs: [get, update, patch]}
      - {apiGroups: [""], resources: [secrets], verbs: [get, list, create, update, patch]}
      - {apiGroups: [""], resources: [configmaps], verbs: [get, list, watch]}
workloads:
  - name: kanidm-sync
    image: ghcr.io/accurate0/kanidm-sync
    resources: {memory: 16Mi}
    env:
      KANIDM_URL: https://idm.anurag.sh
    envFrom:
      - secretRef:
          name: kanidm-sync-managed-secrets
    serviceAccount: kanidm-sync
build:
  image: ghcr.io/accurate0/kanidm-sync
  args:
    BINARY_NAME: kanidm-sync
sources:
  - type: manifests
    path: .

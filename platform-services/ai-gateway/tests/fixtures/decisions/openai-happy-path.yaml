endpoint: /v1/decisions
provider:
  dialect: openai
  decision_models:
    - gpt-6-luna
request:
  model: gpt-6-luna
  input: I was charged twice for my order.
  questions:
    - type: choice
      name: department
      instructions: Which department should handle this complaint?
      choices:
        - value: billing
          description: Payments, invoices, and refunds.
        - value: technical
          description: Problems using the product.
upstream:
  status: 200
  body:
    answers:
      - type: choice
        name: department
        choice: billing
        probabilities:
          - value: billing
            probability: 0.95
          - value: technical
            probability: 0.05
        confidence: 0.93

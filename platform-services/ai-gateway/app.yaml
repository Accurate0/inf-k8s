# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: ai-gateway
routes:
  ai-gateway:
    auth:
      mode: app
      reason: app verifies kanidm JWTs, gateway JWT not rolled out yet
    gateway: internal-gateway
    hosts:
      - ai-gateway.ortzi.cloud
    backend:
      name: api
      port: 80
oidc:
  ai-gateway:
    displayName: AI Gateway
    public: true
    allowLocalhostRedirect: true
    scopes:
      - openid
      - email
      - profile
      - groups
databases:
  ai-gateway: {}
secrets:
  - ai-gateway
network:
  ingress:
    - maccas-api
    - tldr-bot
    - janitor-bot
    - monitoring
resources:
  - name: traces
    type: tracing
workloads:
  ai-gateway:
    image: ghcr.io/accurate0/ai-gateway
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    ports:
      - containerPort: 3000
    readinessProbe:
      httpGet:
        path: /health
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 15
    livenessProbe:
      httpGet:
        path: /health
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 60
    uses:
      - traces
    env:
      - name: CONFIG_PATH
        value: /etc/ai-gateway/config.yaml
      - name: FEATURE_FLAGS_URL
        value: http://api.feature-flags.svc.cluster.local:50051
      - name: REDIS_URL
        value: redis://replicated.dragonfly.svc.cluster.local
    envFrom:
      - secretRef:
          name: ai-gateway-managed-secrets
    volumeMounts:
      - name: config
        mountPath: /etc/ai-gateway
        readOnly: true
    secrets: []
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: ai-gateway
    topologySpreadConstraints:
      - topologyKey: inf-k8s.net/location
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: ai-gateway
    volumes:
      - name: config
        configMap:
          name: ai-gateway-config
    service:
      name: api
      ports:
        - name: http
          protocol: TCP
          port: 80
          targetPort: 3000
  ai-gateway-pricing-sync:
    image: ghcr.io/accurate0/ai-gateway
    command:
      - aig
      - prices
      - sync
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    env:
      - name: AIG_URL
        value: http://api.ai-gateway.svc.cluster.local
      - name: AIG_ADMIN_TOKEN
        valueFrom:
          secretKeyRef:
            name: ai-gateway-managed-secrets
            key: ADMIN_TOKEN
    secrets: []
    databases: []
    kind: CronJob
    schedule: 17 4 * * *
    backoffLimit: 2
namespace:
  labels:
    internal-gateway-access: "true"
metrics:
  workload: ai-gateway
  path: /admin/metrics
  port: http
  interval: 30s
build:
  image: ghcr.io/accurate0/ai-gateway
  context: .
  args:
    BINARY_NAME: ai-gateway
  paths:
    - crates/cli-auth/**
  test:
    run: cargo test
    db: timescale/timescaledb:latest-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
    dbName: ai_gateway
    packages:
      - protobuf-compiler
      - libprotobuf-dev

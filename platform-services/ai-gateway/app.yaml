# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: ai-gateway
namespace:
  labels:
    internal-gateway-access: "true"
network:
  ingress: []
exports:
  - {name: api, workload: ai-gateway, port: http}
resources:
  - {name: config, type: config, configMap: ai-gateway-config, files: [config.yaml]}
  - {name: ai-gateway, type: secret, secretName: ai-gateway-managed-secrets}
  - {name: ai-gateway, type: database, secretName: ai-gateway-database-secret}
  - {name: cache, type: cache}
  - {name: flags, type: app, app: feature-flags, export: api}
  - {name: traces, type: platform, export: tracing}
  - name: ai-gateway
    type: subgraph
    prefix: aiGateway
    workload: ai-gateway
    port: http
    path: /v1/graphql
    websocket: /v1/graphql/ws
    schema: subgraph.graphql
    auth:
      clients: [graph]
      groups: [ai_gateway_admins]
      scopes:
        - {name: ai-gateway:key:read, description: list api keys and read your own, groups: [ai_gateway_admins]}
        - name: ai-gateway:key:write
          description: create, update, revoke and regenerate api keys
          groups: [ai_gateway_admins]
        - {name: ai-gateway:model:read, description: list models and prices, groups: [ai_gateway_admins]}
        - {name: ai-gateway:price:write, description: upsert and sync model prices, groups: [ai_gateway_admins]}
        - {name: ai-gateway:usage:read, description: read and follow usage, groups: [ai_gateway_admins]}
        - {name: ai-gateway:chat:use, description: chat through the gateway, groups: [ai_gateway_admins]}
  - name: ai-gateway
    type: route
    auth: {mode: app, reason: "app verifies kanidm JWTs, gateway JWT not rolled out yet"}
    gateway: internal-gateway
    hosts: [ai-gateway.ortzi.cloud]
    backend: {name: api, port: 80}
    paths: [/]
  - name: ai-gateway
    type: oidc
    secretName: kanidm-ai-gateway-oidc
    host: ai-gateway.ortzi.cloud
    displayName: AI Gateway
    preferShortUsername: true
    public: true
    allowLocalhostRedirect: true
    scopes: [openid, email, profile, groups]
  - {name: ai-gateway, type: metrics, workload: ai-gateway, path: /admin/metrics, port: http, interval: 30s}
  - {name: dashboard, type: dashboard, configMap: ai-gateway-dashboard, file: dashboards/ai-gateway.json}
workloads:
  - name: ai-gateway
    image: registry.anurag.sh/containers/ai-gateway
    release: latest
    replicas: 2
    resources: {memory: 32Mi}
    ports:
      - {name: http, container: 3000, service: 80}
    probes:
      http: {path: /health, port: 3000}
      readiness: {delay: 5, every: 15}
      liveness: {delay: 5, every: 60}
    env:
      SUBGRAPH_AUTH: {subgraph: ai-gateway}
      CONFIG_PATH: /etc/ai-gateway/config.yaml
      REDIS_URL: {resource: cache}
      OTEL_TRACING_URL: {resource: traces}
      FEATURE_FLAGS_URL: {resource: flags}
    envFrom:
      - {secret: ai-gateway}
      - {database: ai-gateway}
    mounts:
      config: {path: /etc/ai-gateway, config: config}
    service: {name: api}
    overrides:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: ai-gateway
      topologySpreadConstraints:
        - topologyKey: inf-k8s.net/location
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ai-gateway
build:
  image: registry.anurag.sh/containers/ai-gateway
  ci: forgejo
  context: .
  args:
    BINARY_NAME: ai-gateway
  paths: [crates/subgraph/**]
  test:
    run: cargo test
    db:
      image: timescale/timescaledb:latest-pg17@sha256:6a6b7d7a346d7c6be03a310c240706f3bbc6d7adbdf3fbc07823570b34337f5e
      databaseName: ai_gateway
    packages: [build-essential, pkg-config, protobuf-compiler, libprotobuf-dev]
    toolchain: {rust: 1.99.1}
sources:
  - type: manifests
    path: .
artifact:
  repo: oci://registry.anurag.sh/manifests/ai-gateway
  tag: main

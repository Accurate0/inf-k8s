# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: ai-gateway
routes:
  ai-gateway:
    auth:
      mode: app
      reason: app verifies kanidm JWTs, gateway JWT not rolled out yet
    gateway: internal-gateway
    hosts:
      - ai-gateway.ortzi.cloud
    backend:
      name: api
      port: 80
oidc:
  ai-gateway:
    displayName: AI Gateway
    public: true
    allowLocalhostRedirect: true
    scopes:
      - openid
      - email
      - profile
      - groups
network:
  ingress:
    - janitor-bot
    - monitoring
exports:
  - name: api
    workload: ai-gateway
    port: http
resources:
  - {name: ai-gateway, type: secret}
  - {name: cache, type: cache, instance: replicated}
  - {name: ai-gateway, type: database}
  - name: flags
    type: app
    app: feature-flags
    export: api
  - name: traces
    type: tracing
workloads:
  ai-gateway:
    image: ghcr.io/accurate0/ai-gateway
    replicas: 2
    resources: {memory: 32Mi}
    ports: [3000]
    probes:
      http: {path: /health, port: 3000}
      readiness: {delay: 5, every: 15}
      liveness: {delay: 5, every: 60}
    env:
      CONFIG_PATH: /etc/ai-gateway/config.yaml
      REDIS_URL: {resource: cache}
      OTEL_TRACING_URL: {resource: traces}
      FEATURE_FLAGS_URL: {resource: flags}
    envFrom:
      - ai-gateway-managed-secrets
      - ai-gateway-database-secret
    mounts:
      config: {path: /etc/ai-gateway, configMap: ai-gateway-config}
    service:
      name: api
      ports:
        - {name: http, port: 80, targetPort: 3000}
    overrides:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: ai-gateway
      topologySpreadConstraints:
        - topologyKey: inf-k8s.net/location
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ai-gateway
  ai-gateway-pricing-sync:
    image: ghcr.io/accurate0/ai-gateway
    kind: CronJob
    schedule: 17 4 * * *
    backoffLimit: 2
    command:
      - aig
      - prices
      - sync
    resources: {memory: 32Mi, memoryLimit: 128Mi}
    env:
      AIG_ADMIN_TOKEN: {secret: ai-gateway-managed-secrets, key: ADMIN_TOKEN}
      AIG_URL: http://api.ai-gateway.svc.cluster.local
namespace:
  labels:
    internal-gateway-access: "true"
metrics:
  workload: ai-gateway
  path: /admin/metrics
  port: http
  interval: 30s
build:
  image: ghcr.io/accurate0/ai-gateway
  context: .
  args:
    BINARY_NAME: ai-gateway
  paths:
    - crates/cli-auth/**
  test:
    run: cargo test
    db: timescale/timescaledb:latest-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
    dbName: ai_gateway
    packages:
      - protobuf-compiler
      - libprotobuf-dev

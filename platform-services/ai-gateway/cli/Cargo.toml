[package]
name = "aig"
version = "0.1.0"
edition = "2024"
description = "ai-gateway admin CLI, through the graph"

[dependencies]
ai-gateway-api = { path = "../api" }
cli-auth = { path = "../../../crates/cli-auth" }
graph-client = { path = "../../../crates/graph-client" }
cynic = "3.14.0"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
cynic-codegen = "3.14.0"

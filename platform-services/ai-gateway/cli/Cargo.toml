[package]
name = "aig"
version = "0.1.0"
edition = "2024"
description = "ai-gateway admin CLI"

# The `aig` binary is published as the `ai` ortzi package (see ortzi.yaml) and also ships in
# the ai-gateway image, where the pricing CronJob runs `aig prices sync`.

[dependencies]
ai-gateway-api = { path = "../api" }
cli-auth = { path = "../../../crates/cli-auth" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

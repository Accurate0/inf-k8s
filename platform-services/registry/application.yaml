# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: platform-services
  sources:
    - chart: k8s-oidc
      repoURL: oci://ghcr.io/accurate0/charts/k8s-oidc
      targetRevision: 0.4.0
      helm:
        valuesObject:
          clients:
            - name: registry
              namespace: registry
              displayName: Registry
              host: registry.ortzi.cloud
              public: true
              allowLocalhostRedirect: true
              preferShortUsername: true
              groups:
                registry_admins:
                  - platform_admins
                registry_users:
                  - registry_admins
              scopeMaps:
                registry_users:
                  - openid
                  - email
                  - profile
                  - groups
              secretName: kanidm-registry-oidc
              secretNamespace: registry
              annotations:
                inf-k8s.net/app: registry
                inf-k8s.net/repository: https://github.com/Accurate0/inf-k8s
    - chart: k8s-http-routes
      repoURL: oci://ghcr.io/accurate0/charts/k8s-http-routes
      targetRevision: 2.3.1
      helm:
        valuesObject:
          routes:
            - name: registry
              gateway:
                name: internal-gateway
                namespace: envoy-gateway-system
              hostnames:
                - registry.ortzi.cloud
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: api
                      port: 80
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /
    - chart: k8s-postgres
      repoURL: oci://ghcr.io/accurate0/charts/k8s-postgres
      targetRevision: 1.0.1
      helm:
        valuesObject:
          databases:
            - name: registry
              namespace: registry
              databaseName: registry
              secretName: registry-database-secret
              annotations:
                inf-k8s.net/app: registry
                inf-k8s.net/repository: https://github.com/Accurate0/inf-k8s
    - chart: k8s-secrets
      repoURL: oci://ghcr.io/accurate0/charts/k8s-secrets
      targetRevision: 0.6.0
      helm:
        valuesObject:
          defaults:
            namespace: registry
            provider: openbao
            resyncInterval: 900
            annotations:
              inf-k8s.net/app: registry
              inf-k8s.net/repository: https://github.com/Accurate0/inf-k8s
          secrets:
            - name: registry
              managedSecrets:
                - secretName: registry-managed-secrets
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      path: platform-services/registry
  destination:
    server: https://kubernetes.default.svc
    namespace: registry
operation:
  initiatedBy:
    username: github-actions
  sync:
    prune: true
    syncStrategy:
      hook: {}

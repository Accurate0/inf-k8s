"""
Implement the DateTime<Utc> scalar

The input/output is a string in RFC3339 format.
"""
scalar DateTime

"""
A scalar that can represent any JSON value.
"""
scalar JSON

type Mutation {
	registryCreatePackage(input: RegistryCreatePackageInput!): RegistryPackage! @requiresScopes(scopes: [["registry:package:write"]])
	registryUpdatePackage(name: String!, input: RegistryUpdatePackageInput!): RegistryPackage! @requiresScopes(scopes: [["registry:package:write"]])
	registryArchivePackage(name: String!): RegistryPackage! @requiresScopes(scopes: [["registry:package:write"]])
	registryUnarchivePackage(name: String!): RegistryPackage! @requiresScopes(scopes: [["registry:package:write"]])
	"""
	Only packages without published versions can be deleted; archive the rest.
	"""
	registryDeletePackage(name: String!): ID! @requiresScopes(scopes: [["registry:package:write"]])
	registryYankVersion(id: ID!, reason: String): RegistryVersion! @requiresScopes(scopes: [["registry:package:publish"]])
	registryUnyankVersion(id: ID!): RegistryVersion! @requiresScopes(scopes: [["registry:package:write"]])
	registryCreatePublishToken(input: RegistryCreatePublishTokenInput!): RegistryCreatedPublishToken! @requiresScopes(scopes: [["registry:token:manage"]])
	registryRevokePublishToken(id: ID!): RegistryPublishToken! @requiresScopes(scopes: [["registry:token:manage"]])
	registryCreateTrustedPublisher(input: RegistryCreateTrustedPublisherInput!): RegistryTrustedPublisher! @requiresScopes(scopes: [["registry:publisher:manage"]])
	registryDeleteTrustedPublisher(id: ID!): ID! @requiresScopes(scopes: [["registry:publisher:manage"]])
	"""
	Starts a draft version; push each target to harbor, register it, then publish.
	"""
	registryCreateVersion(input: RegistryCreateVersionInput!): RegistryVersion! @requiresScopes(scopes: [["registry:package:publish"]])
	"""
	Records a target of a draft version already pushed to harbor as `manifest`.
	"""
	registryRegisterArtifact(package: String!, version: String!, target: RegistryTarget!, manifest: String!): RegistryArtifact! @requiresScopes(scopes: [["registry:package:publish"]])
	"""
	Certifies a throwaway publish key for one package, after checking the caller may publish it.
	"""
	registryIssueSigningCertificate(package: String!, publicKey: String!): RegistryEnvelope! @requiresScopes(scopes: [["registry:package:publish"]])
	"""
	Publishes a draft whose targets are all registered, with its signed statement.
	"""
	registryPublishVersion(package: String!, version: String!, statement: RegistryEnvelopeInput!, certificate: RegistryEnvelopeInput!): RegistryVersion! @requiresScopes(scopes: [["registry:package:publish"]])
	"""
	Mints a short-lived harbor robot limited to `access`.
	"""
	registryCreateHarborCredential(access: [RegistryHarborAccessInput!]!): RegistryHarborCredential!
	registryRevokeHarborCredential(username: String!): String!
	"""
	Cosign-signs `repository@digest` in harbor with the registry key.
	"""
	registrySignImage(repository: String!, digest: String!): RegistryImageSignature!
	"""
	Admins: push every published version missing from harbor, in the background.
	"""
	registryAdminBackfill: Boolean! @requiresScopes(scopes: [["registry:package:write"]])
	"""
	Admins: re-render and sign the catalog now, returning its new seq.
	"""
	registryAdminRenderCatalog: Int! @requiresScopes(scopes: [["registry:package:write"]])
}

interface Node {
	id: ID!
}

type Query {
	registryWhoami: RegistryWhoAmI!
	"""
	Unarchived packages, optionally filtered by name or description.
	"""
	registryPackages(query: String): [RegistryPackage!]! @requiresScopes(scopes: [["registry:package:read"]])
	registryPackage(name: String!): RegistryPackage! @requiresScopes(scopes: [["registry:package:read"]])
	registryVersion(package: String!, version: String!): RegistryVersion! @requiresScopes(scopes: [["registry:package:read"]])
	registryPublishTokens: [RegistryPublishToken!]! @requiresScopes(scopes: [["registry:token:manage"]])
	registryTrustedPublishers(package: String): [RegistryTrustedPublisher!]! @requiresScopes(scopes: [["registry:publisher:manage"]])
	registryAudit(package: String, limit: Int! = 100): [RegistryAuditEntry!]! @requiresScopes(scopes: [["registry:audit:read"]])
	"""
	The current signed catalog in harbor.
	"""
	registryCatalog: RegistryCatalogRef! @requiresScopes(scopes: [["registry:package:read"]])
	registrySigningKeys: [RegistrySigningKey!]! @requiresScopes(scopes: [["registry:package:read"]])
	"""
	Repositories with signed images, most recently signed first.
	"""
	registryImageRepositories: [RegistryImageRepository!]! @requiresScopes(scopes: [["registry:image:read"]])
	registryImageRepository(name: String!): RegistryImageRepository! @requiresScopes(scopes: [["registry:image:read"]])
	registryImage(repository: String!, digest: String!): RegistryImage! @requiresScopes(scopes: [["registry:image:read"]])
}

type RegistryArtifact implements Node @key(fields: "id") {
	id: ID!
	target: RegistryTarget!
	sha256: String!
	size: Int!
	"""
	A short-lived presigned download link, when the storage backend can sign one.
	"""
	downloadUrl: RegistryDownloadUrl
}

type RegistryAuditEntry implements Node @key(fields: "id") {
	at: DateTime!
	actor: String!
	actorKind: String!
	action: String!
	ecosystem: String
	version: String
	detail: JSON!
	id: ID!
	packageName: String
}

"""
The signed package catalog in harbor that installs resolve from.
"""
type RegistryCatalogRef {
	seq: Int!
	digest: String
}

input RegistryCreatePackageInput {
	name: String!
	description: String! = ""
	binaryName: String
	aliases: [String!]! = []
}

input RegistryCreatePublishTokenInput {
	name: String!
	"""
	CLI package names the token may publish.
	"""
	packages: [String!]!
	expiresInDays: Int
}

input RegistryCreateTrustedPublisherInput {
	package: String!
	"""
	`owner/repo` on Forgejo.
	"""
	repository: String!
	refPattern: String
	workflow: String
}

input RegistryCreateVersionInput {
	package: String!
	version: String!
	targets: [RegistryTarget!]!
	description: String
	binaryName: String
	aliases: [String!]
	auth: RegistryPackageAuthInput
}

type RegistryCreatedPublishToken {
	"""
	Shown once; only its hash is stored.
	"""
	secret: String!
	token: RegistryPublishToken!
}

type RegistryDownloadUrl {
	url: String!
	expiresAt: DateTime!
}

"""
A signed payload; payload and signature are base64, exactly as signed.
"""
type RegistryEnvelope {
	payload: String!
	signature: String!
	keyId: String!
}

"""
A signed payload; payload and signature are base64, exactly as signed.
"""
input RegistryEnvelopeInput {
	payload: String!
	signature: String!
	keyId: String!
}

type RegistryHarborAccess {
	project: String!
	actions: [RegistryHarborAction!]!
	"""
	The ortzi package a push to a package project is for.
	"""
	package: String
}

input RegistryHarborAccessInput {
	project: String!
	actions: [RegistryHarborAction!]!
	"""
	The ortzi package a push to a package project is for.
	"""
	package: String
}

enum RegistryHarborAction {
	PULL
	PUSH
}

"""
A short-lived harbor robot; revoke it when done.
"""
type RegistryHarborCredential {
	registry: String!
	username: String!
	password: String!
	expiresAt: DateTime!
	access: [RegistryHarborAccess!]!
}

type RegistryImage implements Node @key(fields: "id") @key(fields: "repository digest") {
	id: ID!
	repository: String!
	digest: String!
	source: RegistrySource
	workflowRef: String
	signedBy: String!
	signedByKind: String!
	signedAt: DateTime!
	"""
	Whether a registry-signed SLSA provenance attestation is attached.
	"""
	attested: Boolean!
	attestedAt: DateTime
}

type RegistryImageRepository implements Node @key(fields: "id") {
	id: ID!
	"""
	`<project>/<repository>` in Harbor.
	"""
	name: String!
	"""
	The most recently signed image.
	"""
	latest: RegistryImage!
	imageCount: Int!
	"""
	Signed images, newest first.
	"""
	images(limit: Int! = 50): [RegistryImage!]!
}

type RegistryImageSignature {
	repository: String!
	digest: String!
	tag: String!
	"""
	Tag of the SLSA provenance attestation, when one was attached.
	"""
	attestation: String
}

type RegistryPackage implements Node @key(fields: "id") {
	id: ID!
	name: String!
	description: String!
	binaryName: String!
	aliases: [String!]!
	latestVersion: RegistryVersion
	createdAt: DateTime!
	archived: Boolean!
	"""
	Published versions, newest first.
	"""
	versions: [RegistryVersion!]!
	version(version: String!): RegistryVersion!
	trustedPublishers: [RegistryTrustedPublisher!]!
}

input RegistryPackageAuthInput {
	issuer: String!
	clientId: String!
	scopes: String!
	tokenEnv: String!
	lazy: Boolean! = false
}

type RegistryPublishToken implements Node @key(fields: "id") {
	id: ID!
	name: String!
	prefix: String!
	scopes: [RegistryScope!]!
	createdBy: String!
	createdAt: DateTime!
	expiresAt: DateTime
	lastUsedAt: DateTime
	revokedAt: DateTime
}

type RegistryScope {
	ecosystem: String!
	package: String!
}

type RegistrySigningKey implements Node @key(fields: "id") {
	keyId: String!
	publicKeyPem: String!
	id: ID!
}

type RegistrySource {
	repository: String
	gitRef: String
	sha: String
	runId: String
}

enum RegistryTarget {
	DARWIN_ARM_64
	LINUX_AMD_64
	WASM
}

type RegistryTrustedPublisher implements Node @key(fields: "id") {
	id: ID!
	ecosystem: String!
	package: RegistryPackage
	provider: String!
	issuer: String!
	repository: String!
	repositoryId: String
	refPattern: String
	workflow: String
	createdBy: String!
	createdAt: DateTime!
}

input RegistryUpdatePackageInput {
	description: String
	binaryName: String
	aliases: [String!]
}

type RegistryVersion implements Node @key(fields: "id") {
	id: ID!
	package: RegistryPackage!
	version: String!
	status: String!
	targets: [RegistryTarget!]!
	description: String!
	binaryName: String!
	aliases: [String!]!
	artifacts: [RegistryArtifact!]!
	signed: Boolean!
	publishedAt: DateTime
	publishedBy: String
	source: RegistrySource
	yanked: RegistryYanked
}

type RegistryWhoAmI {
	subject: String!
	"""
	Holds registry:package:write.
	"""
	admin: Boolean!
	"""
	The registry scopes the caller holds.
	"""
	scopes: [String!]!
	groups: [String!]!
}

type RegistryYanked {
	at: DateTime!
	by: String!
	reason: String
}

type Subscription {
	"""
	New audit entries as they are recorded by any replica.
	"""
	registryAudit: RegistryAuditEntry!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT

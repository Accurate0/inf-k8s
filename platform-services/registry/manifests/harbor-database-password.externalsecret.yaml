# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/external-secrets.io/externalsecret_v1.json
# harbor reads the external database password from a key named "password"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-database-password
spec:
  refreshInterval: 300s
  target:
    name: harbor-database-password
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: harbor-database

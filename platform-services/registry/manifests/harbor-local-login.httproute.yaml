# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/gateway.networking.k8s.io/httproute_v1.json
# harbor has no setting to turn off local db login, so its endpoint is sent to kanidm instead
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-local-login
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: envoy-gateway-system
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lan-gateway
      namespace: envoy-gateway-system
  hostnames:
    - registry.anurag.sh
  rules:
    - matches:
        - path:
            type: Exact
            value: /c/login
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /c/oidc/login
            statusCode: 302

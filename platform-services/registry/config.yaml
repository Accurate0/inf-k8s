version: 1

oauth:
  issuer: https://idm.anurag.sh/oauth2/openid/registry
  audience: registry
  read_groups:
    - registry_users
    - registry_admins
  admin_groups:
    - registry_admins

forgejo:
  issuer: https://git.anurag.sh/api/actions
  audience: registry.ortzi.cloud

# Endpoint and credentials come from the environment:
# S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY.
storage:
  bucket: registry
  region: auto

limits:
  max_artifact_bytes: 268435456
  draft_ttl_hours: 24

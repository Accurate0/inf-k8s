version: 1

oauth:
  issuer: https://idm.anurag.sh/oauth2/openid/registry
  audience: registry
  read_groups:
    - registry_users
    - registry_admins
  admin_groups:
    - registry_admins

forgejo:
  issuer: https://git.anurag.sh/api/actions
  audiences:
    - registry.anurag.sh
    - registry.ortzi.cloud

graph:
  issuer: https://idm.anurag.sh/oauth2/openid/graph
  audience: graph

# Endpoint and credentials come from the environment:
# S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY.
storage:
  bucket: registry
  region: auto

limits:
  max_artifact_bytes: 268435456
  draft_ttl_hours: 24

harbor:
  url: http://harbor.registry.svc.cluster.local
  registry: registry.anurag.sh
  packages_project: ortzi-packages
  robot_duration_days: 1
  grants:
    - kanidm: {groups: [registry_users, registry_admins]}
      allow:
        - {project: ortzi-*, actions: [pull]}
    - kanidm: {groups: [registry_admins]}
      allow:
        - {project: ortzi-*, actions: [pull, push]}
        - {project: containers, actions: [pull, push]}
        - {project: charts, actions: [pull, push]}
    - token: {}
      allow:
        - {project: ortzi-*, actions: [pull]}
    - forgejo: {repository: "*"}
      allow:
        - {project: ortzi-*, actions: [pull]}
        - {project: containers, actions: [pull]}
        - {project: charts, actions: [pull]}
        - {project: ghcr, actions: [pull]}
        - {project: dockerhub, actions: [pull]}
        - {project: quay, actions: [pull]}
    - forgejo: {repository: anurag/k8s, ref: refs/heads/main}
      allow:
        - {project: containers, actions: [pull, push]}
        - {project: charts, actions: [pull, push]}
    - forgejo: {repository: anurag/spotify, ref: refs/heads/main}
      allow:
        - {project: containers, actions: [pull, push]}
    - forgejo: {repository: anurag/home-gateway, ref: refs/heads/main}
      allow:
        - {project: containers, actions: [pull, push]}
    - forgejo: {repository: anurag/tldr-bot, ref: refs/heads/main}
      allow:
        - {project: containers, actions: [pull, push]}
    - forgejo: {repository: anurag/anurag.sh, ref: refs/heads/main}
      allow:
        - {project: containers, actions: [pull, push]}
    - forgejo: {repository: anurag/bom, ref: refs/heads/main}
      allow:
        - {project: containers, actions: [pull, push]}
    - forgejo: {repository: anurag/ozb, ref: refs/heads/main}
      allow:
        - {project: containers, actions: [pull, push]}
    - forgejo: {repository: anurag/maccas-api, ref: refs/heads/main}
      allow:
        - {project: containers, actions: [pull, push]}

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: registry
# harbor runs in this app, so its charts stay on ghcr to keep it recoverable when harbor is down
chartRegistry: oci://ghcr.io/accurate0/charts
namespace:
  labels:
    internal-gateway-access: "true"
    gateway.inf-k8s.net/anurag-sh: "true"
    inf-k8s.net/lan-gateway-access: "true"
network:
  ingress: [forgejo]
resources:
  - {name: config, type: config, configMap: registry-config, files: [config.yaml]}
  - {name: registry, type: secret, secretName: registry-managed-secrets}
  - {name: signing, type: secret, secretName: registry-signing-secrets}
  - {name: harbor-exchange, type: secret, secretName: registry-harbor-exchange-secrets}
  - name: harbor-generated
    type: secret
    secretName: harbor-generated-secrets
    generate:
      HARBOR_ADMIN_PASSWORD: {length: 32, symbols: 0}
      secretKey: {length: 16, symbols: 0}
      secret: {length: 16, symbols: 0}
      CSRF_KEY: {length: 32, symbols: 0}
      JOBSERVICE_SECRET: {length: 16, symbols: 0}
      REGISTRY_HTTP_SECRET: {length: 16, symbols: 0}
  - name: harbor-token
    type: secret
    secretName: harbor-token-secrets
    secretTemplate: {includeAllSecrets: false, data: {tls.key: "{{ .TOKEN_KEY }}", tls.crt: "{{ .TOKEN_CERT }}"}}
  - name: harbor-registry
    type: secret
    secretName: harbor-registry-credentials
    secretTemplate:
      includeAllSecrets: false
      data: {REGISTRY_PASSWD: "{{ .REGISTRY_PASSWD }}", REGISTRY_HTPASSWD: "{{ .REGISTRY_HTPASSWD }}"}
  - {name: registry, type: database, secretName: registry-database-secret}
  - {name: harbor, type: database, secretName: harbor-database-secret}
  - {name: storage, type: bucket, provider: r2, bucket: registry, secretName: storage-bucket-secrets}
  - name: harbor-storage
    type: bucket
    provider: garage
    bucket: harbor
    secretName: harbor-storage-bucket-secrets
    secretTemplate:
      data:
        REGISTRY_STORAGE_S3_ACCESSKEY: "{{ .S3_ACCESS_KEY_ID }}"
        REGISTRY_STORAGE_S3_SECRETKEY: "{{ .S3_SECRET_ACCESS_KEY }}"
  - {name: traces, type: platform, export: tracing}
  - name: registry
    type: subgraph
    prefix: registry
    workload: registry
    port: http
    path: /v1/graphql
    websocket: /v1/graphql/ws
    schema: subgraph.graphql
    auth:
      clients: [graph, registry]
      groups: [registry_users, registry_admins]
      scopes:
        - name: registry:package:read
          description: list and fetch packages, versions, artifacts and the catalog
          groups: [registry_users]
          external:
            - {issuer: forgejo, claims: {repository: "*"}}
        - name: registry:image:read
          description: list image repositories and images
          groups: [registry_users]
          external:
            - {issuer: forgejo, claims: {repository: "*"}}
        - name: registry:package:write
          description: create, update, archive and delete packages, unyank versions and rebuild the catalog
          groups: [registry_admins]
        - name: registry:package:publish
          description: publish package versions and artifacts
          groups: [registry_admins]
          external:
            - {issuer: forgejo, claims: {repository: "*"}}
        - name: registry:publisher:manage
          description: list, add and remove trusted publishers
          groups: [registry_admins]
        - name: registry:token:manage
          description: list, create and revoke publish tokens, and revoke others' harbor credentials
          groups: [registry_admins]
        - {name: registry:audit:read, description: read and follow the audit log, groups: [registry_admins]}
  - name: registry-public
    type: route
    auth:
      mode: app
      reason: ortzi accepts opaque registry tokens and forgejo OIDC, harbor issues its own registry tokens behind a kanidm login or robot account
    gateway: public-gateway
    hosts: [registry.anurag.sh]
    rules:
      - {paths: [/api/v1, /cli/v1, /install.sh], backend: {name: api, port: 80}}
      - {paths: [/], backend: {name: harbor, port: 80}}
    timeouts: {request: 0s, backendRequest: 0s}
    dns: {provider: cloudflare, proxied: true}
  - name: registry-lan
    type: route
    auth:
      mode: app
      reason: ortzi accepts opaque registry tokens and forgejo OIDC, harbor issues its own registry tokens behind a kanidm login or robot account
    gateway: lan-gateway
    hosts: [registry.anurag.sh]
    rules:
      - {paths: [/api/v1, /cli/v1, /install.sh], backend: {name: api, port: 80}}
      - {paths: [/], backend: {name: harbor, port: 80}}
    timeouts: {request: 0s, backendRequest: 0s}
    dns: {provider: unifi}
  - name: registry
    type: oidc
    secretName: kanidm-registry-oidc
    host: registry.anurag.sh
    displayName: Registry
    preferShortUsername: true
    public: true
    allowLocalhostRedirect: true
    groups:
      registry_admins: [platform_admins]
      registry_users: [registry_admins]
    scopeMaps:
      registry_users: [openid, email, profile, groups]
  - name: harbor
    type: oidc
    secretName: kanidm-harbor-oidc
    host: registry.anurag.sh
    displayName: Harbor
    callbackPath: /c/oidc/callback
    preferShortUsername: true
    secretKeys: {clientId: client-id, clientSecret: client-secret}
    claimMaps:
      harbor_groups: {join: array, valuesByGroup: {harbor_admins: [admin], harbor_users: [user]}}
    groups:
      harbor_admins: [platform_admins]
      harbor_users: [harbor_admins]
    scopeMaps:
      harbor_users: [openid, email, profile, groups]
  - {name: registry, type: metrics, workload: registry, path: /metrics, port: http, interval: 30s}
workloads:
  - name: registry
    image: registry.anurag.sh/containers/registry
    release: latest
    replicas: 2
    resources: {memory: 64Mi}
    ports:
      - {name: http, container: 3000, service: 80}
    probes:
      http: {path: /health, port: 3000}
      readiness: {delay: 5, every: 15}
      liveness: {delay: 5, every: 60}
    env:
      S3_ENDPOINT: {bucket: storage, key: S3_ENDPOINT}
      S3_ACCESS_KEY_ID: {bucket: storage, key: S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: {bucket: storage, key: S3_SECRET_ACCESS_KEY}
      CONFIG_PATH: /etc/registry/config.yaml
      OTEL_TRACING_URL: {resource: traces}
      SUBGRAPH_AUTH: {subgraph: registry}
    envFrom:
      - {secret: registry}
      - {secret: signing}
      - {secret: harbor-exchange}
      - {database: registry}
    mounts:
      config: {path: /etc/registry, config: config}
    service: {name: api}
    overrides:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: registry
      topologySpreadConstraints:
        - topologyKey: inf-k8s.net/location
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: registry
build:
  image: registry.anurag.sh/containers/registry
  ci: forgejo
  context: .
  paths: [crates/subgraph/**]
  args:
    BINARY_NAME: registry
  test:
    run: cargo test --workspace
    packages: [build-essential, pkg-config]
    toolchain: {rust: 1.99.1}
    db:
      image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
      databaseName: registry
sources:
  - type: helm
    chart: harbor
    repo: https://helm.goharbor.io
    version: 1.19.4
    values: harbor.values.yaml
  - type: manifests
    path: .
artifact:
  repo: oci://registry.anurag.sh/manifests/registry
  tag: main

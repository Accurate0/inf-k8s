# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: registry
network:
  ingress:
    - forgejo
resources:
  - {name: config, type: config, configMap: registry-config, files: [config.yaml]}
  - {name: registry, type: secret, secretName: registry-managed-secrets}
  - {name: signing, type: secret, secretName: registry-signing-secrets}
  - {name: registry, type: database, secretName: registry-database-secret}
  - {name: storage, type: bucket, provider: r2, bucket: registry, secretName: storage-bucket-secrets}
  - {name: traces, type: platform, export: tracing}
  - {name: registry, type: subgraph, prefix: registry, workload: registry, port: http, path: /v1/graphql, websocket: /v1/graphql/ws, schema: subgraph.graphql, auth: {clients: [graph], groups: [registry_users, registry_admins]}}
  - name: registry
    type: route
    auth:
      mode: app
      reason: accepts opaque registry tokens and forgejo OIDC
    gateway: internal-gateway
    hosts:
      - registry.ortzi.cloud
    backend:
      name: api
      port: 80
  - name: registry-public
    type: route
    auth:
      mode: app
      reason: ortzi accepts opaque registry tokens and forgejo OIDC, harbor issues its own registry tokens behind a kanidm login or robot account
    hosts:
      - registry.anurag.sh
    rules:
      - paths: [/api/v1, /cli/v1, /install.sh]
        backend: {name: api, port: 80}
      - paths: [/]
        backend: {name: harbor, port: 80}
    timeouts:
      request: 0s
      backendRequest: 0s
    dns: {provider: cloudflare, proxied: true}
  - name: registry-lan
    type: route
    auth:
      mode: app
      reason: ortzi accepts opaque registry tokens and forgejo OIDC, harbor issues its own registry tokens behind a kanidm login or robot account
    gateway: lan-gateway
    hosts:
      - registry.anurag.sh
    rules:
      - paths: [/api/v1, /cli/v1, /install.sh]
        backend: {name: api, port: 80}
      - paths: [/]
        backend: {name: harbor, port: 80}
    timeouts:
      request: 0s
      backendRequest: 0s
    dns: {provider: unifi}
  - name: registry
    type: oidc
    secretName: kanidm-registry-oidc
    host: registry.ortzi.cloud
    displayName: Registry
    public: true
    allowLocalhostRedirect: true
    groups:
      registry_admins:
        - platform_admins
      registry_users:
        - registry_admins
    scopeMaps:
      registry_users:
        - openid
        - email
        - profile
        - groups
  - name: harbor
    type: database
    secretName: harbor-database-secret
  - name: harbor-storage
    type: bucket
    provider: garage
    bucket: harbor
    secretName: harbor-storage-bucket-secrets
    secretTemplate:
      data:
        REGISTRY_STORAGE_S3_ACCESSKEY: "{{ .S3_ACCESS_KEY_ID }}"
        REGISTRY_STORAGE_S3_SECRETKEY: "{{ .S3_SECRET_ACCESS_KEY }}"
  - name: harbor-generated
    type: secret
    secretName: harbor-generated-secrets
    generate:
      HARBOR_ADMIN_PASSWORD: {length: 32, symbols: 0}
      secretKey: {length: 16, symbols: 0}
      secret: {length: 16, symbols: 0}
      CSRF_KEY: {length: 32, symbols: 0}
      JOBSERVICE_SECRET: {length: 16, symbols: 0}
      REGISTRY_HTTP_SECRET: {length: 16, symbols: 0}
  - name: harbor-token
    type: secret
    secretName: harbor-token-secrets
    secretTemplate:
      includeAllSecrets: false
      data:
        tls.key: "{{ .TOKEN_KEY }}"
        tls.crt: "{{ .TOKEN_CERT }}"
  - name: harbor-registry
    type: secret
    secretName: harbor-registry-credentials
    secretTemplate:
      includeAllSecrets: false
      data:
        REGISTRY_PASSWD: "{{ .REGISTRY_PASSWD }}"
        REGISTRY_HTPASSWD: "{{ .REGISTRY_HTPASSWD }}"
  - name: harbor
    type: oidc
    secretName: kanidm-harbor-oidc
    host: registry.anurag.sh
    displayName: Harbor
    callbackPath: /c/oidc/callback
    preferShortUsername: true
    secretKeys:
      clientId: client-id
      clientSecret: client-secret
    claimMaps:
      harbor_groups:
        join: array
        valuesByGroup:
          harbor_admins:
            - admin
          harbor_users:
            - user
    groups:
      harbor_admins:
        - platform_admins
      harbor_users:
        - harbor_admins
    scopeMaps:
      harbor_users:
        - openid
        - email
        - profile
        - groups
  - name: registry
    type: metrics
    workload: registry
    path: /metrics
    port: http
    interval: 30s
workloads:
  - name: registry
    image: registry.anurag.sh/containers/registry
    replicas: 2
    resources: {memory: 64Mi}
    ports:
      - {name: http, container: 3000, service: 80}
    probes:
      http: {path: /health, port: 3000}
      readiness: {delay: 5, every: 15}
      liveness: {delay: 5, every: 60}
    env:
      S3_ENDPOINT: {bucket: storage, key: S3_ENDPOINT}
      S3_ACCESS_KEY_ID: {bucket: storage, key: S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: {bucket: storage, key: S3_SECRET_ACCESS_KEY}
      CONFIG_PATH: /etc/registry/config.yaml
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - secret: registry
      - secret: signing
      - database: registry
    mounts:
      config: {path: /etc/registry, config: config}
    service:
      name: api
    overrides:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: registry
      topologySpreadConstraints:
        - topologyKey: inf-k8s.net/location
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: registry
namespace:
  labels:
    internal-gateway-access: "true"
    gateway.inf-k8s.net/anurag-sh: "true"
    inf-k8s.net/lan-gateway-access: "true"
build:
  image: registry.anurag.sh/containers/registry
  ci: forgejo
  context: .
  paths:
    - crates/subgraph/**
  args:
    BINARY_NAME: registry
  test:
    run: cargo test --workspace
    packages:
      - build-essential
      - pkg-config
    setup: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1 && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    db: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    dbName: registry
sources:
  - type: helm
    chart: harbor
    repo: https://helm.goharbor.io
    version: 1.19.4
    values: harbor.values.yaml
  - type: manifests
    path: .

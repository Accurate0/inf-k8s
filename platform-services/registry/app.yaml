# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: registry
network:
  ingress:
    - forgejo
resources:
  - {name: registry, type: secret, secretName: registry-managed-secrets}
  - {name: signing, type: secret, secretName: registry-signing-secrets}
  - {name: registry, type: database, secretName: registry-database-secret}
  - {name: storage, type: bucket, provider: r2, bucket: registry, secretName: storage-bucket-secrets}
  - name: traces
    type: tracing
  - name: registry
    type: route
    auth:
      mode: app
      reason: accepts opaque registry tokens and forgejo OIDC
    gateway: internal-gateway
    hosts:
      - registry.ortzi.cloud
    backend:
      name: api
      port: 80
  - name: registry
    type: oidc
    displayName: Registry
    public: true
    allowLocalhostRedirect: true
    groups:
      registry_admins:
        - platform_admins
      registry_users:
        - registry_admins
    scopeMaps:
      registry_users:
        - openid
        - email
        - profile
        - groups
  - name: registry
    type: metrics
    workload: registry
    path: /metrics
    port: http
    interval: 30s
workloads:
  registry:
    image: ghcr.io/accurate0/registry
    replicas: 2
    resources: {memory: 64Mi}
    ports: [3000]
    probes:
      http: {path: /health, port: 3000}
      readiness: {delay: 5, every: 15}
      liveness: {delay: 5, every: 60}
    env:
      S3_ENDPOINT: {bucket: storage, key: S3_ENDPOINT}
      S3_ACCESS_KEY_ID: {bucket: storage, key: S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: {bucket: storage, key: S3_SECRET_ACCESS_KEY}
      CONFIG_PATH: /etc/registry/config.yaml
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - secret: registry
      - secret: signing
      - database: registry
    mounts:
      config: {path: /etc/registry, configMap: registry-config}
    service:
      name: api
      ports:
        - {name: http, port: 80, targetPort: 3000}
    overrides:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: registry
      topologySpreadConstraints:
        - topologyKey: inf-k8s.net/location
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: registry
namespace:
  labels:
    internal-gateway-access: "true"
build:
  image: ghcr.io/accurate0/registry
  args:
    BINARY_NAME: registry
  test:
    run: cargo test --workspace
    db: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    dbName: registry

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: waf-manager
network:
  ingress: []
resources:
  - name: waf-manager
    type: serviceAccount
    clusterRole: waf-manager-access
    clusterRules:
      - {apiGroups: [inf-k8s.net], resources: [wafblocks, wafpolicies], verbs: [get, list, watch, create, patch, delete]}
      - {apiGroups: [inf-k8s.net], resources: [wafblocks/status, wafpolicies/status], verbs: [get, update, patch]}
      - {apiGroups: [gateway.envoyproxy.io], resources: [securitypolicies], verbs: [get, list, watch, create, patch, update, delete]}
      - {apiGroups: [""], resources: [namespaces], verbs: [get]}
      - {apiGroups: [""], resources: [configmaps], verbs: [get, list, delete]}
      - {apiGroups: [coordination.k8s.io], resources: [leases], verbs: [get, create, update, patch]}
  - name: workflows
    type: config
    configMap: waf-manager-workflows
    files:
      - config.yaml
      - workflows/credential-file-probes.yaml
      - workflows/admin-panel-probes.yaml
      - workflows/shell-and-rce-probes.yaml
      - workflows/backup-and-dump-files.yaml
      - workflows/java-exploit-attempts.yaml
      - workflows/path-traversal.yaml
      - workflows/scanner-user-agents.yaml
      - workflows/repo-exposure.yaml
      - workflows/known-exploit-paths.yaml
      - workflows/directory-bruteforce.yaml
      - workflows/high-volume-scanner.yaml
      - workflows/broad-rule-fanout.yaml
      - workflows/nextjs-middleware-bypass.yaml
      - workflows/dev-server-file-leaks.yaml
      - workflows/management-endpoint-probes.yaml
  - {name: dashboard, type: dashboard, configMap: waf-manager-dashboard, file: dashboards/waf-manager.json}
  - {name: logs, type: platform, export: logs}
  - {name: traces, type: platform, export: tracing}
  - {name: waf, type: subgraph, prefix: waf, workload: waf-manager, port: http, path: /v1/graphql, websocket: /v1/graphql/ws, schema: subgraph.graphql, auth: {clients: [graph], groups: [waf_admins]}}
  - {name: waf-manager, type: secret, secretName: waf-manager-managed-secrets}
  - {name: waf-manager, type: database, secretName: waf-manager-db-credentials}
  - name: waf-manager-route
    type: route
    auth:
      mode: oidc
      client: waf-manager
      scopes:
        - openid
        - email
        - profile
      forwardAccessToken: true
      jwt:
        cacheDuration: 3600s
        claimToHeaders:
          - claim: preferred_username
            header: x-waf-user
          - claim: name
            header: x-waf-user-name
          - claim: email
            header: x-waf-user-email
          - claim: sub
            header: x-waf-user-sub
    gateway: internal-gateway
    hosts:
      - waf-manager.ortzi.cloud
    backend:
      name: api
      port: 80
  - name: waf-manager-api
    type: route
    auth:
      mode: jwt
      clients:
        - waf-manager-cli
        - waf-manager
    gateway: internal-gateway
    hosts:
      - waf-manager.ortzi.cloud
    backend:
      name: api
      port: 80
    paths:
      - /api/
  - name: waf-manager
    type: oidc
    secretName: kanidm-waf-manager-oidc
    host: waf-manager.ortzi.cloud
    displayName: WAF Manager
    allowInsecureClientDisablePkce: true
    groups:
      waf_admins:
        - platform_admins
    secretKeys:
      clientId: client-id
      clientSecret: client-secret
  - name: waf-manager-cli
    type: oidc
    secretName: kanidm-waf-manager-cli-oidc
    displayName: WAF Manager CLI
    host: waf-manager.ortzi.cloud
    public: true
    allowLocalhostRedirect: true
    secretKeys:
      clientId: client-id
      clientSecret: client-secret
  - name: waf-manager
    type: metrics
    workload: waf-manager
    path: /metrics
    port: http
    interval: 30s
workloads:
  - name: waf-manager
    image: ghcr.io/accurate0/waf-manager
    replicas: 2
    resources: {memory: 32Mi}
    ports:
      - {name: http, container: 3000, service: 80}
    probes:
      http: {path: /health, port: 3000}
      readiness: {delay: 5, every: 15}
      liveness: {delay: 5, every: 60}
    env:
      POD_NAMESPACE: {field: metadata.namespace}
      POD_NAME: {field: metadata.name}
      DATABASE_URL: {database: waf-manager, key: DATABASE_URL}
      LOKI_URL: {resource: logs}
      OTEL_TRACING_URL: {resource: traces}
      POLICY_NAMESPACE: envoy-gateway-system
      RESYNC_SECONDS: "300"
      FAST_RESYNC_SECONDS: "20"
      WORKFLOWS_CONFIGMAP_PATH: /etc/waf-manager/config/config.yaml
      OIDC_ISSUER: https://idm.anurag.sh/oauth2/openid/waf-manager
      OIDC_JWKS_URI: https://idm.anurag.sh/oauth2/openid/waf-manager/public_key.jwk
      OIDC_AUDIENCE: {oidc: waf-manager, key: client-id}
      OIDC_CLI_ISSUER: https://idm.anurag.sh/oauth2/openid/waf-manager-cli
      OIDC_CLI_AUDIENCE: {oidc: waf-manager-cli, key: client-id, optional: true}
      OIDC_PROVIDERS: https://idm.anurag.sh/oauth2/openid/graph=graph
      OIDC_GROUPS: waf_admins
    envFrom:
      - secret: waf-manager
        optional: true
    mounts:
      workflows: {path: /etc/waf-manager/config, config: workflows}
    serviceAccount: waf-manager
    service:
      name: api
    overrides:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: waf-manager
namespace:
  labels:
    internal-gateway-access: "true"
build:
  image: ghcr.io/accurate0/waf-manager
  context: .
  paths:
    - crates/subgraph/**
  args:
    BINARY_NAME: waf-manager
  test:
    run: cargo test
sources:
  - type: manifests
    path: .

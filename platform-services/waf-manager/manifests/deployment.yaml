# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-manager
  namespace: waf-manager
spec:
  selector:
    matchLabels:
      app: waf-manager
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: waf-manager
    spec:
      serviceAccountName: waf-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: waf-manager
          image: ghcr.io/accurate0/waf-manager
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOKI_URL
              value: http://monitoring-loki.monitoring.svc.cluster.local:3100
            - name: POLICY_NAMESPACE
              value: envoy-gateway-system
            - name: DETECTION_WINDOW
              value: 12h

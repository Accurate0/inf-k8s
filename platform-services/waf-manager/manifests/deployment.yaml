# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-manager
  namespace: waf-manager
spec:
  selector:
    matchLabels:
      app: waf-manager
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: waf-manager
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: waf-manager
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: waf-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: waf-manager
          image: ghcr.io/accurate0/waf-manager
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: waf-manager-database-secret
                  key: DATABASE_URL
            - name: LOKI_URL
              value: http://monitoring-loki.monitoring.svc.cluster.local:3100
            - name: POLICY_NAMESPACE
              value: envoy-gateway-system
            - name: RESYNC_SECONDS
              value: "300"
            - name: WORKFLOWS_CONFIGMAP_PATH
              value: /etc/waf-manager/config/config.yaml
          envFrom:
            - secretRef:
                name: waf-manager-managed-secrets
                optional: true
          volumeMounts:
            - name: workflows
              mountPath: /etc/waf-manager/config
              readOnly: true
      volumes:
        - name: workflows
          configMap:
            name: waf-manager-workflows
            items:
              - key: config.yaml
                path: config.yaml
              - key: credential-file-probes.yaml
                path: workflows/credential-file-probes.yaml
              - key: admin-panel-probes.yaml
                path: workflows/admin-panel-probes.yaml
              - key: shell-and-rce-probes.yaml
                path: workflows/shell-and-rce-probes.yaml
              - key: backup-and-dump-files.yaml
                path: workflows/backup-and-dump-files.yaml
              - key: java-exploit-attempts.yaml
                path: workflows/java-exploit-attempts.yaml
              - key: path-traversal.yaml
                path: workflows/path-traversal.yaml
              - key: scanner-user-agents.yaml
                path: workflows/scanner-user-agents.yaml
              - key: repo-exposure.yaml
                path: workflows/repo-exposure.yaml
              - key: known-exploit-paths.yaml
                path: workflows/known-exploit-paths.yaml
              - key: directory-bruteforce.yaml
                path: workflows/directory-bruteforce.yaml
              - key: high-volume-scanner.yaml
                path: workflows/high-volume-scanner.yaml
              - key: broad-rule-fanout.yaml
                path: workflows/broad-rule-fanout.yaml

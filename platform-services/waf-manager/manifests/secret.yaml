apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: waf-manager-managed-secrets
  namespace: waf-manager
spec:
  refreshInterval: 900s
  secretStoreRef:
    name: infisical-waf-manager-secret
    kind: SecretStore
  target:
    name: waf-manager-managed-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - find:
        conversionStrategy: Default
        decodingStrategy: None
        name:
          regexp: ".*"
        nullBytePolicy: Ignore

apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: waf-manager-api-jwt
  namespace: waf-manager
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: waf-manager-api
  jwt:
    providers:
      - name: waf-manager-cli
        issuer: https://idm.anurag.sh/oauth2/openid/waf-manager-cli
        remoteJWKS:
          cacheDuration: 3600s
          uri: https://idm.anurag.sh/oauth2/openid/waf-manager-cli/public_key.jwk
      - name: waf-manager
        issuer: https://idm.anurag.sh/oauth2/openid/waf-manager
        remoteJWKS:
          cacheDuration: 3600s
          uri: https://idm.anurag.sh/oauth2/openid/waf-manager/public_key.jwk

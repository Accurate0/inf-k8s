apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical-waf-manager-secret
  namespace: waf-manager
spec:
  provider:
    infisical:
      hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
      auth:
        universalAuthCredentials:
          clientId:
            name: universal-auth-credentials
            key: clientId
          clientSecret:
            name: universal-auth-credentials
            key: clientSecret
      secretsScope:
        projectSlug: waf-manager-y-q7x
        environmentSlug: prod
        secretsPath: /
        recursive: false

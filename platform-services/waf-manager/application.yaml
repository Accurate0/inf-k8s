# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: waf-manager
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: platform-services
  sources:
    - chart: k8s-oidc
      repoURL: oci://ghcr.io/accurate0/charts/k8s-oidc
      targetRevision: 0.3.0
      helm:
        valuesObject:
          clients:
            - name: waf-manager
              namespace: waf-manager
              displayName: WAF Manager
              host: waf-manager.inf-k8s.net
              preferShortUsername: true
              allowInsecureClientDisablePkce: true
              secretKeys:
                clientId: client-id
                clientSecret: client-secret
              secretName: kanidm-waf-manager-oidc
              secretNamespace: waf-manager
              annotations:
                inf-k8s.net/app: waf-manager
                inf-k8s.net/repository: https://github.com/Accurate0/inf-k8s
              securityPolicy:
                httpRoute: waf-manager-route
                scopes:
                  - openid
                  - email
                  - profile
                forwardAccessToken: true
                jwt:
                  cacheDuration: 3600s
                  claimToHeaders:
                    - claim: preferred_username
                      header: x-waf-user
                    - claim: name
                      header: x-waf-user-name
                    - claim: email
                      header: x-waf-user-email
                    - claim: sub
                      header: x-waf-user-sub
    - chart: k8s-postgres
      repoURL: oci://ghcr.io/accurate0/charts/k8s-postgres
      targetRevision: 1.0.1
      helm:
        valuesObject:
          databases:
            - name: waf-manager
              namespace: waf-manager
              databaseName: waf_manager
              secretName: waf-manager-db-credentials
              annotations:
                inf-k8s.net/app: waf-manager
                inf-k8s.net/repository: https://github.com/Accurate0/inf-k8s
    - repoURL: https://git.anurag.sh/anurag/k8s.git
      path: platform-services/waf-manager
    - chart: k8s-secrets
      repoURL: oci://ghcr.io/accurate0/charts/k8s-secrets
      targetRevision: 0.6.0
      helm:
        valuesObject:
          defaults:
            namespace: waf-manager
            provider: openbao
            resyncInterval: 900
            annotations:
              inf-k8s.net/app: waf-manager
              inf-k8s.net/repository: https://github.com/Accurate0/inf-k8s
          secrets:
            - name: waf-manager
              managedSecrets:
                - secretName: waf-manager-managed-secrets
    - chart: k8s-http-routes
      repoURL: oci://ghcr.io/accurate0/charts/k8s-http-routes
      targetRevision: 2.3.1
      helm:
        valuesObject:
          routes:
            - name: waf-manager-route
              gateway:
                name: internal-gateway
                namespace: envoy-gateway-system
              hostnames:
                - waf-manager.inf-k8s.net
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: api
                      port: 80
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /
  destination:
    server: https://kubernetes.default.svc
    namespace: waf-manager

# yaml-language-server: $schema=../workflow.schema.json
name: cloud-and-ci-secret-probes
enabled: dry-run
window: 6h
duration: 30d
reason: "automatic: probing for exposed cloud and CI metadata endpoints"
when:
  type: uri_matches
  patterns:
    - "/actuator/env"
    - "/.docker/config.json"
    - "/.kube/config"
    - "/telescope/requests"
    - "/server-status"
    - "/debug/default/view"
  min_count: 1

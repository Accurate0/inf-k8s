# yaml-language-server: $schema=../workflow.schema.json
name: broad-rule-fanout
enabled: dry-run
window: 1h
duration: 48h
reason: "automatic: tripped many distinct rules in a short window"
signals:
  sqli_or_rce: |
    sum(count_over_time({{selector}} {{prefilter}} {{parse}} {{re_client}} {{exact_client}} {{re_id}} | rule_id =~ `(942|932)\d+` [{{window}}]))
when:
  all:
    - type: distinct_rules
      min: 8
    - type: signal
      name: sqli_or_rce
      min: 20

# yaml-language-server: $schema=../workflow.schema.json
name: xss-attempts
enabled: dry-run
window: 6h
duration: 7d
reason: "automatic: sustained cross-site scripting attempts"
signals:
  xss_rules: |
    sum(count_over_time({{selector}} {{prefilter}} {{parse}} {{re_client}} {{exact_client}} {{re_id}} | rule_id =~ `941\d+` [{{window}}]))
when:
  type: signal
  name: xss_rules
  min: 10

# yaml-language-server: $schema=../workflow.schema.json
name: credential-file-probes
enabled: active
window: 6h
duration: 30d
reason: "automatic: probing for exposed credential files"
when:
  all:
    - type: uri_matches
      patterns:
        - "/.env"
        - "/.git/config"
        - "/.aws/credentials"
        - "/.ssh/id_rsa"
        - "/config.json"
      min_count: 2

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: feature-flags
routes:
  feature-flags-api:
    auth:
      mode: app
      reason: admin verified by the app; evaluation only checks client-id, gateway JWT not rolled out yet
    gateway: internal-gateway
    hosts:
      - feature-flags.ortzi.cloud
    paths:
      - /featureflag.v1.Admin/
      - /featureflag.v1.Evaluation/
    timeouts:
      request: 0s
oidc:
  feature-flags:
    displayName: Feature Flags
    public: true
    allowLocalhostRedirect: true
databases:
  feature-flags:
    secretName: feature-flags-db-credentials
secrets:
  - feature-flags
network:
  ingress: []
exports:
  - name: api
    workload: feature-flags
    port: grpc
resources:
  - name: traces
    type: tracing
workloads:
  feature-flags:
    image: ghcr.io/accurate0/feature-flags
    resources:
      requests:
        memory: 32Mi
    ports:
      - name: grpc
        containerPort: 50051
    readinessProbe:
      grpc:
        port: 50051
      initialDelaySeconds: 5
      periodSeconds: 15
    livenessProbe:
      grpc:
        port: 50051
      initialDelaySeconds: 5
      periodSeconds: 60
    uses:
      - traces
    env:
      - name: REDIS_URL
        value: redis://replicated.dragonfly.svc.cluster.local
      - name: OIDC_ISSUER
        value: https://idm.anurag.sh/oauth2/openid/feature-flags
      - name: OIDC_AUDIENCE
        value: feature-flags
    kind: DaemonSet
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    service:
      name: api
      ports:
        - name: grpc
          protocol: TCP
          port: 50051
          targetPort: grpc
          appProtocol: grpc
      trafficDistribution: PreferSameNode
namespace:
  labels:
    internal-gateway-access: "true"
build:
  image: ghcr.io/accurate0/feature-flags
  context: .
  paths:
    - crates/feature-flag/feature-flag-proto/**
    - crates/feature-flag/feature-flag-engine/**
  test:
    run: |
      cargo test
      cd ../../crates/feature-flag
      cargo test
    db: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    dbName: feature_flags
    packages:
      - protobuf-compiler
      - libprotobuf-dev

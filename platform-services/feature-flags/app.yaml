# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: feature-flags
routes:
  feature-flags-api:
    auth:
      mode: app
      reason: admin verified by the app; evaluation only checks client-id, gateway JWT not rolled out yet
    gateway: internal-gateway
    hosts:
      - feature-flags.ortzi.cloud
    backend:
      name: api
      port: 50051
    paths:
      - /featureflag.v1.Admin/
      - /featureflag.v1.Evaluation/
    timeouts:
      request: 0s
oidc:
  feature-flags:
    displayName: Feature Flags
    public: true
    allowLocalhostRedirect: true
databases:
  feature-flags:
    secretName: feature-flags-db-credentials
secrets:
  - feature-flags
network:
  ingress: []
exports:
  - name: api
    workload: feature-flags
    port: grpc
resources:
  - name: traces
    type: tracing
workloads:
  feature-flags:
    image: ghcr.io/accurate0/feature-flags
    kind: DaemonSet
    resources: {memory: 32Mi}
    ports:
      - name: grpc
        containerPort: 50051
    probes:
      grpc: {port: 50051}
      readiness: {delay: 5, every: 15}
      liveness: {delay: 5, every: 60}
    env:
      REDIS_URL: redis://replicated.dragonfly.svc.cluster.local
      OIDC_ISSUER: https://idm.anurag.sh/oauth2/openid/feature-flags
      OIDC_AUDIENCE: feature-flags
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - feature-flags-managed-secrets
      - feature-flags-db-credentials
    secrets: []
    databases: []
    service:
      name: api
      ports:
        - {name: grpc, port: 50051, targetPort: grpc, appProtocol: grpc}
      trafficDistribution: PreferSameNode
    overrides:
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
namespace:
  labels:
    internal-gateway-access: "true"
build:
  image: ghcr.io/accurate0/feature-flags
  context: .
  paths:
    - crates/feature-flag/feature-flag-proto/**
    - crates/feature-flag/feature-flag-engine/**
  test:
    run: |
      cargo test
      cd ../../crates/feature-flag
      cargo test
    db: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    dbName: feature_flags
    packages:
      - protobuf-compiler
      - libprotobuf-dev

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: feature-flags
namespace:
  labels:
    internal-gateway-access: "true"
network:
  ingress: []
exports:
  - {name: api, workload: feature-flags, port: grpc}
resources:
  - {name: feature-flags, type: secret, secretName: feature-flags-managed-secrets}
  - {name: feature-flags, type: database, secretName: feature-flags-db-credentials}
  - {name: cache, type: cache}
  - {name: traces, type: platform, export: tracing}
  - name: feature-flags
    type: subgraph
    prefix: featureFlags
    allowedRootFields: [featureFlags, featureFlag]
    workload: feature-flags
    port: graphql
    path: /v1/graphql
    websocket: /v1/graphql/ws
    schema: subgraph.graphql
    auth:
      clients: [graph]
      groups: [feature_flags_admins]
      scopes:
        - name: feature-flags:flag:read
          description: read flags, segments, history and evaluations, and follow changes
          groups: [feature_flags_admins]
        - name: feature-flags:flag:write
          description: create, update, toggle, archive and delete flags, their variants and rules
          groups: [feature_flags_admins]
        - name: feature-flags:segment:write
          description: create, update and delete segments
          groups: [feature_flags_admins]
        - name: feature-flags:config:apply
          description: reconcile flags and segments from a config file
          groups: [feature_flags_admins]
  - name: feature-flags-api
    type: route
    auth:
      mode: app
      reason: admin verified by the app; evaluation only checks client-id, gateway JWT not rolled out yet
    gateway: internal-gateway
    hosts: [feature-flags.ortzi.cloud]
    backend: {name: api, port: 50051}
    paths: [/featureflag.v1.Admin/, /featureflag.v1.Evaluation/]
    timeouts: {request: 0s}
  - name: feature-flags
    type: oidc
    secretName: kanidm-feature-flags-oidc
    host: feature-flags.ortzi.cloud
    displayName: Feature Flags
    preferShortUsername: true
    public: true
    allowLocalhostRedirect: true
    groups:
      feature_flags_admins: [platform_admins]
workloads:
  - name: feature-flags
    image: registry.anurag.sh/containers/feature-flags
    release: latest
    kind: DaemonSet
    resources: {memory: 32Mi}
    ports:
      - {name: grpc, container: 50051, service: 50051, appProtocol: grpc}
      - {name: graphql, container: 3000, service: 3000}
    probes:
      grpc: {port: 50051}
      readiness: {delay: 5, every: 15}
      liveness: {delay: 5, every: 60}
    env:
      SUBGRAPH_AUTH: {subgraph: feature-flags}
      REDIS_URL: {resource: cache}
      OIDC_ISSUER: https://idm.anurag.sh/oauth2/openid/feature-flags
      OIDC_AUDIENCE: feature-flags
      OIDC_PROVIDERS: https://idm.anurag.sh/oauth2/openid/graph=graph
      OIDC_GROUPS: feature_flags_admins
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - {secret: feature-flags}
      - {database: feature-flags}
    service: {name: api, trafficDistribution: PreferSameNode}
    overrides:
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
build:
  image: registry.anurag.sh/containers/feature-flags
  ci: forgejo
  context: .
  paths: [crates/feature-flag/feature-flag-proto/**, crates/feature-flag/feature-flag-engine/**, crates/subgraph/**]
  test:
    run: |
      cargo test
      cargo test --manifest-path ../../crates/feature-flag/Cargo.toml
    db:
      image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
      databaseName: feature_flags
    packages: [build-essential, pkg-config, protobuf-compiler, libprotobuf-dev]
    toolchain: {rust: 1.99.1}
artifact:
  repo: oci://registry.anurag.sh/manifests/feature-flags
  tag: main

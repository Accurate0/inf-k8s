# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: feature-flags
network:
  ingress: []
exports:
  - name: api
    workload: feature-flags
    port: grpc
resources:
  - {name: feature-flags, type: secret, secretName: feature-flags-managed-secrets}
  - {name: cache, type: cache}
  - {name: feature-flags, type: database, secretName: feature-flags-db-credentials}
  - {name: traces, type: platform, export: tracing}
  - {name: feature-flags, type: subgraph, prefix: featureFlags, workload: feature-flags, port: graphql, path: /v1/graphql, websocket: /v1/graphql/ws, schema: subgraph.graphql, auth: {clients: [graph], groups: [feature_flags_admins]}}
  - name: feature-flags-api
    type: route
    auth:
      mode: app
      reason: admin verified by the app; evaluation only checks client-id, gateway JWT not rolled out yet
    gateway: internal-gateway
    hosts:
      - feature-flags.ortzi.cloud
    backend:
      name: api
      port: 50051
    paths:
      - /featureflag.v1.Admin/
      - /featureflag.v1.Evaluation/
    timeouts:
      request: 0s
  - name: feature-flags
    type: oidc
    secretName: kanidm-feature-flags-oidc
    host: feature-flags.ortzi.cloud
    displayName: Feature Flags
    public: true
    allowLocalhostRedirect: true
    groups:
      feature_flags_admins:
        - platform_admins
workloads:
  - name: feature-flags
    image: ghcr.io/accurate0/feature-flags
    kind: DaemonSet
    resources: {memory: 32Mi}
    ports:
      - {name: grpc, container: 50051, service: 50051, appProtocol: grpc}
      - {name: graphql, container: 3000, service: 3000}
    probes:
      grpc: {port: 50051}
      readiness: {delay: 5, every: 15}
      liveness: {delay: 5, every: 60}
    env:
      REDIS_URL: {resource: cache}
      OIDC_ISSUER: https://idm.anurag.sh/oauth2/openid/feature-flags
      OIDC_AUDIENCE: feature-flags
      OIDC_PROVIDERS: https://idm.anurag.sh/oauth2/openid/graph=graph
      OIDC_GROUPS: feature_flags_admins
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - secret: feature-flags
      - database: feature-flags
    service:
      name: api
      trafficDistribution: PreferSameNode
    overrides:
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
namespace:
  labels:
    internal-gateway-access: "true"
build:
  image: ghcr.io/accurate0/feature-flags
  context: .
  paths:
    - crates/feature-flag/feature-flag-proto/**
    - crates/feature-flag/feature-flag-engine/**
    - crates/subgraph/**
  test:
    run: |
      cargo test
      cd ../../crates/feature-flag
      cargo test
    db: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    dbName: feature_flags
    packages:
      - protobuf-compiler
      - libprotobuf-dev

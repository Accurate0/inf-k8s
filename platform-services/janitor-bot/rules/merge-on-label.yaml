# yaml-language-server: $schema=./rule.schema.json
name: merge-on-label
when:
  all:
    - type: event
      kind: pr
      source: forgejo
    - any:
        - type: repository
          value: anurag/home-gateway
        - type: repository
          value: anurag/k8s
        - type: repository
          value: anurag/solar-panels
    - type: feature_flag
      name: janitor-bot-allow-automerging-rules
      default: true
    - type: has_label
      value: janitor/merge
    - not:
        type: has_conflicts
    - type: is_open
    - not:
        type: bot.has_approved
actions:
  - run:
      - type: approve
      - type: merge
        strategy: squash
        delete_branch: true
      - type: remove_labels
        labels: ["janitor/merge"]

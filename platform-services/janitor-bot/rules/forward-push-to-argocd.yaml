# yaml-language-server: $schema=./rule.schema.json
name: forward-push-to-argocd
when:
  any:
    - all:
        - type: event
          kind: push
          source: github
        - any:
            - type: repository
              value: Accurate0/inf-k8s
            - type: repository
              value: Accurate0/home-gateway
    - all:
        - type: event
          kind: push
          source: forgejo
        - type: repository
          value: anurag/k8s
actions:
  - run:
      - type: proxy_pass
        service: argocd

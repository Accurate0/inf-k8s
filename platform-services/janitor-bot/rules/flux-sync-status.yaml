# yaml-language-server: $schema=./rule.schema.json
name: flux-sync-status
when:
  all:
    - type: event
      kind: sync
      source: flux
    - type: app_changed_in_commit
      owner: anurag
      repo: k8s
actions:
  - run:
      - type: set_commit_status
        target:
          owner: anurag
          repo: k8s
        sha: "{sha}"
        state: "{state}"
        context: "Flux / {sync.app_name}"
        description: "{description}"
        target_url: "https://flux.ortzi.cloud"

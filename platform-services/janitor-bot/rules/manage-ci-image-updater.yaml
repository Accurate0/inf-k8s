# yaml-language-server: $schema=./rule.schema.json
name: manage-ci-image-updater
when:
  all:
    - type: event
      kind: pr
      source: forgejo
    - type: repository
      value: anurag/k8s
    - type: feature_flag
      name: janitor-bot-allow-automerging-rules
      default: true
      context:
        service: "{forgejo_pr.metadata.service}"
    - type: target_branch
      value: main
    - type: author
      value: ci-image-updater
    - type: is_open
actions:
  - when:
      type: has_conflicts
    run:
      - type: remove_labels
        prefixes: [janitor/]
      - type: close
        comment: "Closing: superseded by a newer deploy on `main` (had conflicts)."
        delete_branch: true
  - when:
      all:
        - not:
            type: has_conflicts
        - type: is_latest_published_image
    run:
      - type: close_other_prs
        author: ci-image-updater
        criteria: older_published_image
        match_metadata_fields: [service]
        delete_branch: true
        comment: "Superseded by #{forgejo_pr.pr_number}"
  - when:
      all:
        - ref: global.perth_day
        - not:
            type: has_conflicts
        - type: is_latest_published_image
        - not:
            type: bot.has_approved
    serial: "merge-ci-image-updater:{forgejo_pr.metadata.service}"
    run:
      - type: remove_labels
        labels: [janitor/queued]
      - type: add_labels
        labels: [image-update, automated]
      - type: approve
        comment: "Auto-approved: PR from ci-image-updater"
      - type: merge
        strategy: squash
        delete_branch: true
  - when:
      all:
        - not:
            ref: global.perth_day
        - not:
            type: has_conflicts
        - type: is_latest_published_image
        - not:
            type: has_label
            value: janitor/queued
    run:
      - type: add_labels
        labels: [janitor/queued]

[package]
name = "janitor-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for the janitor-bot admin API"

[[bin]]
name = "janitor"
path = "src/main.rs"

[dependencies]
cli-auth = { path = "../../../crates/cli-auth" }
janitor-webhook = { path = "../webhook" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

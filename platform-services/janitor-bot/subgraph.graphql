"""
Implement the DateTime<Utc> scalar

The input/output is a string in RFC3339 format.
"""
scalar DateTime

"""
A scalar that can represent any JSON value.
"""
scalar JSON

input JanitorCommandInput {
	owner: String!
	repo: String!
	number: Int!
	target: JanitorCommandTarget!
	"""
	The comment body, e.g. `/janitor merge`.
	"""
	body: String!
}

enum JanitorCommandTarget {
	PR
	ISSUE
}

type JanitorEvaluation {
	timestamp: DateTime!
	eventKind: String!
	eventKey: String!
	matchedRules: [JanitorMatchedRule!]!
	elapsedMs: Int!
}

type JanitorMatchedRule {
	name: String!
	dryRun: Boolean!
	actions: [JanitorRuleAction!]!
}

type JanitorMetricLabel {
	name: String!
	value: String!
}

"""
One Prometheus sample from this replica's recorder.
"""
type JanitorMetricSample {
	name: String!
	labels: [JanitorMetricLabel!]!
	value: Float!
}

type JanitorRule implements Node @key(fields: "id") {
	name: String!
	"""
	`true`, `false` or `dry_run`.
	"""
	enabled: String!
	priority: Int!
	dependsOn: [String!]!
	id: ID!
}

type JanitorRuleAction {
	action: String!
	ran: Boolean!
}

type JanitorServiceHealth {
	service: String!
	healthy: Boolean!
	error: String
}

enum JanitorWebhookSource {
	FORGEJO
	GITHUB
	FLUX
}

type Mutation {
	"""
	Re-evaluates every open PR in the background.
	"""
	janitorRunCron: Boolean! @requiresScopes(scopes: [["janitor:action:run"]])
	"""
	Merges every PR labelled janitor/queued in the background.
	"""
	janitorMergeQueued: Boolean! @requiresScopes(scopes: [["janitor:action:run"]])
	"""
	Runs the PR's rules for real in the background.
	"""
	janitorEvaluatePr(owner: String!, repo: String!, number: Int!): Boolean! @requiresScopes(scopes: [["janitor:action:run"]])
	"""
	Dispatches a comment command as if it had been posted on the PR or issue.
	"""
	janitorCommand(input: JanitorCommandInput!): JSON! @requiresScopes(scopes: [["janitor:action:run"]])
	"""
	Feeds a saved webhook payload through its handler as if the source had sent it; the
	event is inferred from the payload when left out. Returns the handler's HTTP status.
	"""
	janitorReplayWebhook(source: JanitorWebhookSource!, event: String, eventType: String, payload: String!): Int! @requiresScopes(scopes: [["janitor:webhook:replay"]])
}

interface Node {
	id: ID!
}

type Query {
	janitorRules: [JanitorRule!]! @requiresScopes(scopes: [["janitor:rule:read"]])
	"""
	This replica's counters and histograms, as Prometheus scrapes them.
	"""
	janitorMetrics: [JanitorMetricSample!]! @requiresScopes(scopes: [["janitor:rule:read"]])
	"""
	Recent rule evaluations, oldest first.
	"""
	janitorEvaluations: [JanitorEvaluation!]! @requiresScopes(scopes: [["janitor:rule:read"]])
	"""
	Reachability of forgejo and github.
	"""
	janitorHealth: [JanitorServiceHealth!]! @requiresScopes(scopes: [["janitor:rule:read"]])
	"""
	Which rules would match the PR, and which actions would run, without running them.
	"""
	janitorDryRun(owner: String!, repo: String!, number: Int!): [JanitorMatchedRule!]! @requiresScopes(scopes: [["janitor:rule:read"]])
}

type Subscription {
	"""
	Rule evaluations as this replica records them.
	"""
	janitorEvaluations: JanitorEvaluation!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
extend schema @link(
	url: "https://specs.apollo.dev/federation/v2.5",
	import: ["@key", "@tag", "@shareable", "@inaccessible", "@override", "@external", "@provides", "@requires", "@composeDirective", "@interfaceObject", "@requiresScopes"]
)

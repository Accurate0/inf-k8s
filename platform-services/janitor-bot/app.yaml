# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: janitor-bot
network:
  ingress: [flux-system, forgejo]
resources:
  - name: rules
    type: config
    configMap: janitor-bot-rules
    files:
      - config.yaml
      - rules/manage-ci-image-updater.yaml
      - rules/manage-renovate-workflows.yaml
      - rules/manage-renovate-dockerfiles.yaml
      - rules/automerge-renovate-terraform.yaml
      - rules/automerge-renovate-rust.yaml
      - rules/retry-renovate-workflow.yaml
      - rules/mirror-commit-status.yaml
      - rules/flux-sync-status.yaml
      - rules/cleanup-on-merge.yaml
      - rules/merge-on-label.yaml
      - rules/clear-queued-on-unmergeable.yaml
      - rules/label-eink-firmware-update.yaml
  - {name: janitor-bot, type: secret, secretName: janitor-bot-managed-secrets}
  - {name: harbor, type: secret, secretName: janitor-bot-harbor-secrets}
  - {name: flags, type: app, app: feature-flags, export: api}
  - {name: forgejo, type: platform, export: forgejo-internal}
  - {name: traces, type: platform, export: tracing}
  - name: janitor
    type: subgraph
    prefixes: [janitor]
    workload: janitor-bot
    port: http
    path: /v1/graphql
    websocket: /v1/graphql/ws
    schema: subgraph.graphql
    auth:
      clients: [graph]
      groups: [janitor_bot_admins]
      scopes:
        - name: janitor:rule:read
          description: read rules, metrics, evaluations, health and dry runs
          grantedBy:
            - {groups: [janitor_bot_admins]}
        - name: janitor:action:run
          description: run cron rules, merge the queue, evaluate prs and dispatch commands
          grantedBy:
            - {groups: [janitor_bot_admins]}
        - name: janitor:webhook:replay
          description: replay webhook events
          grantedBy:
            - {groups: [janitor_bot_admins]}
  - name: janitor-bot-route
    type: route
    auth: {mode: app, reason: "app verifies kanidm JWTs, gateway JWT not rolled out yet"}
    gateways:
      - {gateway: internal-gateway, hosts: [janitor-bot.ortzi.cloud]}
    backend: {name: api, port: 80}
    paths: [/]
  - name: janitor-bot-public-route
    type: route
    auth: {mode: app, reason: "github webhook, verified by its signature"}
    gateways:
      - {gateway: public-gateway, hosts: [janitor-bot.anurag.sh], dns: {provider: cloudflare, proxied: true}}
    backend: {name: api, port: 80}
    paths:
      - {type: Exact, value: /github/webhook}
    ratelimit: {requests: 5, per: Second, header: x-real-ip}
  - name: janitor-bot
    type: oidc
    secretName: kanidm-janitor-bot-oidc
    displayName: Janitor Bot
    preferShortUsername: true
    host: janitor-bot.ortzi.cloud
    public: true
    allowLocalhostRedirect: true
    scopes: [openid, email, profile, groups]
  - {name: janitor-bot, type: metrics, workload: janitor-bot, path: /admin/metrics, port: http, interval: 30s}
workloads:
  - name: janitor-bot
    image: registry.anurag.sh/containers/janitor-bot
    release: latest
    resources: {memory: 32Mi}
    ports:
      - {name: http, container: 3000, service: 80}
    probes:
      http: {path: /health, port: 3000}
      readiness: {delay: 5, every: 15}
      liveness: {delay: 5, every: 60}
    env:
      SUBGRAPH_AUTH: {subgraph: janitor}
      OIDC_ISSUER: https://idm.anurag.sh/oauth2/openid/janitor-bot
      OIDC_AUDIENCE: janitor-bot
      OIDC_GROUPS: janitor_bot_admins
      OIDC_PROVIDERS: https://idm.anurag.sh/oauth2/openid/graph=graph
      RULES_CONFIGMAP_PATH: /etc/janitor-bot/rules/config.yaml
      FORGEJO_INSTANCE_URL: {resource: forgejo}
      OTEL_TRACING_URL: {resource: traces}
      FEATURE_FLAGS_URL: {resource: flags}
      HARBOR_USERNAME: {secret: harbor, key: USERNAME}
      HARBOR_PASSWORD: {secret: harbor, key: PASSWORD}
    envFrom:
      - {secret: janitor-bot}
    mounts:
      tmp: {path: /tmp, emptyDir: true}
      rules: {path: /etc/janitor-bot/rules, config: rules}
    service: {name: api}
    overrides:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
build:
  image: registry.anurag.sh/containers/janitor-bot
  ci: forgejo
  context: .
  paths: [crates/subgraph/**, platform-services/registry/api/**]
  args:
    BINARY_NAME: janitor-bot
  test:
    run: cargo test
    packages: [build-essential, pkg-config, protobuf-compiler, libprotobuf-dev]
    toolchain: {rust: 1.99.1}
sources:
  - type: manifests
    path: .
artifact:
  repo: oci://registry.anurag.sh/manifests/janitor-bot
  tag: main

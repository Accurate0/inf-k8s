# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: janitor-bot
network:
  ingress:
    - argocd
    - forgejo
resources:
  - name: rules
    type: config
    configMap: janitor-bot-rules
    files:
      - config.yaml
      - rules/manage-ci-image-updater.yaml
      - rules/manage-renovate-workflows.yaml
      - rules/manage-renovate-dockerfiles.yaml
      - rules/automerge-renovate-terraform.yaml
      - rules/automerge-renovate-rust.yaml
      - rules/retry-renovate-workflow.yaml
      - rules/argocd-diff-renovate.yaml
      - rules/mirror-commit-status.yaml
      - rules/argocd-sync-status.yaml
      - rules/forward-push-to-argocd.yaml
      - rules/cleanup-on-merge.yaml
      - rules/merge-on-label.yaml
      - rules/clear-queued-on-unmergeable.yaml
      - rules/label-eink-firmware-update.yaml
  - {name: argocd, type: platform, export: argocd}
  - {name: forgejo, type: platform, export: forgejo-internal}
  - {name: janitor-bot, type: secret, secretName: janitor-bot-managed-secrets}
  - name: flags
    type: app
    app: feature-flags
    export: api
  - {name: traces, type: platform, export: tracing}
  - {name: janitor, type: subgraph, prefix: janitor, workload: janitor-bot, port: http, path: /v1/graphql, websocket: /v1/graphql/ws, schema: subgraph.graphql, auth: {clients: [graph], groups: [janitor_bot_admins]}}
  - name: janitor-bot-route
    type: route
    auth:
      mode: app
      reason: app verifies kanidm JWTs, gateway JWT not rolled out yet
    gateway: internal-gateway
    hosts:
      - janitor-bot.ortzi.cloud
    backend:
      name: api
      port: 80
  - name: janitor-bot-public-route
    type: route
    auth:
      mode: app
      reason: github webhook, verified by its signature
    hosts:
      - janitor-bot.anurag.sh
    backend:
      name: api
      port: 80
    paths:
      - type: Exact
        value: /github/webhook
    dns: {provider: cloudflare, proxied: true}
    ratelimit: {requests: 5, per: Second, header: x-real-ip}
  - name: janitor-bot
    type: oidc
    secretName: kanidm-janitor-bot-oidc
    displayName: Janitor Bot
    host: janitor-bot.ortzi.cloud
    public: true
    allowLocalhostRedirect: true
    scopes:
      - openid
      - email
      - profile
      - groups
  - name: janitor-bot
    type: metrics
    workload: janitor-bot
    path: /admin/metrics
    port: http
    interval: 30s
workloads:
  - name: janitor-bot
    image: registry.anurag.sh/containers/janitor-bot
    resources: {memory: 32Mi}
    ports:
      - {name: http, container: 3000, service: 80}
    probes:
      http: {path: /health, port: 3000}
      readiness: {delay: 5, every: 15}
      liveness: {delay: 5, every: 60}
    env:
      OIDC_ISSUER: https://idm.anurag.sh/oauth2/openid/janitor-bot
      OIDC_AUDIENCE: janitor-bot
      OIDC_GROUPS: janitor_bot_admins
      OIDC_PROVIDERS: https://idm.anurag.sh/oauth2/openid/graph=graph
      RULES_CONFIGMAP_PATH: /etc/janitor-bot/rules/config.yaml
      ARGOCD_SERVER: {resource: argocd}
      FORGEJO_INSTANCE_URL: {resource: forgejo}
      OTEL_TRACING_URL: {resource: traces}
      FEATURE_FLAGS_URL: {resource: flags}
    envFrom:
      - secret: janitor-bot
    mounts:
      tmp: {path: /tmp, emptyDir: true}
      rules: {path: /etc/janitor-bot/rules, config: rules}
    service:
      name: api
    overrides:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
namespace:
  labels:
    internal-gateway-access: "true"
    gateway.inf-k8s.net/anurag-sh: "true"
build:
  image: registry.anurag.sh/containers/janitor-bot
  ci: forgejo
  context: .
  paths:
    - crates/subgraph/**
  args:
    BINARY_NAME: janitor-bot
  test:
    run: cargo test
    packages:
      - build-essential
      - pkg-config
      - protobuf-compiler
      - libprotobuf-dev
    setup: |
      curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1 && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
      chmod +x /usr/local/bin/argocd
sources:
  - type: manifests
    path: .

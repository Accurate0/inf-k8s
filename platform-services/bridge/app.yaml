# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: bridge
namespace:
  name: graph
network:
  policy: false
  ingress: []
resources:
  - {name: bridge, type: secret, secretName: bridge-managed-secrets}
  - name: bridge
    type: serviceAccount
    clusterRole: bridge-reader
    clusterRules:
      - apiGroups: [image.toolkit.fluxcd.io]
        resources: [imagepolicies, imagerepositories, imageupdateautomations]
        verbs: [get, list, watch]
      - {apiGroups: [helm.toolkit.fluxcd.io], resources: [helmreleases], verbs: [get, list, watch]}
      - {apiGroups: [kustomize.toolkit.fluxcd.io], resources: [kustomizations], verbs: [get, list, watch]}
      - apiGroups: [source.toolkit.fluxcd.io]
        resources: [ocirepositories, gitrepositories]
        verbs: [get, list, watch]
      - {apiGroups: [apps], resources: [deployments, statefulsets, daemonsets, replicasets], verbs: [get, list, watch]}
      - {apiGroups: [batch], resources: [cronjobs, jobs], verbs: [get, list, watch]}
      - {apiGroups: [''], resources: [pods, configmaps], verbs: [get, list, watch]}
  - {name: forgejo, type: platform, export: forgejo-internal}
  - name: bridge
    type: subgraph
    prefixes: [flux, forgejo, kubernetes]
    workload: bridge
    port: http
    path: /v1/graphql
    schema: schema.graphql
    auth:
      clients: [graph]
      scopes:
        - name: flux:app:read
          description: read flux apps, their images and how far each build has got
          groups: [platform_admins]
        - name: kubernetes:workload:read
          description: read workloads and their pods' health
          groups: [platform_admins]
        - {name: forgejo:run:read, description: 'read commits, ci runs and their jobs', groups: [platform_admins]}
        - {name: forgejo:log:read, description: read ci job logs, groups: [platform_admins]}
workloads:
  - name: bridge
    image: registry.anurag.sh/containers/bridge
    release: latest
    replicas: 2
    resources: {memory: 96Mi, memoryLimit: 256Mi}
    ports:
      - {name: http, container: 4000, service: 80}
    probes:
      http: {path: /health, port: 4000}
      readiness: {delay: 3, every: 10}
      liveness: {delay: 3, every: 30}
    env:
      SUBGRAPH_AUTH: {subgraph: bridge}
      FORGEJO_URL: {resource: forgejo}
      NODE_EXTRA_CA_CERTS: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    envFrom:
      - {secret: bridge}
    serviceAccount: bridge
    service: {name: bridge}
build:
  image: registry.anurag.sh/containers/bridge
  ci: forgejo
  test:
    run: pnpm install --frozen-lockfile && pnpm check && pnpm test
    toolchain: {node: 26.12.1}
sources:
  - type: manifests
    path: .
artifact:
  repo: oci://registry.anurag.sh/manifests/bridge
  tag: main

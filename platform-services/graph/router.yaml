# generated by `ortzi app supergraph` from every subgraph resource; edit app.yaml or the base config instead
supergraph:
  source: file
  path: /etc/graph/supergraph.graphql
  poll_interval: 30s
http:
  host: 0.0.0.0
  port: 4000
  graphql_endpoint: /v1/graphql
websocket:
  enabled: true
  headers:
    source: connection
subscriptions:
  enabled: true
  websocket:
    subgraphs:
      home-gateway:
        path: /v1/graphql/ws
headers:
  all:
    request:
      - propagate:
          named:
            - Authorization
            - X-Api-Key
            - X-Real-IP
telemetry:
  resource:
    attributes:
      service.name: graph-router
  tracing:
    collect:
      sampling: 1
      parent_based_sampler: true
    propagation:
      trace_context: true
    exporters:
      - kind: otlp
        enabled: true
        protocol: http
        endpoint:
          expression: env("OTEL_TRACING_URL")

# generated by `ortzi app supergraph` from every subgraph resource; edit app.yaml or the base config instead
supergraph:
  source: storage
  storage_id: supergraph
  location: supergraph.graphql
  poll_interval: 30s
storages:
  supergraph:
    type: s3
    bucket:
      expression: env("S3_BUCKET")
    endpoint:
      expression: env("S3_ENDPOINT")
    region:
      expression: env("S3_REGION")
    allow_http: true
    virtual_hosted_style: false
    credentials:
      type: static
      access_key_id:
        expression: env("S3_ACCESS_KEY_ID")
      secret_access_key:
        expression: env("S3_SECRET_ACCESS_KEY")
http:
  host: 0.0.0.0
  port: 4000
  graphql_endpoint: /v1/graphql
cors:
  enabled: true
  allow_any_origin: false
  allow_credentials: false
  allow_headers:
    - Content-Type
    - Authorization
  methods:
    - GET
    - POST
    - OPTIONS
  policies:
    - origins:
        - https://spotify.ortzi.cloud
websocket:
  enabled: true
  headers:
    source: connection
subscriptions:
  enabled: true
  websocket:
    subgraphs:
      home:
        path: /v1/graphql/ws
headers:
  all:
    request:
      - propagate:
          named:
            - Authorization
            - X-Api-Key
            - X-Real-IP
telemetry:
  resource:
    attributes:
      service.name: graph-router
  tracing:
    collect:
      sampling: 1
      parent_based_sampler: true
    propagation:
      trace_context: true
    exporters:
      - kind: otlp
        enabled: true
        protocol: http
        endpoint:
          expression: env("OTEL_TRACING_URL")
plugins:
  node:
    enabled: true
    config:
      subgraph: node
      types:
        - SpotifyAccount
        - SpotifyArtist
        - SpotifyExport
        - SpotifyExportFile
        - SpotifyItem

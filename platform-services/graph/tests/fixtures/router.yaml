supergraph:
  source: file
  path: ./supergraph.graphql
http:
  host: 127.0.0.1
  graphql_endpoint: /v1/graphql
traffic_shaping:
  router:
    request_timeout: 2s
    max_long_lived_clients: 2
websocket:
  enabled: true
  headers:
    source: connection
subscriptions:
  enabled: true
  websocket:
    subgraphs:
      open:
        path: /v1/graphql/ws
      gated:
        path: /v1/graphql/ws
headers:
  all:
    request:
      - propagate:
          named: [Authorization]
introspection:
  expression: .request.jwt.authenticated == true
demand_control:
  enabled: true
  operation_cost:
    max: 10000
    mode: measure
  default_list_size:
    all: 50
  subgraphs_budget:
    mode: measure
persisted_documents:
  enabled: true
  require_id: true
  storage:
    type: file
    path: ./persisted-documents.json
plugins:
  diagnostics:
    enabled: true
  ratelimit:
    enabled: true
    config:
      authenticated: {requests: {requests}, per: 10s}
      anonymous: {requests: {requests}, per: 10s}
  anonymous:
    enabled: true
  node:
    enabled: true
    config:
      subgraph: node
      types: [OpenThing]
  access:
    enabled: true
    config:
      external_issuers:
        forgejo: "{forgejo}"
      subgraphs:
        gated:
          issuers: ["{issuer}"]
          groups: [graph_testers]
          external:
            - issuer: forgejo
              claims: {repository: "anurag/*", ref: refs/heads/main}
jwt:
  enabled: true
  require_authentication: false
  jwks_providers:
    - source: remote
      url: "{issuer}/public_key.jwk"
      prefetch: true
      refresh_on_unknown_kid: 30s
    - source: remote
      url: "{forgejo}/.well-known/keys"
      prefetch: true
      refresh_on_unknown_kid: 30s
  issuers: ["{issuer}", "{forgejo}"]
laboratory:
  enabled: false

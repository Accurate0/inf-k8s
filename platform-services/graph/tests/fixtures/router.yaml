supergraph:
  source: file
  path: ./supergraph.graphql
  poll_interval: 200ms
http:
  host: 127.0.0.1
  graphql_endpoint: /v1/graphql
traffic_shaping:
  all:
    request_timeout: 1s
  router:
    request_timeout: 2s
    max_long_lived_clients: 2
websocket:
  enabled: true
  headers:
    source: connection
subscriptions:
  enabled: true
  websocket:
    subgraphs:
      open:
        path: /v1/graphql/ws
      gated:
        path: /v1/graphql/ws
headers:
  all:
    request:
      - propagate:
          named: [Authorization]
telemetry:
  client_identification:
    name_header: x-graph-client-name
    version_header: x-graph-client-version
  metrics:
    exporters:
      - kind: prometheus
        enabled: true
        path: /metrics
authorization:
  directives:
    enabled: true
    unauthorized:
      mode: filter
introspection:
  expression: .request.jwt.authenticated == true
demand_control:
  enabled: true
  operation_cost:
    max: 10000
    mode: measure
  default_list_size:
    all: 50
  subgraphs_budget:
    mode: measure
persisted_documents:
  enabled: true
  require_id: true
  storage:
    type: file
    path: ./persisted-documents.json
plugins:
  diagnostics:
    enabled: true
    config:
      grafana_url: https://grafana.ortzi.cloud/
  ratelimit:
    enabled: true
    config:
      authenticated: {requests: {requests}, per: 10s}
      anonymous: {requests: {requests}, per: 10s}
      cost:
        authenticated: {budget: {budget}, per: 10s}
        anonymous: {budget: {budget}, per: 10s}
  anonymous:
    enabled: true
  me:
    enabled: true
    config:
      subgraph: me
  node:
    enabled: true
    config:
      subgraph: node
      types: [OpenThing]
  access:
    enabled: true
    config:
      passport: {seed_env: GRAPH_PASSPORT_SEED, ttl_secs: 60}
      issuers:
        kanidm: {kind: kanidm, base: "{kanidm}"}
        forgejo: {kind: external, issuer: "{forgejo}"}
      scopes:
        "open:note:read":
          forgejo:
            - {repository: "anurag/*", ref: refs/heads/main}
      subgraphs:
        gated:
          scopes: ["gated:secret:read"]
          kanidm: {clients: [graph], groups: [graph_testers]}
          forgejo:
            - {repository: "anurag/*", ref: refs/heads/main}
jwt:
  enabled: true
  require_authentication: false
  jwks_providers:
    - source: remote
      url: "{issuer}/public_key.jwk"
      prefetch: true
      refresh_on_unknown_kid: 30s
    - source: remote
      url: "{forgejo}/.well-known/keys"
      prefetch: true
      refresh_on_unknown_kid: 30s
  issuers: ["{issuer}", "{forgejo}"]
laboratory:
  enabled: false

type Query {
  homeAuth: HomeAuthObject!
  homeHomeAssistant: HomeHomeAssistantObject!
  """
  Every configured entity and its current state. Entity types the caller
  lacks a `graphql:<type>:read` scope for are silently omitted — this query
  never errors on missing permissions.
  The dashboard sections, in display order, with their titles. Categorising
  a device kind is a backend concern — the frontend renders whatever order
  and titles this returns.
  """
  homeEntitySections: [HomeEntitySection!]!
  homeDeviceConnections: [HomeDeviceConnection!]!
  homeEntities: [HomeEntity!]!
  homeMediaPlayer(id: IdOrAlias!): HomeMediaPlayerEntity!
  homeLight(id: IdOrAlias!): HomeLightEntity!
  homeDoor(id: IdOrAlias!): HomeDoorEntity!
  homePresence(id: IdOrAlias!): HomePresenceEntity!
  homeEnvironment(id: IdOrAlias!): HomeEnvironmentEntity!
  homePlant(id: IdOrAlias!): HomePlantEntity!
  homeEinkDisplay(id: IdOrAlias!): HomeEinkDisplayEntity!
  homeRobotVacuum(id: IdOrAlias!): HomeRobotVacuumEntity!
  homeGarageDoor(id: IdOrAlias!): HomeGarageDoorEntity!
  homeAirPurifier(id: IdOrAlias!): HomeAirPurifierEntity!
  homeSolar: HomeSolarObject!
  homeEnergy: HomeEnergyObject!
  homeWeather(input: HomeWeatherInput!): HomeWeatherObject!
  homeWoolworths: HomeWoolworthsObject!
  homeTransperth: HomeTransperthObject!
  homeFuelwatch(postcode: Int): HomeFuelWatchObject!
  homeUnraid: HomeUnraid
  homeWorkflows: [HomeWorkflowStatus!]!
  homeMode: HomeModeStatus!
  homeWorkflowRuns(slug: String, eventId: UUID, limit: Int): [HomeWorkflowRun!]!
  homeJellyfin: HomeJellyfinObject!
  homeAdhocCronTasks: [HomeAdhocCronTaskStatus!]!
  homeAdhocTasks: [HomeAdhocTaskStatus!]!
  homePushNotifications(limit: Int): [HomePushNotification!]!
  homeLuaApi: HomeLuaApiObject!
  node(id: ID!): Node
  spotifyAccounts: [SpotifyAccount!]!
  spotifyAccount(slug: String!): SpotifyAccount
  """
  Listening stats across the filtered plays.
  """
  spotifyStats(
    filter: SpotifyStatsFilter! = {accounts: [], from: null, to: null, kinds: [TRACK], minMsPlayed: 30000, timeZone: "Australia/Perth"}
  ): SpotifyStats!
  """
  Search tracks, episodes and artists by name.

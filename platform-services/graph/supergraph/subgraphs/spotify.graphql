}

type SpotifyUploadExportFilePayload {
	status: SpotifyUploadStatus!
	file: SpotifyExportFile
}

enum SpotifyUploadStatus {
	IMPORTED
	"""
	Already imported for this account; nothing was changed.
	"""
	DUPLICATE
	"""
	The file kind is not imported.
	"""
	UNSUPPORTED
}


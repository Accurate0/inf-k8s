"""
Implement the DateTime<Utc> scalar

The input/output is a string in RFC3339 format.
"""
scalar DateTime

type Mutation {
	spotifyCreateAccount(input: SpotifyCreateAccountInput!): SpotifyCreateAccountPayload!
	spotifyCreateExport(input: SpotifyCreateExportInput!): SpotifyCreateExportPayload! @inaccessible
	spotifyUploadExportFile(input: SpotifyUploadExportFileInput!, file: Upload!): SpotifyUploadExportFilePayload! @inaccessible
	spotifyFinalizeExport(input: SpotifyFinalizeExportInput!): SpotifyFinalizeExportPayload! @inaccessible
}

"""
ISO 8601 calendar date without timezone.
Format: %Y-%m-%d

# Examples

* `1994-11-13`
* `2000-02-24`
"""
scalar NaiveDate

interface Node {
	id: ID!
}

"""
Information about pagination in a connection
"""
type PageInfo @shareable {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

type Query {
	spotifyAccounts: [SpotifyAccount!]!
	spotifyAccount(slug: String!): SpotifyAccount
	"""
	Listening stats across the filtered plays.
	"""
	spotifyStats(filter: SpotifyStatsFilter! = {accounts: [], from: null, to: null, kinds: [TRACK], minMsPlayed: 30000, timeZone: "Australia/Perth"}): SpotifyStats!
	"""
	Search tracks, episodes and artists by name.
	"""
	spotifySearch(query: String!): SpotifySearch!
	spotifyItem(uri: String!): SpotifyItem
	spotifyArtist(name: String!): SpotifyArtist
	"""
	Progress of Spotify Web API enrichment (metadata, genres, artwork).
	"""
	spotifyEnrichment: SpotifyEnrichment!
	"""
	Whether a file with this sha256 has already been imported for the account, so clients
	can skip uploading it.
	"""
	spotifyFileExists(account: String!, sha256: String!): Boolean! @inaccessible
}


# generated by `ortzi app supergraph` from every subgraph resource; edit app.yaml or the base config instead
# generated at 2026-11-25T12:24:50.391Z
supergraph:
  source: storage
  storage_id: supergraph
  location: supergraph.graphql
  poll_interval: 30s
storages:
  supergraph:
    type: s3
    bucket:
      expression: env("S3_BUCKET")
    endpoint:
      expression: env("S3_ENDPOINT")
    region:
      expression: env("S3_REGION")
    allow_http: true
    virtual_hosted_style: false
    credentials:
      type: static
      access_key_id:
        expression: env("S3_ACCESS_KEY_ID")
      secret_access_key:
        expression: env("S3_SECRET_ACCESS_KEY")
http:
  host: 0.0.0.0
  port: 4000
  graphql_endpoint: /v1/graphql
cors:
  enabled: true
  allow_any_origin: false
  allow_credentials: false
  allow_headers:
    - Content-Type
    - Authorization
    - x-graph-client-name
    - x-graph-client-version
  methods:
    - GET
    - POST
    - OPTIONS
  policies:
    - origins:
        - https://spotify.ortzi.cloud
websocket:
  enabled: true
  headers:
    source: connection
subscriptions:
  enabled: true
  websocket:
    subgraphs:
      bom:
        path: /v1/graphql/ws
      home:
        path: /v1/graphql/ws
      ai-gateway:
        path: /v1/graphql/ws
      feature-flags:
        path: /v1/graphql/ws
      janitor:
        path: /v1/graphql/ws
      registry:
        path: /v1/graphql/ws
      waf:
        path: /v1/graphql/ws
headers:
  all:
    request:
      - propagate:
          named:
            - Authorization
            - X-Real-IP
telemetry:
  resource:
    attributes:
      service.name: graph-router
  client_identification:
    name_header: x-graph-client-name
    version_header: x-graph-client-version
    ip_header: x-real-ip
  metrics:
    exporters:
      - kind: prometheus
        enabled: true
        port: 9090
        path: /metrics
  tracing:
    collect:
      sampling: 1
      parent_based_sampler: true
    propagation:
      trace_context: true
    exporters:
      - kind: otlp
        enabled: true
        protocol: http
        endpoint:
          expression: env("OTEL_TRACING_URL")
traffic_shaping:
  all:
    request_timeout: 15s
    dedupe_enabled: true
  router:
    dedupe:
      enabled: true
      headers:
        include:
          - authorization
introspection:
  expression: .request.jwt.authenticated == true
demand_control:
  enabled: true
  operation_cost:
    max: 10000
    mode: measure
    expose_headers:
      max: false
      estimated: false
      actual: false
  default_list_size:
    all: 50
  subgraphs_budget:
    mode: measure
plugins:
  diagnostics:
    enabled: true
    config:
      grafana_url: https://grafana.ortzi.cloud/
  ratelimit:
    enabled: true
    config:
      authenticated:
        requests: 20
        per: 1s
      anonymous:
        requests: 5
        per: 1s
      cost:
        authenticated:
          budget: 50000
          per: 1m
        anonymous:
          budget: 5000
          per: 1m
  anonymous:
    enabled: true
  node:
    enabled: true
    config:
      subgraph: node
      types:
        - AiGatewayKey
        - AiGatewayModel
        - AiGatewayModelPrice
        - AiGatewayUsageEvent
        - BomRadarFrame
        - BomRadarLocation
        - BomSatellite
        - BomSatelliteFrame
        - FeatureFlagsChange
        - FeatureFlagsFlag
        - FeatureFlagsSegment
        - JanitorRule
        - RegistryArtifact
        - RegistryAuditEntry
        - RegistryImage
        - RegistryImageRepository
        - RegistryPackage
        - RegistryPublishToken
        - RegistrySigningKey
        - RegistryTrustedPublisher
        - RegistryVersion
        - SpotifyAccount
        - SpotifyArtist
        - SpotifyExport
        - SpotifyExportFile
        - SpotifyItem
        - WafAllowlistEntry
        - WafBlock
        - WafIpReport
        - WafWorkflow
  access:
    enabled: true
    config:
      external_issuers:
        forgejo: https://git.anurag.sh/api/actions
      scopes:
        registry:package:read:
          external:
            - issuer: forgejo
              claims:
                repository: "*"
        registry:image:read:
          external:
            - issuer: forgejo
              claims:
                repository: "*"
        registry:package:publish:
          external:
            - issuer: forgejo
              claims:
                repository: "*"
      subgraphs:
        bom:
          issuers:
            - https://idm.anurag.sh/oauth2/openid/graph
          groups:
            - bom_users
          scopes:
            - bom:radar:read
            - bom:forecast:read
        home:
          issuers:
            - https://idm.anurag.sh/oauth2/openid/graph
            - https://idm.anurag.sh/oauth2/openid/home-gateway
          groups:
            - home_gateway_readers
          scopes:
            - home:api:access
        maccas:
          issuers:
            - https://idm.anurag.sh/oauth2/openid/graph
          groups:
            - platform_admins
          scopes:
            - maccas:offer:read
            - maccas:offer:write
            - maccas:points:read
        spotify:
          issuers:
            - https://idm.anurag.sh/oauth2/openid/spotify
            - https://idm.anurag.sh/oauth2/openid/graph
          groups:
            - spotify_users
          scopes:
            - spotify:history:read
            - spotify:account:write
            - spotify:export:write
        ai-gateway:
          issuers:
            - https://idm.anurag.sh/oauth2/openid/graph
          groups:
            - ai_gateway_admins
          scopes:
            - ai-gateway:key:read
            - ai-gateway:key:write
            - ai-gateway:model:read
            - ai-gateway:price:write
            - ai-gateway:usage:read
            - ai-gateway:chat:use
        feature-flags:
          issuers:
            - https://idm.anurag.sh/oauth2/openid/graph
          groups:
            - feature_flags_admins
          scopes:
            - feature-flags:flag:read
            - feature-flags:flag:write
            - feature-flags:segment:write
            - feature-flags:config:apply
        janitor:
          issuers:
            - https://idm.anurag.sh/oauth2/openid/graph
          groups:
            - janitor_bot_admins
          scopes:
            - janitor:rule:read
            - janitor:action:run
            - janitor:webhook:replay
        registry:
          issuers:
            - https://idm.anurag.sh/oauth2/openid/graph
            - https://idm.anurag.sh/oauth2/openid/registry
          groups:
            - registry_users
            - registry_admins
          scopes:
            - registry:package:read
            - registry:image:read
            - registry:package:write
            - registry:package:publish
            - registry:publisher:manage
            - registry:token:manage
            - registry:audit:read
        waf:
          issuers:
            - https://idm.anurag.sh/oauth2/openid/graph
          groups:
            - waf_admins
          scopes:
            - waf:block:read
            - waf:block:write
            - waf:allowlist:write
laboratory:
  enabled: false
persisted_documents:
  enabled: true
  require_id: true
  storage:
    type: storage
    storage_id: supergraph
    location: persisted-documents.json
    poll_interval: 30s
jwt:
  enabled: true
  require_authentication: false
  jwks_providers:
    - source: remote
      url: https://idm.anurag.sh/oauth2/openid/graph/public_key.jwk
      refresh_on_unknown_kid: 30s
    - source: remote
      url: https://idm.anurag.sh/oauth2/openid/home-gateway/public_key.jwk
      refresh_on_unknown_kid: 30s
    - source: remote
      url: https://idm.anurag.sh/oauth2/openid/registry/public_key.jwk
      refresh_on_unknown_kid: 30s
    - source: remote
      url: https://idm.anurag.sh/oauth2/openid/spotify/public_key.jwk
      refresh_on_unknown_kid: 30s
    - source: remote
      url: https://git.anurag.sh/api/actions/.well-known/keys
      refresh_on_unknown_kid: 30s
  issuers:
    - https://idm.anurag.sh/oauth2/openid/graph
    - https://idm.anurag.sh/oauth2/openid/home-gateway
    - https://idm.anurag.sh/oauth2/openid/registry
    - https://idm.anurag.sh/oauth2/openid/spotify
    - https://git.anurag.sh/api/actions
  audiences:
    - graph
    - home-gateway
    - registry
    - spotify
    - graph.ortzi.cloud

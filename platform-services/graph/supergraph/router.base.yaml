supergraph:
  source: storage
  storage_id: supergraph
  location: supergraph.graphql
  poll_interval: 30s
storages:
  supergraph:
    type: s3
    bucket: {expression: env("S3_BUCKET")}
    endpoint: {expression: env("S3_ENDPOINT")}
    region: {expression: env("S3_REGION")}
    allow_http: true
    virtual_hosted_style: false
    credentials:
      type: static
      access_key_id: {expression: env("S3_ACCESS_KEY_ID")}
      secret_access_key: {expression: env("S3_SECRET_ACCESS_KEY")}
http:
  host: 0.0.0.0
  port: 4000
  graphql_endpoint: /v1/graphql
cors:
  enabled: true
  allow_any_origin: false
  allow_credentials: false
  allow_headers: [Content-Type, Authorization, x-graph-client-name, x-graph-client-version]
  methods: [GET, POST, OPTIONS]
  policies:
    - origins: [https://spotify.ortzi.cloud]
websocket:
  enabled: true
  headers:
    source: connection
subscriptions:
  enabled: true
headers:
  all:
    request:
      - propagate:
          named: [Authorization, X-Real-IP]
telemetry:
  resource:
    attributes:
      service.name: graph-router
  client_identification:
    name_header: x-graph-client-name
    version_header: x-graph-client-version
    ip_header: x-real-ip
  metrics:
    exporters:
      - kind: prometheus
        enabled: true
        port: 9090
        path: /metrics
  tracing:
    collect:
      sampling: 1.0
      parent_based_sampler: true
    propagation:
      trace_context: true
    exporters:
      - kind: otlp
        enabled: true
        protocol: http
        endpoint:
          expression: env("OTEL_TRACING_URL")
traffic_shaping:
  all:
    request_timeout: 15s
    dedupe_enabled: true
  router:
    dedupe:
      enabled: true
      headers:
        include: [authorization]
introspection:
  expression: .request.jwt.authenticated == true
demand_control:
  enabled: true
  operation_cost:
    max: 10000
    mode: measure
    expose_headers: {max: false, estimated: false, actual: false}
  default_list_size:
    all: 50
  subgraphs_budget:
    mode: measure
plugins:
  diagnostics:
    enabled: true
    config:
      grafana_url: https://grafana.ortzi.cloud/
  ratelimit:
    enabled: true
    config:
      authenticated: {requests: 20, per: 1s}
      anonymous: {requests: 5, per: 1s}
      cost:
        authenticated: {budget: 50000, per: 1m}
        anonymous: {budget: 5000, per: 1m}
  anonymous:
    enabled: true
laboratory:
  enabled: false

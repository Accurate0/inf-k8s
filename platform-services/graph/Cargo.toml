[package]
name = "graph-router"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "graph-router"
path = "src/main.rs"

[dependencies]
async-graphql = { version = "7.2.1", default-features = false, features = ["dynamic-schema"] }
bytes = "1"
hive-router = { git = "https://git.anurag.sh/anurag/hive-router.git", rev = "067e6f79a6776eb5aa384b863e783a4d09eef9c7" }
moka = { version = "0.12", features = ["future", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subgraph = { path = "../../crates/subgraph" }
url = "2"

[dev-dependencies]
axum = "0.8"
futures = "0.3"
insta = { version = "1", features = ["yaml", "redactions"] }
serde_yaml = "0.9"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
p256 = { version = "0.13", features = ["pkcs8", "jwk"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "process", "time"] }
tokio-tungstenite = "0.29"

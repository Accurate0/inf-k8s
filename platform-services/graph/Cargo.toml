[package]
name = "graph-router"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "graph-router"
path = "src/main.rs"

[dependencies]
async-graphql = { version = "7.2.1", default-features = false, features = ["dynamic-schema"] }
bytes = "1"
hive-router = "=0.3.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

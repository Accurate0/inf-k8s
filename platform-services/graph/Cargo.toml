[package]
name = "graph-router"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "graph-router"
path = "src/main.rs"

[dependencies]
async-graphql = { version = "7.2.1", default-features = false, features = ["dynamic-schema"] }
bytes = "1"
hive-router = "=0.3.13"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum = "0.8"
futures = "0.3"
insta = { version = "1", features = ["yaml", "redactions"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
p256 = { version = "0.13", features = ["pkcs8", "jwk"] }
subgraph = { path = "../../crates/subgraph" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "process", "time"] }
tokio-tungstenite = "0.29"

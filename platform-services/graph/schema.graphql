type QueryRoot {
  auth: AuthObject!
  homeAssistant: HomeAssistantObject!
  """
  Every configured entity and its current state. Entity types the caller
  lacks a `graphql:<type>:read` scope for are silently omitted — this query
  never errors on missing permissions.
  The dashboard sections, in display order, with their titles. Categorising
  a device kind is a backend concern — the frontend renders whatever order
  and titles this returns.
  """
  entitySections: [EntitySection!]!
  deviceConnections: [DeviceConnection!]!
  entities: [Entity!]!
  mediaPlayer(id: IdOrAlias!): MediaPlayerEntity!
  light(id: IdOrAlias!): LightEntity!
  door(id: IdOrAlias!): DoorEntity!
  presence(id: IdOrAlias!): PresenceEntity!
  environment(id: IdOrAlias!): EnvironmentEntity!
  plant(id: IdOrAlias!): PlantEntity!
  einkDisplay(id: IdOrAlias!): EinkDisplayEntity!
  robotVacuum(id: IdOrAlias!): RobotVacuumEntity!
  garageDoor(id: IdOrAlias!): GarageDoorEntity!
  airPurifier(id: IdOrAlias!): AirPurifierEntity!
  solar: SolarObject!
  energy: EnergyObject!
  weather(input: WeatherInput!): WeatherObject!
  woolworths: WoolworthsObject!
  transperth: TransperthObject!
  fuelwatch(postcode: Int): FuelWatchObject!
  unraid: Unraid
  workflows: [WorkflowStatus!]!
  mode: ModeStatus!
  workflowRuns(slug: String, eventId: UUID, limit: Int): [WorkflowRun!]!
  jellyfin: JellyfinObject!
  adhocCronTasks: [AdhocCronTaskStatus!]!
  adhocTasks: [AdhocTaskStatus!]!
  pushNotifications(limit: Int): [PushNotification!]!
  luaApi: LuaApiObject!
}


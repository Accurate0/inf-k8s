# generated from app.yaml by `ortzi app render`; edit app.yaml instead
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: graph-router
    namespace: graph
    files:
      - supergraph/router.yaml
      - supergraph/supergraph.graphql
      - supergraph/persisted-documents.json
  - name: graph-router-dashboard
    namespace: graph
    files:
      - dashboards/graph-router.json
    options:
      disableNameSuffixHash: true
      labels:
        inf-k8s.net/grafana-dashboard: "true"
generatorOptions:
  disableNameSuffixHash: true

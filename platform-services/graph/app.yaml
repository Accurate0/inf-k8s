# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: graph
namespace:
  labels:
    internal-gateway-access: "true"
network:
  ingress: []
exports:
  - {name: api, workload: router, port: http}
resources:
  - name: config
    type: config
    configMap: graph-router
    files: [supergraph/router.yaml, supergraph/supergraph.graphql, supergraph/persisted-documents.json]
  - {name: supergraph, type: bucket, provider: garage, bucket: graph-supergraph, secretName: supergraph-bucket-secrets}
  - {name: traces, type: platform, export: tracing}
  - {name: graph, type: supergraph, base: supergraph/router.base.yaml}
  - name: graph
    type: route
    auth: {mode: app, reason: "the router forwards credentials, each subgraph verifies kanidm jwts"}
    gateway: internal-gateway
    hosts: [graph.ortzi.cloud]
    dns: {provider: cloudflare, proxied: false}
    backend: {name: router, port: 80}
    paths: [/v1/graphql]
    timeouts: {request: 0s}
  - name: graph
    type: oidc
    secretName: kanidm-graph-oidc
    host: graph.ortzi.cloud
    displayName: Graph
    preferShortUsername: true
    callbackPath: /callback
    public: true
    allowLocalhostRedirect: true
    groups:
      graph_users: [platform_admins]
    scopeMaps:
      graph_users: [openid, email, profile, groups]
      registry_users: [openid, email, profile, groups]
      registry_admins: [openid, email, profile, groups]
      feature_flags_admins: [openid, email, profile, groups]
      ai_gateway_admins: [openid, email, profile, groups]
      janitor_bot_admins: [openid, email, profile, groups]
      waf_admins: [openid, email, profile, groups]
      bom_users: [openid, email, profile, groups]
workloads:
  - name: router
    image: registry.anurag.sh/containers/graph-router
    autoscale: {min: 2, max: 4, cpu: 70}
    resources: {cpu: 20m, memory: 64Mi, memoryLimit: 256Mi}
    ports:
      - {name: http, container: 4000, service: 80}
    probes:
      http: {path: /health, port: 4000}
      readiness: {delay: 3, every: 10}
      liveness: {delay: 3, every: 30}
    env:
      ROUTER_CONFIG_FILE_PATH: /etc/graph/supergraph/router.yaml
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - {bucket: supergraph}
    mounts:
      config: {path: /etc/graph, config: config}
    service: {name: router}
  - name: supergraph-upload
    image: curlimages/curl
    kind: Job
    phase: postSync
    command: [sh, -c]
    args:
      - |-
        for file in persisted-documents.json supergraph.graphql; do
          curl -fsS --retry 5 --retry-connrefused --retry-delay 2 \
            --aws-sigv4 "aws:amz:$S3_REGION:s3" \
            --user "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" \
            -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" \
            -T "/etc/graph/supergraph/$file" \
            "$S3_ENDPOINT/$S3_BUCKET/$file"
        done
    resources: {cpu: 10m, memory: 16Mi}
    envFrom:
      - {bucket: supergraph}
    mounts:
      config: {path: /etc/graph, config: config}
build:
  image: registry.anurag.sh/containers/graph-router
  ci: forgejo
  context: .
  args:
    BINARY_NAME: graph-router
  paths: [crates/subgraph/**]
  test:
    run: cargo test
    packages: [build-essential, pkg-config]
    toolchain: {rust: 1.99.1}
sources:
  - type: manifests
    path: .
artifact:
  repo: oci://registry.anurag.sh/manifests/graph
  tag: main

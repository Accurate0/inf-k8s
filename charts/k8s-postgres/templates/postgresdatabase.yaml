{{- $defaults := .Values.defaults | default dict }}
{{- $releaseNamespace := .Release.Namespace }}
{{- range $db := .Values.databases }}
{{- $namespace := $db.namespace | default $defaults.namespace | default $releaseNamespace }}
{{- $annotations := merge (dict) ($db.annotations | default dict) ($defaults.annotations | default dict) (dict "argocd.argoproj.io/sync-options" "Prune=false,Delete=false") }}
apiVersion: inf-k8s.net/v1
kind: PostgresDatabase
metadata:
  name: {{ $db.resourceName | default (printf "%s-database" $db.name) }}
  namespace: {{ $namespace }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  databaseName: {{ $db.databaseName | default ($db.name | replace "-" "_") }}
  {{- with $db.roleName }}
  roleName: {{ . }}
  {{- end }}
  {{- with $db.additionalDatabases }}
  additionalDatabases:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  secretName: {{ $db.secretName | default (printf "%s-database-secret" $db.name) }}
  secretNamespace: {{ $db.secretNamespace | default $namespace }}
---
{{- end }}

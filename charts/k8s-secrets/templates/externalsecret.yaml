{{- $defaults := .Values.defaults }}
{{- $openbaoServer := default "http://openbao-active.openbao.svc.cluster.local:8200" $defaults.openbaoServer }}
{{- $openbaoNamespaces := dict }}
{{- range $secret := .Values.secrets }}
{{- $provider := default (default "openbao" $defaults.provider) $secret.provider }}
{{- $namespace := default $defaults.namespace $secret.namespace }}
{{- $resync := default $defaults.resyncInterval $secret.resyncInterval }}
{{- $labels := default $defaults.labels $secret.labels }}
{{- $annotations := default $defaults.annotations $secret.annotations }}
{{- $storeName := printf "%s-%s" $provider $secret.name }}
{{- $storeKind := "SecretStore" }}
{{- $remoteKey := $secret.key }}
{{- if eq $provider "openbao" }}
{{- $remoteKey = default (ternary $namespace (printf "%s/%s" $namespace $secret.name) (eq $secret.name $namespace)) $secret.key }}
{{- $_ := set $openbaoNamespaces $namespace true }}
{{- else if eq $provider "azurekv" }}
{{- $storeName = default "k8s-shared-vault" $defaults.azureStore }}
{{- $storeKind = "ClusterSecretStore" }}
{{- $remoteKey = default $secret.name $secret.key }}
{{- end }}
{{- if eq $provider "openbao" }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $storeName }}
  namespace: {{ $namespace }}
spec:
  provider:
    vault:
      server: {{ $openbaoServer }}
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: openbao-secrets
---
{{- end }}
{{- range $managed := $secret.managedSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $managed.secretName }}
  namespace: {{ $namespace }}
  {{- if $labels }}
  labels:
    {{ $labels | toYaml | nindent 4 | trim }}
  {{- end }}
  {{- if $annotations }}
  annotations:
    {{ $annotations | toYaml | nindent 4 | trim }}
  {{- end }}
spec:
  refreshInterval: {{ $resync }}s
  secretStoreRef:
    name: {{ $storeName }}
    kind: {{ $storeKind }}
  target:
    name: {{ $managed.secretName }}
    creationPolicy: Owner
    template:
      type: {{ default "Opaque" $managed.type }}
      {{- if or $labels $annotations }}
      metadata:
        {{- if $labels }}
        labels:
          {{ $labels | toYaml | nindent 10 | trim }}
        {{- end }}
        {{- if $annotations }}
        annotations:
          {{ $annotations | toYaml | nindent 10 | trim }}
        {{- end }}
      {{- end }}
      {{- if $managed.template }}
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{- range $k, $v := $managed.template.data }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- end }}
  dataFrom:
    - extract:
        key: {{ $remoteKey }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
{{- end }}
{{- end }}
{{- range $namespace, $_ := $openbaoNamespaces }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-secrets
  namespace: {{ $namespace }}
---
{{- end }}

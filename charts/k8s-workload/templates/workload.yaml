{{- $namespace := .Values.namespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  {{- with .Values.namespaceLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- range $workload := .Values.workloads }}
{{- $w := merge (deepCopy $workload) (deepCopy ($.Values.defaults | default dict)) }}
{{- $ctx := dict "workload" $w "images" $.Values.images }}
{{- $service := $w.service | default dict }}
{{- $replicas := ternary $w.replicas 1 (hasKey $w "replicas") }}
---
{{- if eq $w.kind "CronJob" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $w.name }}
  namespace: {{ $namespace }}
spec:
  schedule: {{ required "schedule is required for a CronJob" $w.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        {{- include "k8s-workload.pod" $ctx | nindent 8 }}
{{- else }}
apiVersion: apps/v1
kind: {{ $w.kind }}
metadata:
  name: {{ $w.name }}
  namespace: {{ $namespace }}
spec:
  {{- if eq $w.kind "Deployment" }}
  replicas: {{ $replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $w.name }}
  template:
    {{- include "k8s-workload.pod" $ctx | nindent 4 }}
{{- end }}
{{- if and $w.port (ne $w.kind "CronJob") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name | default $w.name }}
  namespace: {{ $namespace }}
  labels:
    app: {{ $w.name }}
spec:
  selector:
    app: {{ $w.name }}
  ports:
    - name: {{ $service.portName | default "http" }}
      protocol: TCP
      port: {{ $service.port | default $w.port }}
      targetPort: {{ $w.port }}
{{- end }}
{{- if and (eq $w.kind "Deployment") (gt (int $replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $w.name }}
  namespace: {{ $namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ $w.name }}
{{- end }}
{{- end }}

{{- $issuerBase := "https://idm.anurag.sh/oauth2/openid" }}
{{- range $route := .Values.routes }}
{{- with $route.jwtClients }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $route.name }}-jwt
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $route.name }}
  jwt:
    providers:
      {{- range $client := . }}
      - name: {{ $client }}
        issuer: {{ $issuerBase }}/{{ $client }}
        remoteJWKS:
          cacheDuration: 3600s
          uri: {{ $issuerBase }}/{{ $client }}/public_key.jwk
      {{- end }}
---
{{- end }}
{{- end }}

{{- $defaults := .Values.defaults | default dict }}
{{- $releaseNamespace := .Release.Namespace }}
{{- range $client := .Values.clients }}
{{- $annotations := merge (dict) ($client.annotations | default dict) ($defaults.annotations | default dict) ($.Values.retainAnnotations | default dict) }}
{{- $namespace := $client.namespace | default $defaults.namespace | default $releaseNamespace }}
{{- range $account := $client.serviceAccounts }}
apiVersion: inf-k8s.net/v1
kind: KanidmServiceAccount
metadata:
  name: {{ $account.name | replace "_" "-" }}
  namespace: {{ $namespace }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  name: {{ $account.name }}
  displayName: {{ $account.displayName | quote }}
  entryManagedBy: {{ $account.entryManagedBy }}
  apiToken:
    secretName: {{ $account.secretName }}
    secretNamespace: {{ $account.secretNamespace | default $namespace }}
    audience: {{ $client.name }}
    {{- with $account.scopes }}
    scopes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
{{- end }}
{{- end }}

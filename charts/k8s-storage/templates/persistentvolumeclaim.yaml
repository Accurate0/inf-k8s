{{- range $volume := .Values.volumes }}
{{- $annotations := merge (dict) ($volume.annotations | default dict) ($.Values.retainAnnotations | default dict) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $volume.name }}
  namespace: {{ $volume.namespace }}
  {{- with $volume.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ $volume.access }}
  storageClassName: {{ $volume.storageClass }}
  resources:
    requests:
      storage: {{ $volume.size }}
---
{{- end }}

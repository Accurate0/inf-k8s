# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tldr-bot
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: projects
  sources:
    - chart: k8s-secrets
      repoURL: oci://ghcr.io/accurate0/charts/k8s-secrets
      targetRevision: 0.6.0
      helm:
        valuesObject:
          defaults:
            namespace: tldr-bot
            provider: openbao
            resyncInterval: 900
            annotations:
              inf-k8s.net/app: tldr-bot
              inf-k8s.net/repository: https://github.com/Accurate0/tldr-bot
          secrets:
            - name: tldr-bot
              managedSecrets:
                - secretName: tldr-bot-managed-secrets
    - repoURL: https://git.anurag.sh/anurag/k8s.git
      name: application
      path: projects/tldr-bot/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: tldr-bot
operation:
  initiatedBy:
    username: github-actions
  sync:
    prune: true
    syncStrategy:
      hook: {}

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: tldr-bot
repository: https://github.com/Accurate0/tldr-bot
resources:
  - {name: tldr-bot, type: secret}
  - name: llm
    type: app
    app: ai-gateway
    export: api
    path: /v1
workloads:
  tldr-bot:
    image: ghcr.io/accurate0/tldr-bot
    resources: {memory: 32Mi}
    env:
      OPENAI_API_BASE: {resource: llm}
    envFrom:
      - tldr-bot-managed-secrets
network:
  ingress: []

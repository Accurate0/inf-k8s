# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: tldr-bot
repository: https://github.com/Accurate0/tldr-bot
resources:
  - name: llm
    type: app
    app: ai-gateway
    export: api
    path: /v1
workloads:
  tldr-bot:
    image: ghcr.io/accurate0/tldr-bot
    resources:
      requests:
        memory: 32Mi
    uses:
      - name: llm
        env: OPENAI_API_BASE
secrets:
  - tldr-bot
network:
  ingress: []

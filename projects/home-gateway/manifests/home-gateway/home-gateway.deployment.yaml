# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-gateway
  namespace: home-gateway
spec:
  selector:
    matchLabels:
      app: home-gateway
  replicas: 1
  minReadySeconds: 15
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: home-gateway
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      hostAliases:
        - ip: "10.0.2.249"
          hostnames:
            - home-assistant.internal
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: inf-k8s.net/location
                    operator: In
                    values:
                      - perth
      containers:
        - name: home-gateway
          image: ghcr.io/accurate0/home-gateway
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 30m
              memory: 336Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /v1/health
              port: 8000
              scheme: HTTP
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 2
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/health
              port: 8000
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 1
          env:
            - name: FEATURE_FLAGS_URL
              value: http://api.feature-flags.svc.cluster.local:50051
            - name: BOM_API_BASE
              value: http://bom-api.bom.svc.cluster.local:8000
            - name: OTEL_TRACING_URL
              value: http://monitoring-tempo.monitoring.svc.cluster.local:4318/v1/traces
            - name: HOME_ASSISTANT_URL
              value: http://home-assistant.internal
            - name: CONFIG_DIR
              value: /etc/home-gateway/config
          envFrom:
            - secretRef:
                name: home-gateway-managed-secrets
            - secretRef:
                name: home-gateway-database-secret
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /etc/home-gateway/config
              readOnly: true
            - name: config-workflows
              mountPath: /etc/home-gateway/config/workflows
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: home-gateway-config
        - name: config-workflows
          configMap:
            name: home-gateway-config-workflows

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/core/namespace_v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: home-gateway
  labels:
    gateway.inf-k8s.net/anurag-sh: "true"
    # Allow HTTPRoutes in this namespace to attach to the internal gateway
    # (home.ortzi.cloud dashboard).
    internal-gateway-access: "true"
    inf-k8s.net/lan-gateway-access: "true"

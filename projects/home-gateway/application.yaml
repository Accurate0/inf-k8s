# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-gateway
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: projects
  sources:
    - chart: k8s-http-routes
      repoURL: oci://ghcr.io/accurate0/charts/k8s-http-routes
      targetRevision: 2.3.0
      helm:
        valuesObject:
          routes:
            - name: api-route
              gateway:
                name: public-gateway
                namespace: envoy-gateway-system
              annotations:
                external-dns.alpha.kubernetes.io/managed: "true"
                external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
              hostnames:
                - home.anurag.sh
              ratelimit:
                rules:
                  - clientSelectors:
                      - headers:
                          - name: CF-Connecting-IP
                            type: Distinct
                            invert: false
                    limit:
                      requests: 5
                      unit: Second
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: home-gateway
                      port: 80
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /v1
    - chart: k8s-oidc
      repoURL: oci://ghcr.io/accurate0/charts/k8s-oidc
      targetRevision: 0.2.2
      helm:
        valuesObject:
          clients:
            - name: home-gateway
              namespace: home-gateway
              displayName: Home Gateway
              host: home.inf-k8s.net
              callbackPath: /callback
              public: true
              preferShortUsername: true
              allowLocalhostRedirect: true
              scopeMaps:
                home_gateway_admins:
                  - openid
                  - email
                  - profile
                  - groups
                home_gateway_readers:
                  - openid
                  - email
                  - profile
                  - groups
              secretName: kanidm-home-gateway-oidc
              secretNamespace: home-gateway
              annotations:
                inf-k8s.net/app: home-gateway
                inf-k8s.net/repository: https://github.com/Accurate0/home-gateway
    - chart: k8s-postgres
      repoURL: oci://ghcr.io/accurate0/charts/k8s-postgres
      targetRevision: 0.2.0
      helm:
        valuesObject:
          databases:
            - name: home-gateway
              namespace: home-gateway
              databaseName: home_gateway
              secretName: home-gateway-database-secret
              secretNamespace: home-gateway
              annotations:
                inf-k8s.net/app: home-gateway
                inf-k8s.net/repository: https://github.com/Accurate0/home-gateway
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      name: application
      path: projects/home-gateway/manifests
      kustomize: {}
    - repoURL: https://github.com/Accurate0/home-gateway.git
      name: config
      path: config
      kustomize: {}

  destination:
    server: https://kubernetes.default.svc
    namespace: home-gateway
operation:
  initiatedBy:
    username: github-actions
  sync:
    prune: true
    syncStrategy:
      hook: {}

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: home-gateway
repository: https://github.com/Accurate0/home-gateway
routes:
  api-route:
    auth:
      mode: app
      reason: accepts X-Api-Key as well as JWTs
    hosts:
      - home.anurag.sh
    backend:
      name: home-gateway
      port: 80
    paths:
      - /v1
    annotations:
      external-dns.kubernetes.io/managed: "true"
      external-dns.kubernetes.io/cloudflare-proxied: "false"
    ratelimit:
      rules:
        - clientSelectors:
            - headers:
                - name: x-real-ip
                  type: Distinct
                  invert: false
          limit:
            requests: 5
            unit: Second
databases:
  home-gateway:
    secretName: home-gateway-db-credentials
secrets:
  - home-gateway
  - name: terraform
    secretName: home-gateway-terraform-secrets
sources:
  - repoURL: https://github.com/Accurate0/home-gateway.git
    name: config
    path: config
network:
  ingress:
    - monitoring
namespace:
  labels:
    gateway.inf-k8s.net/anurag-sh: "true"
    internal-gateway-access: "true"
    inf-k8s.net/lan-gateway-access: "true"
metrics:
  workload: home-gateway
  path: /metrics
  port: api
  interval: 30s
oidc:
  home-gateway:
    host: home.ortzi.cloud
    displayName: Home Gateway
    callbackPath: /callback
    extraRedirectUrls:
      - net.infk8s.homegateway:/oauth2redirect
      - https://home.internal/callback
    public: true
    allowLocalhostRedirect: true
    groups:
      home_gateway_admins:
        - platform_admins
      home_gateway_readers:
        - home_gateway_admins
    scopeMaps:
      home_gateway_readers:
        - openid
        - email
        - profile
        - groups
resources:
  - name: flags
    type: app
    app: feature-flags
    export: api
  - name: traces
    type: tracing
workloads:
  home-gateway:
    image: ghcr.io/accurate0/home-gateway
    resources: {cpu: 30m, memory: 336Mi}
    ports: [8000]
    probes:
      http: {path: /v1/health, port: 8000}
      startup: {every: 2, timeout: 2, failures: 30}
      readiness: {every: 10, timeout: 2}
      liveness: {delay: 3, every: 30}
    env:
      CONFIG_DIR: /etc/home-gateway/config
      OTEL_TRACING_URL: {resource: traces}
      FEATURE_FLAGS_URL: {resource: flags}
    envFrom:
      - home-gateway-managed-secrets
      - home-gateway-terraform-secrets
      - home-gateway-db-credentials
    mounts:
      config: {path: /etc/home-gateway/config, configMap: home-gateway-config}
      config-sections: {path: /etc/home-gateway/config/sections, configMap: home-gateway-config-sections}
      config-devices: {path: /etc/home-gateway/config/devices, configMap: home-gateway-config-devices}
      config-workflows: {path: /etc/home-gateway/config/workflows, configMap: home-gateway-config-workflows}
      config-lua-lib: {path: /etc/home-gateway/config/lua/lib, configMap: home-gateway-config-lua-lib}
      config-lua-model-lib: {path: /etc/home-gateway/config/lua/models/lib, configMap: home-gateway-config-lua-model-lib}
      config-lua-workflows: {path: /etc/home-gateway/config/lua/workflows, configMap: home-gateway-config-lua-workflows}
      config-lua-integrations: {path: /etc/home-gateway/config/lua/integrations, configMap: home-gateway-config-lua-integrations}
      config-lua-mqtt: {path: /etc/home-gateway/config/lua/models/mqtt, configMap: home-gateway-config-lua-mqtt}
      config-lua-home-assistant: {path: /etc/home-gateway/config/lua/models/home_assistant, configMap: home-gateway-config-lua-home-assistant}
      config-lua-esphome-native-api: {path: /etc/home-gateway/config/lua/models/esphome_native_api, configMap: home-gateway-config-lua-esphome-native-api}
      config-lua-tuya: {path: /etc/home-gateway/config/lua/models/tuya, configMap: home-gateway-config-lua-tuya}
    runAsNonRoot: false
    service:
      name: home-gateway
      ports:
        - {name: api, port: 80, targetPort: 8000}
    overrides:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: inf-k8s.net/location
                    operator: In
                    values:
                      - perth
      minReadySeconds: 15
      progressDeadlineSeconds: 300
      hostAliases:
        - ip: 10.0.2.15
          hostnames:
            - home-assistant.internal
  home-web:
    image: ghcr.io/accurate0/home-gateway-web
    resources: {memory: 32Mi}
    ports: [8080]
    probes:
      http: {path: /, port: 8080}
      readiness: {delay: 3, every: 30}
    runAsNonRoot: false
    service:
      name: home-web
      ports:
        - {name: http, port: 80, targetPort: 8080}
    overrides:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: inf-k8s.net/location
                    operator: In
                    values:
                      - perth

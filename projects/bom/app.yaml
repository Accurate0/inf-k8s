# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: bom
repository: https://github.com/Accurate0/bom
resources:
  - {name: bom, type: secret, secretName: bom-managed-secrets}
  - {name: bom, type: database, secretName: bom-database-secret}
  - {name: images, type: bucket, provider: r2, bucket: bom-images, secretName: images-bucket-secrets}
workloads:
  bom:
    image: ghcr.io/accurate0/bom
    port: 8000
    health: /health
    resources: {cpu: 30m, memory: 56Mi, memoryLimit: 512Mi}
    env:
      BUCKET_NAME: {resource: images}
      BUCKET_ENDPOINT: {bucket: images, key: S3_ENDPOINT}
      BUCKET_ACCESS_KEY_ID: {bucket: images, key: S3_ACCESS_KEY_ID}
      BUCKET_ACCESS_SECRET_KEY: {bucket: images, key: S3_SECRET_ACCESS_KEY}
    envFrom:
      - secret: bom
      - database: bom
    service:
      name: bom-api
      portName: api
network:
  ingress:
    - home-gateway

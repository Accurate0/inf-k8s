# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: bom
repository: https://github.com/Accurate0/bom
resources:
  - {name: images, type: bucket, provider: r2, bucket: bom-images}
workloads:
  bom:
    image: ghcr.io/accurate0/bom
    port: 8000
    health: /health
    resources: {cpu: 30m, memory: 56Mi, memoryLimit: 512Mi}
    env:
      BUCKET_NAME: {resource: images}
      BUCKET_ENDPOINT: {secret: images-bucket-secrets, key: S3_ENDPOINT}
      BUCKET_ACCESS_KEY_ID: {secret: images-bucket-secrets, key: S3_ACCESS_KEY_ID}
      BUCKET_ACCESS_SECRET_KEY: {secret: images-bucket-secrets, key: S3_SECRET_ACCESS_KEY}
    envFrom:
      - bom-managed-secrets
      - bom-database-secret
    service:
      name: bom-api
      portName: api
databases:
  bom: {}
secrets:
  - bom
network:
  ingress:
    - home-gateway

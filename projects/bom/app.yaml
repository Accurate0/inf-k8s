# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: bom
repository: https://github.com/Accurate0/bom
workloads:
  bom:
    image: ghcr.io/accurate0/bom
    port: 8000
    health: /health
    resources: {cpu: 30m, memory: 56Mi, memoryLimit: 512Mi}
    env:
      BUCKET_NAME: bom-images
    envFrom:
      - bom-managed-secrets
      - bom-database-secret
    service:
      name: bom-api
      portName: api
databases:
  bom: {}
secrets:
  - bom
network:
  ingress:
    - home-gateway

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: maccas-api
repository: https://github.com/Accurate0/maccas-api
network:
  ingress: []
resources:
  - {name: api, type: secret, secretName: maccas-api-managed-secrets}
  - {name: common, type: secret, secretName: maccas-common-managed-secrets}
  - {name: web, type: secret, secretName: maccas-web-managed-secrets}
  - {name: migration, type: secret, secretName: maccas-migration-managed-secrets}
  - {name: cache, type: cache}
  - {name: images, type: bucket, provider: r2, bucket: maccas-images, secretName: images-bucket-secrets}
  - name: llm
    type: app
    app: ai-gateway
    export: api
    path: /v1
  - name: flags
    type: app
    app: feature-flags
    export: api
  - {name: traces, type: platform, export: tracing}
  - name: maccas-web-route
    type: route
    auth:
      mode: none
      reason: public website, the app handles its own logins
    hosts:
      - maccas.one
    backend:
      name: maccas-web
      port: 3000
    dns: {provider: cloudflare, proxied: true}
    ratelimit: {requests: 5, per: Second, header: x-real-ip}
workloads:
  - name: maccas-migration
    image: ghcr.io/accurate0/maccas-migration
    kind: Job
    phase: preSync
    resources: {cpu: 50m, memory: 64Mi}
    envFrom:
      - secret: migration
  - name: maccas-api
    image: ghcr.io/accurate0/maccas-api
    replicas: 3
    resources: {memory: 144Mi, memoryLimit: 1Gi}
    ports:
      - {name: api, container: 8000, service: 8000}
    probes:
      http: {path: /v1/health/self, port: 8000}
      liveness: {delay: 3, every: 30}
    env:
      IMAGES_BUCKET__ENDPOINT: {bucket: images, key: S3_ENDPOINT}
      IMAGES_BUCKET__ACCESS_KEY_ID: {bucket: images, key: S3_ACCESS_KEY_ID}
      IMAGES_BUCKET__ACCESS_SECRET_KEY: {bucket: images, key: S3_SECRET_ACCESS_KEY}
      RECOMMENDATIONS_API_BASE: {service: maccas-recommendations, port: api}
      SENSORDATA_API_BASE: ""
      REDIS_CONNECTION_STRING: {resource: cache}
      OTEL_TRACING_URL: {resource: traces}
      OPENAI_BASE_URL: {resource: llm}
      FEATURE_FLAGS_URL: {resource: flags}
    envFrom:
      - secret: common
      - secret: api
    service:
      name: maccas-api
      trafficDistribution: PreferSameNode
    overrides:
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: maccas-api
          whenUnsatisfiable: ScheduleAnyway
  - name: maccas-web
    image: ghcr.io/accurate0/maccas-web
    replicas: 3
    resources: {memory: 312Mi}
    ports:
      - {name: web, container: 3000, service: 3000}
    probes:
      http: {path: /health, port: 3000}
      liveness: {delay: 3, every: 30}
    env:
      ADDRESS_HEADER: x-real-ip
      OLD_API_BASE_URL: https://api.maccas.one/v1
      API_BASE_URL: {service: maccas-api, port: api, path: /v1}
      EVENT_BASE_URL: {service: maccas-api, port: api, path: /v1}
      FEATURE_FLAGS_URL: {resource: flags}
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - secret: web
    runAsNonRoot: false
    service:
      name: maccas-web
    overrides:
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: maccas-web
          whenUnsatisfiable: ScheduleAnyway
  - name: maccas-scheduler
    image: ghcr.io/accurate0/maccas-scheduler
    resources: {memory: 32Mi}
    env:
      EVENT_API_BASE: {service: maccas-api, port: api, path: /v1}
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - secret: common
      - secret: api
    overrides:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: maccas-scheduler
              topologyKey: kubernetes.io/hostname
  - name: maccas-recommendations
    image: ghcr.io/accurate0/maccas-recommendations
    resources: {memory: 48Mi, memoryLimit: 1000Mi}
    ports:
      - {name: api, container: 8003, service: 8003}
    probes:
      http: {path: /health, port: 8003}
      liveness: {delay: 3, every: 30, timeout: 5}
    env:
      CLUSTERING_API_BASE: {service: maccas-recommendations, port: clustering}
      OTEL_TRACING_URL: {resource: traces}
      OPENAI_BASE_URL: {resource: llm}
    envFrom:
      - secret: common
      - secret: api
    sidecars:
      - image: ghcr.io/accurate0/maccas-clustering
        name: maccas-clustering
        resources: {cpu: 10m, memory: 192Mi}
        ports:
          - {name: clustering, container: 8004, service: 8004}
        envFrom:
          - secret: common
          - secret: api
        probes:
          http: {path: /health, port: 8004}
          liveness: {delay: 3, every: 30}
    service:
      name: maccas-recommendations
namespace:
  labels:
    gateway.inf-k8s.net/maccas-one: "true"

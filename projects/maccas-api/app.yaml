# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: maccas-api
repository: https://github.com/Accurate0/maccas-api
routes:
  maccas-web-route:
    auth:
      mode: none
      reason: public website, the app handles its own logins
    hosts:
      - maccas.one
    backend:
      name: maccas-web
      port: 3000
    annotations:
      external-dns.kubernetes.io/managed: "true"
      external-dns.kubernetes.io/cloudflare-proxied: "true"
    ratelimit:
      rules:
        - clientSelectors:
            - headers:
                - name: x-real-ip
                  invert: false
                  type: Distinct
          limit:
            requests: 5
            unit: Second
secrets:
  - name: api
    secretName: maccas-api-managed-secrets
  - name: common
    secretName: maccas-common-managed-secrets
  - name: web
    secretName: maccas-web-managed-secrets
  - name: migration
    secretName: maccas-migration-managed-secrets
network:
  ingress: []
resources:
  - {name: images, type: bucket, provider: r2, bucket: maccas-images}
  - name: llm
    type: app
    app: ai-gateway
    export: api
    path: /v1
  - name: flags
    type: app
    app: feature-flags
    export: api
  - name: traces
    type: tracing
workloads:
  maccas-api:
    image: ghcr.io/accurate0/maccas-api
    replicas: 3
    resources: {memory: 144Mi}
    ports: [8000]
    probes:
      http: {path: /v1/health/self, port: 8000}
      liveness: {delay: 3, every: 30}
    env:
      IMAGES_BUCKET__ENDPOINT: {secret: images-bucket-secrets, key: S3_ENDPOINT}
      IMAGES_BUCKET__ACCESS_KEY_ID: {secret: images-bucket-secrets, key: S3_ACCESS_KEY_ID}
      IMAGES_BUCKET__ACCESS_SECRET_KEY: {secret: images-bucket-secrets, key: S3_SECRET_ACCESS_KEY}
      RECOMMENDATIONS_API_BASE: http://maccas-recommendations.maccas-api.svc.cluster.local:8003
      SENSORDATA_API_BASE: http://maccas-sensordata.maccas-api.svc.cluster.local
      REDIS_CONNECTION_STRING: redis://replicated.dragonfly.svc.cluster.local
      OTEL_TRACING_URL: {resource: traces}
      OPENAI_BASE_URL: {resource: llm}
      FEATURE_FLAGS_URL: {resource: flags}
    envFrom:
      - maccas-common-managed-secrets
      - maccas-api-managed-secrets
    initContainers:
      - image: ghcr.io/accurate0/maccas-migration
        name: maccas-migration
        resources: {cpu: 50m, memory: 64Mi}
        envFrom:
          - maccas-migration-managed-secrets
    service:
      name: maccas-api
      ports:
        - {name: api, port: 8000, targetPort: 8000}
      trafficDistribution: PreferSameNode
    overrides:
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: maccas-api
          whenUnsatisfiable: ScheduleAnyway
  maccas-web:
    image: ghcr.io/accurate0/maccas-web
    replicas: 3
    resources: {memory: 312Mi}
    ports: [3000]
    probes:
      http: {path: /health, port: 3000}
      liveness: {delay: 3, every: 30}
    env:
      ADDRESS_HEADER: x-real-ip
      OLD_API_BASE_URL: https://api.maccas.one/v1
      API_BASE_URL: http://maccas-api.maccas-api.svc.cluster.local:8000/v1
      EVENT_BASE_URL: http://maccas-api.maccas-api.svc.cluster.local:8000/v1
      FEATURE_FLAGS_URL: api.feature-flags.svc.cluster.local:50051
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - maccas-web-managed-secrets
    runAsNonRoot: false
    service:
      name: maccas-web
      ports:
        - {name: web, port: 3000, targetPort: 3000}
    overrides:
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: maccas-web
          whenUnsatisfiable: ScheduleAnyway
  maccas-scheduler:
    image: ghcr.io/accurate0/maccas-scheduler
    resources: {memory: 32Mi}
    env:
      EVENT_API_BASE: http://maccas-api.maccas-api.svc.cluster.local:8000/v1
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - maccas-common-managed-secrets
      - maccas-api-managed-secrets
    overrides:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: maccas-scheduler
              topologyKey: kubernetes.io/hostname
  maccas-recommendations:
    image: ghcr.io/accurate0/maccas-recommendations
    resources: {memory: 48Mi, memoryLimit: 1000Mi}
    ports: [8003]
    probes:
      http: {path: /health, port: 8003}
      liveness: {delay: 3, every: 30, timeout: 5}
    env:
      FLIPT_URL: http://flipt.flipt.svc.cluster.local:8080
      CLUSTERING_API_BASE: http://maccas-recommendations.maccas-api.svc.cluster.local:8004
      OTEL_TRACING_URL: {resource: traces}
      OPENAI_BASE_URL: {resource: llm}
    envFrom:
      - maccas-common-managed-secrets
      - maccas-api-managed-secrets
    initContainers:
      - image: ghcr.io/accurate0/maccas-migration
        name: maccas-migration
        resources: {cpu: 50m, memory: 64Mi}
        envFrom:
          - maccas-migration-managed-secrets
    sidecars:
      - image: ghcr.io/accurate0/maccas-clustering
        name: maccas-clustering
        resources: {cpu: 10m, memory: 192Mi}
        ports: [8004]
        envFrom:
          - maccas-common-managed-secrets
          - maccas-api-managed-secrets
        probes:
          http: {path: /health, port: 8004}
          liveness: {delay: 3, every: 30}
    service:
      name: maccas-recommendations
      ports:
        - {name: api, port: 8003, targetPort: 8003}
        - {name: clustering, port: 8004, targetPort: 8004}
namespace:
  labels:
    gateway.inf-k8s.net/maccas-one: "true"

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: anurag-sh
repository: https://github.com/Accurate0/anurag.sh
workloads:
  - name: anurag-sh
    image: registry.anurag.sh/containers/anurag-sh
    ports:
      - {name: http, container: 3000, service: 80}
    resources: {memory: 16Mi}
    service:
      name: anurag-sh
network:
  ingress: []
namespace:
  labels:
    gateway.inf-k8s.net/anurag-sh: "true"
    gateway.inf-k8s.net/anurag-id-au: "true"
resources:
  - name: anurag-sh-route
    type: route
    auth:
      mode: none
      reason: public website
    hosts:
      - anurag.sh
      - anurag.id.au
    backend:
      name: anurag-sh
      port: 80
    dns: {provider: cloudflare, proxied: true}

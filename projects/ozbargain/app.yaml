# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: ozbargain
repository: https://github.com/Accurate0/ozb
resources:
  - {name: ozbargain, type: secret, secretName: ozb-managed-secrets}
workloads:
  - name: ozb-discord-bot
    image: ghcr.io/accurate0/ozb-discord-bot
    resources: {memory: 16Mi}
    envFrom:
      - secret: ozbargain
  - name: ozb-finder
    image: ghcr.io/accurate0/ozb-finder
    resources: {memory: 16Mi}
    envFrom:
      - secret: ozbargain
  - name: ozb-trigger
    image: ghcr.io/accurate0/ozb-trigger
    resources: {memory: 16Mi}
    envFrom:
      - secret: ozbargain
network:
  ingress: []

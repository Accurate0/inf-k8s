# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/app.json
name: spotify
repository: https://github.com/Accurate0/spotify
network:
  ingress: []
namespace:
  labels:
    internal-gateway-access: "true"
resources:
  - {name: spotify, type: secret, secretName: spotify-managed-secrets}
  - {name: spotify, type: subgraph, prefix: spotify, workload: spotify-api, port: http, path: /v1/graphql, repository: https://github.com/Accurate0/spotify, ref: main, schema: subgraph.graphql}
  - {name: traces, type: platform, export: tracing}
  - {name: artwork, type: bucket, provider: garage, bucket: spotify-artwork, secretName: artwork-bucket-secrets}
  - name: spotify
    type: database
    secretName: spotify-database-secret
    extensions:
      - pg_trgm
  - name: spotify
    type: route
    auth:
      mode: app
      reason: spotify-api verifies Kanidm JWTs on /v1/graphql, the rest is a static spa
    gateway: internal-gateway
    hosts:
      - spotify.ortzi.cloud
    dns: {provider: cloudflare, proxied: false}
    rules:
      - paths: [/v1/graphql, /health, /art]
        backend: {name: api, port: 80}
      - paths: [/]
        backend: {name: spotify-web, port: 80}
  - name: spotify
    type: oidc
    secretName: kanidm-spotify-oidc
    host: spotify.ortzi.cloud
    displayName: Spotify
    callbackPath: /callback
    public: true
    allowLocalhostRedirect: true
    groups:
      spotify_users:
        - platform_admins
    scopeMaps:
      spotify_users:
        - openid
        - email
        - profile
        - groups
workloads:
  - name: spotify-api
    image: ghcr.io/accurate0/spotify
    resources: {cpu: 30m, memory: 64Mi, memoryLimit: 512Mi}
    ports:
      - {name: http, container: 8000, service: 80}
    probes:
      http: {path: /health, port: 8000}
      readiness: {every: 10}
      liveness: {delay: 3, every: 30}
    env:
      OIDC_PROVIDERS: https://idm.anurag.sh/oauth2/openid/spotify=spotify,https://idm.anurag.sh/oauth2/openid/graph=graph
      OIDC_GROUPS: spotify_users
      SPOTIFY_CLIENT_ID: {secret: spotify, key: SPOTIFY_CLIENT_ID, optional: true}
      SPOTIFY_CLIENT_SECRET: {secret: spotify, key: SPOTIFY_CLIENT_SECRET, optional: true}
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - database: spotify
      - bucket: artwork
    mounts:
      tmp: {path: /tmp, emptyDir: true}
    service:
      name: api
  - name: spotify-web
    image: ghcr.io/accurate0/spotify-web
    resources: {memory: 32Mi}
    ports:
      - {name: http, container: 8080, service: 80}
    probes:
      http: {path: /, port: 8080}
      readiness: {delay: 3, every: 30}
    mounts:
      tmp: {path: /tmp, emptyDir: true}
    service:
      name: spotify-web
  - name: spotify-enrich
    image: ghcr.io/accurate0/spotify
    kind: CronJob
    schedule: "*/15 * * * *"
    backoffLimit: 0
    command:
      - spotify-server
      - enrich
    resources: {memory: 32Mi, memoryLimit: 128Mi}
    env:
      SPOTIFY_CLIENT_ID: {secret: spotify, key: SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: {secret: spotify, key: SPOTIFY_CLIENT_SECRET}
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - database: spotify
      - bucket: artwork
  - name: spotify-recent
    image: ghcr.io/accurate0/spotify
    kind: CronJob
    schedule: "*/30 * * * *"
    backoffLimit: 0
    command:
      - spotify-server
      - recent
    resources: {memory: 32Mi, memoryLimit: 128Mi}
    env:
      SPOTIFY_CLIENT_ID: {secret: spotify, key: SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: {secret: spotify, key: SPOTIFY_CLIENT_SECRET}
      OTEL_TRACING_URL: {resource: traces}
    envFrom:
      - database: spotify

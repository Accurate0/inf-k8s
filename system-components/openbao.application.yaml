# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
spec:
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        internal-gateway-access: "true"
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: system-components
  sources:
    - chart: k8s-http-routes
      repoURL: oci://ghcr.io/accurate0/charts/k8s-http-routes
      targetRevision: 2.3.1
      helm:
        valuesObject:
          routes:
            - name: openbao
              gateway:
                name: internal-gateway
                namespace: envoy-gateway-system
              hostnames:
                - openbao.inf-k8s.net
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: openbao-active
                      port: 8200
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /
    - chart: k8s-postgres
      repoURL: oci://ghcr.io/accurate0/charts/k8s-postgres
      targetRevision: 0.2.0
      helm:
        valuesObject:
          databases:
            - name: openbao
              namespace: openbao
              databaseName: openbao
              secretName: openbao-database-secret
              secretNamespace: openbao
    - chart: openbao
      repoURL: https://openbao.github.io/openbao-helm
      targetRevision: 0.29.6
      helm:
        valuesObject:
          injector:
            enabled: false
          csi:
            enabled: false
          ui:
            enabled: true
          server:
            dataStorage:
              enabled: false
            extraSecretEnvironmentVars:
              - envName: BAO_PG_CONNECTION_URL
                secretName: openbao-database-secret
                secretKey: DATABASE_URL
              - envName: AZURE_CLIENT_ID
                secretName: openbao-azure-unseal
                secretKey: AZURE_CLIENT_ID
              - envName: AZURE_CLIENT_SECRET
                secretName: openbao-azure-unseal
                secretKey: AZURE_CLIENT_SECRET
            ha:
              enabled: true
              replicas: 2
              raft:
                enabled: false
              config: |
                ui = true

                listener "tcp" {
                  tls_disable     = 1
                  address         = "[::]:8200"
                  cluster_address = "[::]:8201"
                }

                storage "postgresql" {
                  ha_enabled = "true"
                }

                seal "azurekeyvault" {
                  tenant_id  = "a41823d8-d908-4fa5-980a-cde6ae04d6ff"
                  vault_name = "k8s-shared-vault"
                  key_name   = "openbao-unseal"
                }

                service_registration "kubernetes" {}
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      path: system-components/openbao
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao

operation:
  initiatedBy:
    username: github-actions
  sync:
    syncStrategy:
      hook: {}

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
spec:
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        internal-gateway-access: "true"
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: system-components
  sources:
    - chart: k8s-http-routes
      repoURL: oci://ghcr.io/accurate0/charts/k8s-http-routes
      targetRevision: 2.3.1
      helm:
        valuesObject:
          routes:
            - name: openbao
              gateway:
                name: internal-gateway
                namespace: envoy-gateway-system
              hostnames:
                - openbao.inf-k8s.net
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: openbao-active
                      port: 8200
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /
    - chart: k8s-oidc
      repoURL: oci://ghcr.io/accurate0/charts/k8s-oidc
      targetRevision: 0.2.2
      helm:
        valuesObject:
          clients:
            - name: openbao
              namespace: openbao
              displayName: OpenBao
              host: openbao.inf-k8s.net
              callbackPath: /ui/vault/auth/oidc/oidc/callback
              preferShortUsername: true
              scopeMaps:
                platform_admins:
                  - openid
                  - email
                  - profile
                  - groups
              secretName: kanidm-openbao-oidc
              secretNamespace: openbao
    - chart: k8s-postgres
      repoURL: oci://ghcr.io/accurate0/charts/k8s-postgres
      targetRevision: 0.2.0
      helm:
        valuesObject:
          databases:
            - name: openbao
              namespace: openbao
              databaseName: openbao
              secretName: openbao-database-secret
              secretNamespace: openbao
    - chart: openbao
      repoURL: https://openbao.github.io/openbao-helm
      targetRevision: 0.29.6
      helm:
        valuesObject:
          injector:
            enabled: false
          csi:
            enabled: false
          ui:
            enabled: true
          server:
            dataStorage:
              enabled: false
            extraSecretEnvironmentVars:
              - envName: BAO_PG_CONNECTION_URL
                secretName: openbao-database-secret
                secretKey: DATABASE_URL
            extraArgs: -config=/openbao/userconfig/azure-unseal/seal.hcl
            volumes:
              - name: plugins
                emptyDir: {}
              - name: azure-unseal
                secret:
                  secretName: openbao-azure-unseal
            volumeMounts:
              - name: plugins
                mountPath: /openbao/plugins
              - name: azure-unseal
                mountPath: /openbao/userconfig/azure-unseal
                readOnly: true
            ha:
              enabled: true
              replicas: 2
              raft:
                enabled: false
              config: |
                ui = true

                listener "tcp" {
                  tls_disable     = 1
                  address         = "[::]:8200"
                  cluster_address = "[::]:8201"
                }

                storage "postgresql" {
                  ha_enabled = "true"
                }

                plugin_directory     = "/openbao/plugins"
                plugin_auto_download = true

                plugin "kms" "azurekeyvault" {
                  image = "ghcr.io/openbao/openbao-plugin-kms-azure:v0.1.0@sha256:7dd89c064f16dcaa8a49b389099edf23439a2b67d2d6871146e598b9b6f96324"
                }

                service_registration "kubernetes" {}
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      path: system-components/openbao
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao

operation:
  initiatedBy:
    username: github-actions
  sync:
    syncStrategy:
      hook: {}

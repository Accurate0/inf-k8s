# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
spec:
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        internal-gateway-access: "true"
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: system-components
  sources:
    - chart: k8s-http-routes
      repoURL: oci://ghcr.io/accurate0/charts/k8s-http-routes
      targetRevision: 2.3.1
      helm:
        valuesObject:
          routes:
            - name: openbao
              gateway:
                name: internal-gateway
                namespace: envoy-gateway-system
              hostnames:
                - vault.inf-k8s.net
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: openbao-active
                      port: 8200
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /
    - chart: k8s-oidc
      repoURL: oci://ghcr.io/accurate0/charts/k8s-oidc
      targetRevision: 0.2.2
      helm:
        valuesObject:
          clients:
            - name: openbao
              namespace: openbao
              displayName: OpenBao
              host: vault.inf-k8s.net
              callbackPath: /ui/vault/auth/oidc/oidc/callback
              preferShortUsername: true
              scopeMaps:
                platform_admins:
                  - openid
                  - email
                  - profile
                  - groups
              secretName: kanidm-openbao-oidc
              secretNamespace: openbao
    - chart: k8s-secrets
      repoURL: oci://ghcr.io/accurate0/charts/k8s-secrets
      targetRevision: 0.5.2
      helm:
        valuesObject:
          defaults:
            namespace: openbao
            provider: azurekv
            resyncInterval: 900
          secrets:
            - name: openbao-database
              managedSecrets:
                - secretName: openbao-db-credentials
                  template:
                    data:
                      DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@cloudnative-pg-cluster-rw.cnpg-system:5432/openbao"
    - chart: openbao
      repoURL: https://openbao.github.io/openbao-helm
      targetRevision: 0.29.6
      helm:
        valuesObject:
          injector:
            enabled: false
          csi:
            enabled: false
          ui:
            enabled: true
          server:
            dataStorage:
              enabled: false
            extraSecretEnvironmentVars:
              - envName: BAO_PG_CONNECTION_URL
                secretName: openbao-db-credentials
                secretKey: DATABASE_URL
            extraArgs: -config=/openbao/userconfig/azure-unseal/seal.hcl
            volumes:
              - name: plugins
                emptyDir: {}
              - name: azure-unseal
                secret:
                  secretName: openbao-azure-unseal
            volumeMounts:
              - name: plugins
                mountPath: /openbao/plugins
              - name: azure-unseal
                mountPath: /openbao/userconfig/azure-unseal
                readOnly: true
            topologySpreadConstraints:
              - topologyKey: inf-k8s.net/location
                maxSkew: 1
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: openbao
                    app.kubernetes.io/instance: openbao
                    component: server
            ha:
              enabled: true
              replicas: 2
              raft:
                enabled: false
              config: |
                ui = true

                listener "tcp" {
                  tls_disable     = 1
                  address         = "[::]:8200"
                  cluster_address = "[::]:8201"
                }

                storage "postgresql" {
                  ha_enabled = "true"
                }

                plugin_directory     = "/openbao/plugins"
                plugin_auto_download = true

                plugin "kms" "azurekeyvault" {
                  image       = "ghcr.io/openbao/openbao-plugin-kms-azure"
                  version     = "v0.1.0"
                  binary_name = "openbao-plugin-kms-azure"
                  sha256sum   = "e46a6d13ab427b594c89e58b002db6bbb6d61557f5de8a599557c76827deef0d"
                }

                service_registration "kubernetes" {}
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      path: system-components/openbao
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao

operation:
  initiatedBy:
    username: github-actions
  sync:
    syncStrategy:
      hook: {}

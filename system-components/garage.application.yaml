# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
spec:
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        internal-gateway-access: "true"
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: system-components
  sources:
    - chart: k8s-secrets
      repoURL: oci://ghcr.io/accurate0/charts/k8s-secrets
      targetRevision: 0.6.0
      helm:
        valuesObject:
          defaults:
            namespace: garage
            provider: openbao
            resyncInterval: 900
          secrets:
            - name: garage
              managedSecrets:
                - secretName: garage-secrets
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      path: system-components/garage
    - chart: k8s-http-routes
      repoURL: oci://ghcr.io/accurate0/charts/k8s-http-routes
      targetRevision: 2.4.0
      helm:
        valuesObject:
          routes:
            - name: garage-admin
              gateway:
                name: internal-gateway
                namespace: envoy-gateway-system
              hostnames:
                - garage-admin.ortzi.cloud
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: garage
                      port: 3903
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /
  destination:
    server: https://kubernetes.default.svc
    namespace: garage

operation:
  initiatedBy:
    username: github-actions
  sync:
    syncStrategy:
      hook: {}

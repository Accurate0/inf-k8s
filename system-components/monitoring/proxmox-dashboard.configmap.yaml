apiVersion: v1
kind: ConfigMap
metadata:
  name: proxmox-dashboard
  namespace: monitoring
  labels:
    inf-k8s.net/grafana-dashboard: "true"
data:
  proxmox.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "schemaVersion": 39,
      "tags": ["proxmox", "pve", "host"],
      "title": "Proxmox",
      "uid": "proxmox-host",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "1m",
      "templating": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "CPU usage",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "1 - avg(rate(node_cpu_seconds_total{instance=\"pve\", mode=\"idle\"}[5m]))", "legendFormat": "busy" },
            { "refId": "B", "expr": "avg(rate(node_cpu_seconds_total{instance=\"pve\", mode=\"iowait\"}[5m]))", "legendFormat": "iowait" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Memory",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "node_memory_MemTotal_bytes{instance=\"pve\"} - node_memory_MemAvailable_bytes{instance=\"pve\"}", "legendFormat": "used" },
            { "refId": "B", "expr": "node_zfs_arc_size{instance=\"pve\"}", "legendFormat": "zfs arc" },
            { "refId": "C", "expr": "node_memory_MemTotal_bytes{instance=\"pve\"}", "legendFormat": "total" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "ZFS ARC hit ratio",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "rate(node_zfs_arc_hits[5m]) / clamp_min(rate(node_zfs_arc_hits[5m]) + rate(node_zfs_arc_misses[5m]), 1)", "legendFormat": "hit ratio" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Disk throughput",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "rate(node_disk_read_bytes_total{instance=\"pve\", device=~\"sd.*|nvme.*\"}[5m])", "legendFormat": "{{device}} read" },
            { "refId": "B", "expr": "rate(node_disk_written_bytes_total{instance=\"pve\", device=~\"sd.*|nvme.*\"}[5m])", "legendFormat": "{{device}} write" }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "SMART health",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            { "refId": "A", "format": "table", "instant": true, "expr": "smartmon_device_smart_healthy{instance=\"pve\"}" },
            { "refId": "B", "format": "table", "instant": true, "expr": "smartmon_temperature_celsius_raw_value{instance=\"pve\"}" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Filesystem usage",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "1 - node_filesystem_avail_bytes{instance=\"pve\", fstype!~\"tmpfs|nfs4|fuse.*\"} / node_filesystem_size_bytes{instance=\"pve\", fstype!~\"tmpfs|nfs4|fuse.*\"}", "legendFormat": "{{mountpoint}}" }
          ]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Guests",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            { "refId": "A", "format": "table", "instant": true, "expr": "pve_guest_info * on (id) group_left () pve_up" }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Storage usage",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "pve_disk_usage_bytes{id=~\"storage/.*\"} / clamp_min(pve_disk_size_bytes{id=~\"storage/.*\"}, 1)", "legendFormat": "{{id}}" }
          ]
        },
        {
          "id": 9,
          "type": "table",
          "title": "Guest memory and uptime",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 32 },
          "targets": [
            { "refId": "A", "format": "table", "instant": true, "expr": "pve_memory_usage_bytes{id=~\"(qemu|lxc)/.*\"}" },
            { "refId": "B", "format": "table", "instant": true, "expr": "pve_uptime_seconds{id=~\"(qemu|lxc)/.*\"}" }
          ]
        }
      ]
    }

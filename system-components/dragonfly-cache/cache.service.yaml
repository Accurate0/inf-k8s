# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/core/service_v1.json
apiVersion: v1
kind: Service
metadata:
  name: cache
spec:
  type: ClusterIP
  trafficDistribution: PreferSameZone
  selector:
    inf-k8s.net/dragonfly-cache-tier: local
    role: master
  ports:
    - name: redis
      port: 6379
      protocol: TCP
      targetPort: 6379
    - name: memcached
      port: 11211
      protocol: TCP
      targetPort: 11211

apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-web-config-template
data:
  config.yaml: |
    apiVersion: web.fluxcd.controlplane.io/v1
    kind: Config
    spec:
      baseURL: https://flux.ortzi.cloud
      authentication:
        type: OAuth2
        oauth2:
          provider: OIDC
          clientID: "{{ .CLIENT_ID }}"
          clientSecret: "{{ .CLIENT_SECRET }}"
          issuerURL: https://idm.anurag.sh/oauth2/openid/flux
          scopes:
            - openid
            - email
            - profile
            - groups
      userActions:
        access: Impersonated

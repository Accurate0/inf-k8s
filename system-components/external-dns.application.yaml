# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
  project: system-components
  sources:
    - chart: k8s-secrets
      repoURL: oci://ghcr.io/accurate0/charts/k8s-secrets
      targetRevision: 0.6.0
      helm:
        valuesObject:
          defaults:
            namespace: external-dns
            provider: openbao
            resyncInterval: 900
          secrets:
            - name: external-dns
              managedSecrets:
                - secretName: external-dns-secrets
                  template:
                    includeAllSecrets: false
                    data:
                      CF_API_TOKEN: "{{ .CF_API_TOKEN }}"
                      TXT_ENCRYPT_AES_KEY: "{{ .TXT_ENCRYPT_AES_KEY }}"
                      UNIFI_API_TOKEN: "{{ .UNIFI_API_TOKEN }}"
    - chart: external-dns
      repoURL: https://kubernetes-sigs.github.io/external-dns/
      targetRevision: 1.23.0
      helm:
        valuesObject:
          provider:
            name: cloudflare
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: external-dns-secrets
                  key: CF_API_TOKEN
            - name: EXTERNAL_DNS_TXT_ENCRYPT_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: external-dns-secrets
                  key: TXT_ENCRYPT_AES_KEY
          extraArgs:
            - --txt-encrypt-enabled
            - --cloudflare-record-comment=Provisioned by external-dns
          policy: sync
          interval: 15m
          triggerLoopOnEvent: true
          sources:
            - gateway-httproute
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: monitoring
          txtOwnerId: inf-k8s
          annotationFilter: "external-dns.kubernetes.io/managed=true"
          domainFilters:
            - anurag.sh
            - anurag.id.au
            - ortzi.cloud
            - maccas.one
    - chart: external-dns
      repoURL: https://kubernetes-sigs.github.io/external-dns/
      targetRevision: 1.23.0
      helm:
        releaseName: external-dns-unifi
        valuesObject:
          fullnameOverride: external-dns-unifi
          provider:
            name: webhook
            webhook:
              image:
                repository: ghcr.io/home-operations/external-dns-unifi-webhook
                tag: 0.10.14
              env:
                - name: UNIFI_HOST
                  value: https://unifi.internal
                - name: UNIFI_SITE
                  value: default
                - name: UNIFI_SKIP_TLS_VERIFY
                  value: "true"
                - name: UNIFI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: external-dns-secrets
                      key: UNIFI_API_TOKEN
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http-webhook
                initialDelaySeconds: 10
                timeoutSeconds: 5
              readinessProbe:
                httpGet:
                  path: /readyz
                  port: http-webhook
                initialDelaySeconds: 10
                timeoutSeconds: 5
          nodeSelector:
            inf-k8s.net/location: perth
          policy: sync
          interval: 15m
          triggerLoopOnEvent: true
          sources:
            - gateway-httproute
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: monitoring
          txtOwnerId: inf-k8s-unifi
          txtPrefix: k8s.%{record_type}-
          annotationFilter: "external-dns.kubernetes.io/managed-unifi=true"
          domainFilters:
            - internal
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns

operation:
  initiatedBy:
    username: github-actions
  sync:
    syncStrategy:
      hook: {}

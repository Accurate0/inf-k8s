# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        internal-gateway-access: "true"
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: system-components
  sources:
    - chart: k8s-secrets
      repoURL: oci://ghcr.io/accurate0/charts/k8s-secrets
      targetRevision: 0.5.1
      helm:
        valuesObject:
          defaults:
            namespace: longhorn-system
            provider: openbao
            resyncInterval: 900
          secrets:
            - name: longhorn-system
              managedSecrets:
                - secretName: longhorn-backup-credentials
                  template:
                    includeAllSecrets: false
                    data:
                      AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
                      AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
                      AWS_ENDPOINTS: "{{ .AWS_ENDPOINTS }}"
    - chart: k8s-oidc
      repoURL: oci://ghcr.io/accurate0/charts/k8s-oidc
      targetRevision: 0.2.2
      helm:
        valuesObject:
          clients:
            - name: longhorn
              namespace: longhorn-system
              displayName: Longhorn
              host: longhorn.inf-k8s.net
              preferShortUsername: true
              allowInsecureClientDisablePkce: true
              secretKeys:
                clientId: client-id
                clientSecret: client-secret
              scopeMaps:
                platform_admins:
                  - openid
                  - email
                  - profile
              secretName: kanidm-longhorn-oidc
              secretNamespace: longhorn-system
              icon:
                configMap: longhorn-kanidm-icon
                key: longhorn.png
              securityPolicy:
                httpRoute: longhorn
                scopes:
                  - openid
                  - email
                  - profile
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      path: system-components/longhorn
    - chart: k8s-http-routes
      repoURL: oci://ghcr.io/accurate0/charts/k8s-http-routes
      targetRevision: 2.3.1
      helm:
        valuesObject:
          routes:
            - name: longhorn
              gateway:
                name: internal-gateway
                namespace: envoy-gateway-system
              hostnames:
                - longhorn.inf-k8s.net
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: longhorn-frontend
                      port: 80
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: 1.12.0
      helm:
        valuesObject:
          global:
            tolerations:
              - key: "inf-k8s.net/architecture"
                operator: "Equal"
                value: "arm64"
                effect: "NoSchedule"
          preUpgradeChecker:
            jobEnabled: false
            upgradeVersionCheck: false
          longhornUI:
            replicas: 1
          defaultBackupStore:
            backupTarget: s3://longhorn-backup@us-east-1/
            backupTargetCredentialSecret: longhorn-backup-credentials
          defaultSettings:
            taintToleration: inf-k8s.net/architecture=arm64:NoSchedule
          ingress:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

operation:
  initiatedBy:
    username: github-actions
  sync:
    syncStrategy:
      hook: {}

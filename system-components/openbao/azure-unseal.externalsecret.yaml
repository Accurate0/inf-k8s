# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-azure-unseal
  namespace: openbao
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: k8s-shared-vault
    kind: ClusterSecretStore
  target:
    name: openbao-azure-unseal
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: AZURE_CLIENT_ID
      remoteRef:
        key: openbao-azure-client-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: AZURE_CLIENT_SECRET
      remoteRef:
        key: openbao-azure-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

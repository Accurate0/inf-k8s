# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/apps/deployment_apps_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-local
  namespace: kube-system
  labels:
    app: coredns-local
    kubernetes.io/name: CoreDNS
spec:
  replicas: 2
  revisionHistoryLimit: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 1

  # Distinct from the k3s-owned deployment so the two ReplicaSets never contend
  # over each other's pods. The pods additionally carry k8s-app: kube-dns, which
  # is what the existing kube-dns Service selects on.
  selector:
    matchLabels:
      app: coredns-local

  template:
    metadata:
      labels:
        app: coredns-local
        k8s-app: kube-dns
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: coredns
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux

      # Pin to the two locations that have workloads needing a local resolver.
      # oracle-sydney is deliberately excluded: PreferClose falls back to the
      # cluster-wide endpoints for zones without one.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: inf-k8s.net/location
                    operator: In
                    values:
                      - australind
                      - perth

      # With replicas: 2 over exactly two eligible locations, this puts one
      # replica in each.
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: coredns-local
          maxSkew: 1
          topologyKey: inf-k8s.net/location
          whenUnsatisfiable: DoNotSchedule

      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.3
          imagePullPolicy: IfNotPresent
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 70Mi
            limits:
              memory: 170Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - all
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
              readOnly: true
            - name: custom-config-volume
              mountPath: /etc/coredns/custom
              readOnly: true

      # The k3s-managed ConfigMaps are mounted rather than copied, so Corefile
      # and NodeHosts stay single-sourced.
      volumes:
        - name: config-volume
          configMap:
            name: coredns
            items:
              - key: Corefile
                path: Corefile
              - key: NodeHosts
                path: NodeHosts
        - name: custom-config-volume
          configMap:
            name: coredns-custom
            optional: true

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/apps/statefulset_v1.json
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kanidm
  labels:
    app.kubernetes.io/name: kanidm
spec:
  replicas: 1
  serviceName: kanidm
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: kanidm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanidm
    spec:
      serviceAccountName: kanidm-repl
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      topologySpreadConstraints:
        - topologyKey: inf-k8s.net/location
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kanidm
      initContainers:
        - name: repl-bootstrap
          image: ghcr.io/accurate0/kanidm-repl-coordinator:1.10.3-1
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HEADLESS_SVC
              value: kanidm-headless
            - name: KANIDM_REPLICAS
              value: "1"
            - name: KANIDM_DOMAIN
              value: idm.anurag.sh
            - name: KANIDM_ORIGIN
              value: https://idm.anurag.sh
            - name: HOME
              value: /tmp
            - name: KUBECACHEDIR
              value: /tmp/.kube
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: shared
              mountPath: /shared
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: kanidm
          image: docker.io/kanidm/server:1.10.3
          command: ["/sbin/kanidmd", "server", "-c", "/shared/server.toml"]
          ports:
            - name: https
              containerPort: 8443
            - name: ldaps
              containerPort: 3636
            - name: replication
              containerPort: 8444
          livenessProbe:
            httpGet:
              path: /status
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: shared
              mountPath: /shared
              readOnly: true
            - name: run
              mountPath: /var/run
      volumes:
        - name: certs
          secret:
            secretName: idm-anurag-sh-tls
            defaultMode: 0440
        - name: shared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: scripts
          configMap:
            name: kanidm-coordinator
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-replicated
        resources:
          requests:
            storage: 10Gi

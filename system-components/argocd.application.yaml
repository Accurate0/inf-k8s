# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        inf-k8s.net/infisical-secrets: "true"
        internal-gateway-access: "true"
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: system-components
  sources:
    - chart: k8s-oidc
      repoURL: oci://ghcr.io/accurate0/charts/k8s-oidc
      targetRevision: 0.2.2
      helm:
        valuesObject:
          clients:
            - name: argocd
              namespace: argocd
              displayName: Argo CD
              host: argocd.inf-k8s.net
              callbackPath: /api/dex/callback
              extraRedirectUrls:
                - https://argocd.inf-k8s.net/auth/callback
              preferShortUsername: true
              secretLabels:
                app.kubernetes.io/part-of: argocd
              scopeMaps:
                argocd_users:
                  - openid
                  - email
                  - profile
                  - groups
                platform_admins:
                  - openid
                  - email
                  - profile
                  - groups
              secretName: kanidm-argocd-oidc
              secretNamespace: argocd
              icon:
                configMap: argocd-kanidm-icon
                key: ArgoCD.svg
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      path: system-components/argocd
    - chart: k8s-http-routes
      repoURL: oci://ghcr.io/accurate0/charts/k8s-http-routes
      targetRevision: 2.2.0
      helm:
        valuesObject:
          routes:
            - name: argocd-server
              gateway:
                name: internal-gateway
                namespace: envoy-gateway-system
              hostnames:
                - argocd.inf-k8s.net
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: argocd-server
                      port: 80
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /
    - chart: k8s-secrets
      repoURL: oci://ghcr.io/accurate0/charts/k8s-secrets
      targetRevision: 0.3.0
      helm:
        valuesObject:
          defaults:
            namespace: argocd
            projectSlug: argo-cd-d-yw-k
            resyncInterval: 900
          secrets:
            - name: argocd-secrets
              labels:
                app.kubernetes.io/part-of: argocd
              secretPath: /
              managedSecrets:
                - secretName: argocd-managed-secrets
            - name: argocd-github-repo-creds
              secretPath: /github-repo-creds
              labels:
                app.kubernetes.io/part-of: argocd
                argocd.argoproj.io/secret-type: repo-creds
              managedSecrets:
                - secretName: argocd-github-repo-creds
                  template:
                    data:
                      type: git
                      url: https://github.com/Accurate0
                      githubAppID: "{{ .GITHUB_APP_ID }}"
                      githubAppInstallationID: "{{ .GITHUB_APP_INSTALLATION_ID }}"
                      githubAppPrivateKey: "{{ .GITHUB_APP_PRIVATE_KEY }}"
    - chart: argo-cd
      repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 10.9.2
      helm:
        valuesObject:
          global:
            domain: argocd.inf-k8s.net

          configs:
            cm:
              admin.enabled: false
              accounts.anurag.enabled: false
              accounts.janitor: apiKey
              dex.config: |
                connectors:
                - config:
                    issuer: https://idm.anurag.sh/oauth2/openid/argocd
                    clientID: $kanidm-argocd-oidc:clientId
                    clientSecret: $kanidm-argocd-oidc:clientSecret
                    insecureEnableGroups: true
                    enablePKCEAuthentication: true
                    scopes:
                      - openid
                      - profile
                      - email
                      - groups
                  name: kanidm
                  type: oidc
                  id: kanidm
            rbac:
              policy.csv: |
                g, platform_admins@idm.anurag.sh, role:admin
                p, github-actions, applications, sync, bootstrap/*, allow
                p, github-actions, applications, get, bootstrap/*, allow
                p, github-actions, applications, sync, system-components/*, allow
                p, github-actions, applications, get, system-components/*, allow
                p, github-actions, applications, sync, platform-services/*, allow
                p, github-actions, applications, get, platform-services/*, allow
                p, github-actions, applications, sync, projects/*, allow
                p, github-actions, applications, get, projects/*, allow
                p, github-actions, applications, sync, selfhosted/*, allow
                p, github-actions, applications, get, selfhosted/*, allow
                p, github-actions, projects, get, *, allow
                p, janitor, applications, get, bootstrap/*, allow
                p, janitor, applications, sync, bootstrap/*, allow
                p, janitor, applications, get, system-components/*, allow
                p, janitor, applications, sync, system-components/*, allow
                p, janitor, applications, get, platform-services/*, allow
                p, janitor, applications, sync, platform-services/*, allow
                p, janitor, applications, get, projects/*, allow
                p, janitor, applications, sync, projects/*, allow
                p, janitor, applications, get, selfhosted/*, allow
                p, janitor, applications, sync, selfhosted/*, allow
                p, janitor, projects, get, *, allow
            params:
              server.insecure: true
            secret:
              githubSecret: $argocd-managed-secrets:GITHUB_WEBHOOK_SECRET

          notifications:
            enabled: true
            secret:
              create: false
              name: argocd-managed-secrets
            subscriptions:
              - recipients:
                  - janitor-bot
                triggers:
                  - on-sync-succeeded
                  - on-sync-failed
            notifiers:
              service.webhook.janitor-bot: |
                url: http://api.janitor-bot.svc.cluster.local/argocd/webhook
                headers:
                  - name: Content-Type
                    value: application/json
                  - name: Authorization
                    value: $ARGOCD_JANITOR_WEBHOOK_SECRET
            templates:
              template.sync-status: |
                webhook:
                  janitor-bot:
                    method: POST
                    body: |
                      {
                        "app_name": "{{.app.metadata.name}}",
                        "sha": "{{if .app.status.sync.revision}}{{.app.status.sync.revision}}{{else}}{{range $i, $src := .app.spec.sources}}{{if eq (default "" $src.repoURL) "https://github.com/Accurate0/inf-k8s.git"}}{{index $.app.status.operationState.syncResult.revisions $i}}{{end}}{{end}}{{end}}",
                        "sync_status": "{{.app.status.sync.status}}",
                        "health_status": "{{.app.status.health.status}}",
                        "phase": "{{.app.status.operationState.phase}}",
                        "message": "{{.app.status.operationState.message}}"
                      }
            triggers:
              trigger.on-sync-succeeded: |
                - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
                  send: [sync-status]
              trigger.on-sync-failed: |
                - when: app.status.operationState.phase in ['Failed', 'Error']
                  send: [sync-status]

          dex:
            livenessProbe:
              enabled: true
            readinessProbe:
              enabled: true

          server:
            ingress:
              enabled: false
              ingressClassName: nginx
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-prod
                nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
                nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
              extraTls:
                - hosts:
                    - argocd.inf-k8s.net
                  secretName: argocd-inf-k8s-tls

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

operation:
  initiatedBy:
    username: github-actions
  sync:
    syncStrategy:
      hook: {}

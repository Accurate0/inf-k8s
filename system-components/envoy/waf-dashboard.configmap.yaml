apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-waf-dashboard
  namespace: envoy-gateway-system
  labels:
    inf-k8s.net/grafana-dashboard: "true"
data:
  envoy-coraza-waf.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "schemaVersion": 39,
      "tags": ["envoy", "waf", "coraza"],
      "title": "Envoy Coraza WAF",
      "uid": "envoy-coraza-waf",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "10s",
      "templating": {
        "list": [
          {
            "name": "filter",
            "label": "Log filter",
            "type": "textbox",
            "query": "",
            "current": { "text": "", "value": "" }
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Transactions / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(envoy_dynamicmodulescustom_waf_tx_total[5m]))", "legendFormat": "total" },
            { "refId": "B", "expr": "sum by (authority) (rate(envoy_dynamicmodulescustom_waf_tx_total[5m]))", "legendFormat": "{{authority}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "WAF processing latency (ms)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.50, sum(rate(envoy_dynamicmodulescustom_waf_tx_duration_bucket[5m])) by (le))", "legendFormat": "p50" },
            { "refId": "B", "expr": "histogram_quantile(0.95, sum(rate(envoy_dynamicmodulescustom_waf_tx_duration_bucket[5m])) by (le))", "legendFormat": "p95" },
            { "refId": "C", "expr": "histogram_quantile(0.99, sum(rate(envoy_dynamicmodulescustom_waf_tx_duration_bucket[5m])) by (le))", "legendFormat": "p99" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Blocked transactions / sec",
          "description": "Populated only when SecRuleEngine is On; stays at 0 in DetectionOnly.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(envoy_dynamicmodulescustom_waf_tx_blocked[5m]))", "legendFormat": "blocked" },
            { "refId": "B", "expr": "sum by (authority) (rate(envoy_dynamicmodulescustom_waf_tx_blocked[5m]))", "legendFormat": "{{authority}}" }
          ]
        },
        {
          "type": "table",
          "title": "Top matched rules",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "refId": "A", "format": "table", "instant": true, "expr": "topk(10, sum by (rule_id, phase) (rate(envoy_dynamicmodulescustom_waf_tx_blocked[5m])))" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Rule matches / min (from logs)",
          "description": "Coraza detections parsed out of the proxy log. Populated in DetectionOnly, unlike the blocked-transaction metrics above.",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "queryType": "range", "expr": "sum by (rule_id, rule_msg) (count_over_time({namespace=\"envoy-gateway-system\", container=\"envoy\"} |= `coraza/config.go` |~ `$filter` | json | line_format `{{.msg}}` | regexp `\\[id \"(?P<rule_id>\\d+)\"\\]` | regexp `\\[msg \"(?P<rule_msg>[^\"]*)\"\\]` | label_format rule_msg=`{{ regexReplaceAll \" \\\\(Total Score: [0-9]+\\\\)\" .rule_msg \"\" }}` [1m]))", "legendFormat": "{{rule_id}} — {{rule_msg}}" }
          ]
        },
        {
          "type": "table",
          "title": "Top matched rules (from logs)",
          "description": "Rule ids and messages seen over the dashboard time range.",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "targets": [
            { "refId": "A", "queryType": "instant", "instant": true, "format": "table", "expr": "topk(10, sum by (rule_id, rule_msg, severity) (count_over_time({namespace=\"envoy-gateway-system\", container=\"envoy\"} |= `coraza/config.go` |~ `$filter` | json | line_format `{{.msg}}` | regexp `\\[id \"(?P<rule_id>\\d+)\"\\]` | regexp `\\[msg \"(?P<rule_msg>[^\"]*)\"\\]` | label_format rule_msg=`{{ regexReplaceAll \" \\\\(Total Score: [0-9]+\\\\)\" .rule_msg \"\" }}` [$__range])))" }
          ]
        },
        {
          "type": "table",
          "title": "Top client IPs (from logs)",
          "description": "Clients with the most rule matches over the dashboard time range.",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            { "refId": "A", "queryType": "instant", "instant": true, "format": "table", "expr": "topk(10, sum by (client_ip) (count_over_time({namespace=\"envoy-gateway-system\", container=\"envoy\"} |= `coraza/config.go` |~ `$filter` | json | line_format `{{.msg}}` | regexp `\\[client \"(?P<client_ip>[^\"]*)\"\\]` [$__range])))" }
          ]
        },
        {
          "type": "logs",
          "title": "Coraza detections",
          "description": "One line per matched rule, with the client, rule id, message and target URI.",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 32 },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "targets": [
            { "refId": "A", "queryType": "range", "expr": "{namespace=\"envoy-gateway-system\", container=\"envoy\"} |= `coraza/config.go` |~ `$filter` | json | line_format `{{.msg}}` | regexp `\\[client \"(?P<client_ip>[^\"]*)\"\\]` | regexp `\\[id \"(?P<rule_id>\\d+)\"\\]` | regexp `\\[msg \"(?P<rule_msg>[^\"]*)\"\\]` | regexp `\\[data \"(?P<rule_data>[^\"]*)\"\\]` | regexp `\\[uri \"(?P<uri>[^\"]*)\"\\]` | line_format `{{.client_ip}} [{{.severity}}] {{.rule_id}} {{.rule_msg}} data={{.rule_data}} uri={{.uri}}`" }
          ]
        }
      ]
    }

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.kubernetes.io/target: ortzi.cloud
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: wildcard-ortzi-https
      protocol: HTTPS
      hostname: "*.ortzi.cloud"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              internal-gateway-access: "true"
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-ortzi-tls

    - name: ortzi-https
      protocol: HTTPS
      hostname: ortzi.cloud
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              internal-gateway-access: "true"
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: ortzi-tls

    # old base domain, only serves the redirects in inf-k8s-redirect.httproute.yaml
    - name: wildcard-inf-k8s-https
      protocol: HTTPS
      hostname: "*.inf-k8s.net"
      allowedRoutes:
        namespaces:
          from: Same
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-inf-k8s-tls

    - name: inf-k8s-https
      protocol: HTTPS
      hostname: inf-k8s.net
      allowedRoutes:
        namespaces:
          from: Same
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: inf-k8s-tls

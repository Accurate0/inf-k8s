# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inf-k8s-redirect
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-gateway
      sectionName: inf-k8s-https
  hostnames:
    - inf-k8s.net
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: ortzi.cloud
            scheme: https
            port: 443
            statusCode: 301
---

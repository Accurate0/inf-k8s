apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config.yaml
  - gatewayclass.yaml
  - podmonitor.yaml
  - servicemonitor.yaml
  - internal/backend.policy.yaml
  - internal/client.policy.yaml
  - internal/gateway.yaml
  - internal/inf-k8s-redirect.httproute.yaml
  - internal/tailscale-client-ip.securitypolicy.yaml
  - lan/certificate.yaml
  - lan/config.yaml
  - lan/gatewayclass.yaml
  - lan/gateway.yaml
  - lan/lan-client-ip.securitypolicy.yaml
  - lan/https-redirect.httproute.yaml
  - public/backend.policy.yaml
  - public/gateway.yaml
  - public/extension.policy.yaml
  - public/client-policy
  - public/client-policy-git
  - public/client-policy-photos
  - waf-dashboard.configmap.yaml
  - cloudflare-ips/rbac.yaml
  - cloudflare-ips/cronjob.yaml
configMapGenerator:
  - name: block-user-agents-lua
    files:
      - lua=public/block-user-agents.lua
    options:
      disableNameSuffixHash: true

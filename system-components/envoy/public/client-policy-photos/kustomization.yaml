apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../client-policy
patches:
  - target:
      kind: ClientTrafficPolicy
      name: public-gateway-client-policy
    patch: |-
      - op: replace
        path: /metadata/name
        value: photos-anurag-sh-client-policy
      - op: add
        path: /spec/targetRefs/0/sectionName
        value: photos-anurag-sh-https
      - op: replace
        path: /spec/timeout/http/requestReceivedTimeout
        value: 3600s

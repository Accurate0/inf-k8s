# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/gateway.envoyproxy.io/envoyextensionpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: public-gateway-waf
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  dynamicModule:
    - name: composer
      filterName: coraza-waf
      terminalFilter: false
      config:
        directives:
          - Include @coraza.conf
          - SecRuleEngine DetectionOnly
          - SecResponseBodyAccess Off
          - SecAuditEngine RelevantOnly
          - SecAuditLogParts ABIJDEFHZ
          - SecAuditLogType Serial
          - SecAuditLog /dev/stdout
          - SecAuditLogFormat JSON
          - Include @crs-setup.conf
          - SecRule REQUEST_HEADERS:Host "@streq idm.anurag.sh" "id:1001,phase:1,pass,nolog,t:none,setvar:tx.allowed_methods=GET HEAD POST OPTIONS PATCH PUT DELETE"
          - SecRule REQUEST_HEADERS:Host "@streq maccas.one" "id:1002,phase:1,pass,nolog,t:none,setvar:tx.allowed_methods=GET HEAD POST OPTIONS PATCH PUT DELETE"
          - Include @owasp_crs/*.conf

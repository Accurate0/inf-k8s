# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-anurag-sh-tls
spec:
  dnsNames:
    - registry.anurag.sh
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: registry-anurag-sh-tls
  usages:
    - digital signature
    - server auth

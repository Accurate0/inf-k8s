# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-proxy-lan-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: "Kubernetes"
    kubernetes:
      useListenerPortAsContainerPort: true
      envoyDeployment:
        replicas: 1
        strategy:
          type: Recreate
        pod:
          nodeSelector:
            inf-k8s.net/lan-proxy: "true"
        container:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            seccompProfile:
              type: RuntimeDefault
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  hostNetwork: true
                  dnsPolicy: ClusterFirstWithHostNet
      envoyService:
        type: ClusterIP
  telemetry:
    metrics:
      prometheus: {}
      enableVirtualHostStats: true
    tracing:
      samplingRate: 100
      provider:
        backendRefs:
          - group: ""
            kind: Service
            name: monitoring-tempo
            namespace: monitoring
            port: 4317
            weight: 1
        type: OpenTelemetry
      customTags:
        provider:
          type: Literal
          literal:
            value: "otel"
        "k8s.pod.name":
          type: Environment
          environment:
            name: ENVOY_POD_NAME
            defaultValue: "-"
        "k8s.namespace.name":
          type: Environment
          environment:
            name: ENVOY_POD_NAMESPACE
            defaultValue: "envoy-gateway-system"

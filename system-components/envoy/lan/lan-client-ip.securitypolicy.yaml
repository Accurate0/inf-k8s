# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: lan-client-ip
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lan-gateway
  authorization:
    defaultAction: Deny
    rules:
      - action: Allow
        principal:
          clientCIDRs:
            - 10.0.2.0/24
            - 192.168.0.0/24
            - 10.42.0.0/16

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan-gateway
  annotations:
    external-dns.kubernetes.io/target: 10.0.2.18,2402:21a0:21db:2:be24:11ff:fe00:d2
spec:
  gatewayClassName: envoy-gateway-lan
  listeners:
    - name: http
      protocol: HTTP
      hostname: "*.internal"
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    - name: registry-anurag-sh-http
      protocol: HTTP
      hostname: registry.anurag.sh
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    - name: wildcard-internal-https
      protocol: HTTPS
      hostname: "*.internal"
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              inf-k8s.net/lan-gateway-access: "true"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: lan-gateway-tls

    - name: registry-anurag-sh-https
      protocol: HTTPS
      hostname: registry.anurag.sh
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              inf-k8s.net/lan-gateway-access: "true"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: registry-anurag-sh-tls

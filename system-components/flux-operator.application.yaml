# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flux-operator
  namespace: argocd
spec:
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        internal-gateway-access: "true"
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  project: system-components
  sources:
    - chart: k8s-secrets
      repoURL: oci://registry.anurag.sh/charts/k8s-secrets
      targetRevision: 0.7.0
      helm:
        valuesObject:
          defaults:
            namespace: flux-system
            provider: openbao
            resyncInterval: 900
          secrets:
            - name: harbor
              managedSecrets:
                - secretName: harbor
                  type: kubernetes.io/dockerconfigjson
                  template:
                    data:
                      .dockerconfigjson: '{"auths":{"registry.anurag.sh":{"username":"{{ .USERNAME }}","password":"{{ .PASSWORD }}"}}}'
            - name: cosign
              managedSecrets:
                - secretName: cosign
            - name: harbor-receiver
              managedSecrets:
                - secretName: harbor-receiver
          templates:
            - secretName: flux-web-config
              configMap: flux-web-config-template
              files:
                - config.yaml
              values:
                - name: CLIENT_ID
                  secret: kanidm-flux-oidc
                  key: client-id
                - name: CLIENT_SECRET
                  secret: kanidm-flux-oidc
                  key: client-secret
    - chart: k8s-oidc
      repoURL: oci://ghcr.io/accurate0/charts/k8s-oidc
      targetRevision: 0.4.0
      helm:
        valuesObject:
          clients:
            - name: flux
              namespace: flux-system
              displayName: Flux
              host: flux.ortzi.cloud
              preferShortUsername: true
              allowInsecureClientDisablePkce: true
              secretKeys:
                clientId: client-id
                clientSecret: client-secret
              secretName: kanidm-flux-oidc
              secretNamespace: flux-system
              scopes:
                - openid
                - email
                - profile
                - groups
    - repoURL: https://github.com/Accurate0/inf-k8s.git
      path: system-components/flux-operator
    - chart: k8s-http-routes
      repoURL: oci://ghcr.io/accurate0/charts/k8s-http-routes
      targetRevision: 2.3.1
      helm:
        valuesObject:
          routes:
            - name: flux
              gateway:
                name: internal-gateway
                namespace: envoy-gateway-system
              hostnames:
                - flux.ortzi.cloud
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: flux-operator
                      port: 9080
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /
    - chart: flux-operator
      repoURL: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
      targetRevision: 0.62.1
      helm:
        releaseName: flux-operator
        valuesObject:
          web:
            configSecretName: flux-web-config
    - chart: flux-instance
      repoURL: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
      targetRevision: 0.62.1
      helm:
        releaseName: flux-instance
        valuesObject:
          instance:
            distribution:
              version: 2.x
              registry: ghcr.io/fluxcd
            components:
              - source-controller
              - kustomize-controller
              - helm-controller
              - notification-controller
            cluster:
              type: kubernetes
              networkPolicy: true
            sync:
              interval: 10m
              kind: OCIRepository
              url: oci://registry.anurag.sh/manifests/cluster
              ref: main
              path: ./
              pullSecret: harbor
            kustomize:
              patches:
                - target:
                    kind: OCIRepository
                    name: flux-system
                  patch: |
                    - op: add
                      path: /spec/layerSelector
                      value:
                        mediaType: application/vnd.oci.image.layer.v1.tar+gzip
                        operation: extract
                    - op: add
                      path: /spec/verify
                      value:
                        provider: cosign
                        secretRef:
                          name: cosign
                - target:
                    kind: Kustomization
                    name: flux-system
                  patch: |
                    - op: add
                      path: /spec/patches
                      value:
                        - target:
                            group: kustomize.toolkit.fluxcd.io
                            kind: Kustomization
                          patch: |
                            - op: add
                              path: /spec/wait
                              value: true
                            - op: add
                              path: /spec/patches
                              value:
                                - target:
                                    group: helm.toolkit.fluxcd.io
                                    kind: HelmRelease
                                  patch: |
                                    apiVersion: helm.toolkit.fluxcd.io/v2
                                    kind: HelmRelease
                                    metadata:
                                      name: _
                                    spec:
                                      maxHistory: 3
                                      install:
                                        strategy:
                                          name: RetryOnFailure
                                      rollback:
                                        cleanupOnFail: true
                                      upgrade:
                                        cleanupOnFail: true
                                        strategy:
                                          name: RemediateOnFailure
                                        remediation:
                                          retries: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: flux-system

operation:
  initiatedBy:
    username: github-actions
  sync:
    syncStrategy:
      hook: {}

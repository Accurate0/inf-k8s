# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/apps/statefulset_v1.json
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  labels:
    app.kubernetes.io/name: garage
spec:
  replicas: 1
  serviceName: garage-headless
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        inf-k8s.net/location: perth
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-pve-1
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: migrate-metadata
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -f /meta/node_key ]; then exit 0; fi
              cp -r /old-meta/. /meta/
              chmod 600 /meta/node_key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: meta
              mountPath: /old-meta
              readOnly: true
            - name: metadata
              mountPath: /meta
      containers:
        - name: garage
          image: docker.io/dxflrs/garage:v2.5.0
          command: ["/garage", "server"]
          envFrom:
            - secretRef:
                name: garage-secrets
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: admin
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: metadata
              mountPath: /meta
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: meta
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-k8s-perth
        resources:
          requests:
            storage: 1Gi
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: metadata
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/daily-backup: enabled
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-replicated
        resources:
          requests:
            storage: 2Gi
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-k8s-perth
        resources:
          requests:
            storage: 500Gi

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/apps/statefulset_v1.json
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  labels:
    app.kubernetes.io/name: garage
spec:
  replicas: 1
  serviceName: garage-headless
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        inf-k8s.net/location: perth
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: garage
          image: docker.io/dxflrs/garage:v2.5.0
          command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
          envFrom:
            - secretRef:
                name: garage-secrets
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: admin
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/garage
              readOnly: true
            - name: meta
              mountPath: /meta
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: meta
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-k8s-perth
        resources:
          requests:
            storage: 1Gi
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-k8s-perth
        resources:
          requests:
            storage: 500Gi

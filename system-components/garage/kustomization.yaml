apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
  - service-headless.yaml
  - servicemonitor.yaml
  - ui.deployment.yaml
  - ui.service.yaml

configMapGenerator:
  - name: garage-config
    files:
      - garage.toml
    options:
      disableNameSuffixHash: true
  - name: garage-ui-config
    files:
      - garage-ui.yaml
    options:
      disableNameSuffixHash: true

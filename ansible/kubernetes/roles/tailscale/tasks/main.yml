---
- name: Tailscale
  become: true
  become_method: sudo
  become_user: root
  block:
    - name: Check whether tailscale is already installed
      ansible.builtin.stat:
        path: /usr/bin/tailscale
      register: tailscale_bin

    - name: Tailscale apt repo
      block:
        - name: Ensure directory exists for /etc/apt/keyrings
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Get release name
          ansible.builtin.shell:
            cmd: source /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"
            executable: "/bin/bash"
          register: release_name
          changed_when: false
          check_mode: false

        - name: Get distribution
          ansible.builtin.shell:
            cmd: source /etc/os-release && echo "$ID"
            executable: "/bin/bash"
          register: release_distribution
          changed_when: false
          check_mode: false

        - name: Add Tailscale apt key
          ansible.builtin.get_url:
            url: "https://pkgs.tailscale.com/stable/{{ release_distribution.stdout }}/{{ release_name.stdout }}.noarmor.gpg"
            dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
            mode: "0644"
            force: false

        - name: Add Tailscale sources
          ansible.builtin.get_url:
            url: "https://pkgs.tailscale.com/stable/{{ release_distribution.stdout }}/{{ release_name.stdout }}.tailscale-keyring.list"
            dest: /etc/apt/sources.list.d/tailscale.list
            mode: "0644"
            force: true

        - name: Remove release-upgrade leftovers of the Tailscale sources
          ansible.builtin.file:
            path: "/etc/apt/sources.list.d/{{ item }}"
            state: absent
          loop:
            - tailscale.list.disabled
            - tailscale.list.migrate

    - name: Install Tailscale
      when: not tailscale_bin.stat.exists
      block:
        - name: Install tailscale package
          ansible.builtin.package:
            update_cache: true
            name:
              - tailscale
            state: "present"
          notify:
            - Enable tailscaled

    - name: Fetch Tailscale status
      ansible.builtin.command: tailscale status --json
      changed_when: false
      check_mode: false
      register: tailscale_status

    - name: Parse tailscale status JSON
      ansible.builtin.set_fact:
        tailscale_is_online: "{{ (tailscale_status.stdout | from_json).Self.Online }}"

    - name: Assert the auth key is set
      ansible.builtin.assert:
        that:
          - tailscale_auth_key | default('', true) | length > 0
        fail_msg: tailscale_auth_key is empty, tailscale up would wait for an interactive login
      when: tailscale_join_network and not tailscale_is_online

    - name: Join network
      ansible.builtin.command: tailscale up --auth-key='{{ tailscale_auth_key }}' {{ tailscale_extra_args }}
      when: tailscale_join_network and not tailscale_is_online
      become: true
      become_user: root
      become_method: sudo
      tags:
        - skip_ansible_lint
      notify: Confirm Tailscale is Connected

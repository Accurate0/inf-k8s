---
# tasks file for proxy
- name: Setup Proxy
  become: true
  become_user: root
  become_method: sudo
  block:
    - name: Install Packages
      ansible.builtin.apt:
        package:
          - haproxy
          - curl
          - jq
      notify:
        - Start HAProxy

    - name: Get tailscale ip
      ansible.builtin.command: "tailscale ip -4"
      register: tailscale_ip_result
      check_mode: false
      tags:
        - skip_ansible_lint

    - name: Copy allowed-domains.txt
      ansible.builtin.copy:
        src: allowed-domains.txt
        dest: /etc/haproxy/allowed-domains.txt
        owner: root
        mode: "0644"
      notify:
        - Reload Haproxy

    - name: Template and copy trusted-sources.txt
      ansible.builtin.template:
        src: trusted-sources.txt.j2
        dest: /etc/haproxy/trusted-sources.txt
        owner: root
        mode: "0644"
      notify:
        - Reload Haproxy

    - name: Create nftables.d directory
      ansible.builtin.file:
        path: /etc/nftables.d
        state: directory
        owner: root
        mode: "0755"

    - name: Copy drop-ip-options ruleset
      ansible.builtin.copy:
        src: drop-ip-options.nft
        dest: /etc/nftables.d/drop-ip-options.nft
        owner: root
        mode: "0644"
        validate: "nft -c -f %s"
      notify:
        - Restart drop-ip-options

    - name: Copy drop-ip-options systemd unit
      ansible.builtin.copy:
        src: drop-ip-options.service
        dest: /etc/systemd/system/drop-ip-options.service
        owner: root
        mode: "0644"
      notify:
        - Restart drop-ip-options

    - name: Enable drop-ip-options
      ansible.builtin.systemd_service:
        name: drop-ip-options.service
        state: started
        enabled: true
        daemon_reload: true

    - name: Copy cloudflare-ips-sync script
      ansible.builtin.copy:
        src: cloudflare-ips-sync.sh
        dest: /usr/local/bin/cloudflare-ips-sync
        owner: root
        mode: "0755"

    - name: Copy cloudflare-ips-sync systemd units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        mode: "0644"
      loop:
        - cloudflare-ips-sync.service
        - cloudflare-ips-sync.timer

    - name: Sync cloudflare ips
      ansible.builtin.systemd_service:
        name: cloudflare-ips-sync.service
        state: started
        daemon_reload: true

    - name: Enable cloudflare-ips-sync timer
      ansible.builtin.systemd_service:
        name: cloudflare-ips-sync.timer
        state: started
        enabled: true

    - name: Create haproxy systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/haproxy.service.d
        state: directory
        owner: root
        mode: "0755"

    - name: Template and copy haproxy systemd override
      ansible.builtin.template:
        src: haproxy-override.conf
        dest: /etc/systemd/system/haproxy.service.d/override.conf
        owner: root
        mode: "0644"
      notify:
        - Reload systemd and restart Haproxy

    - name: Template and copy haproxy config
      ansible.builtin.template:
        src: haproxy.cfg
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        mode: "0644"
        validate: "haproxy -f %s -c"
      notify:
        - Reload Haproxy

    - name: Edge sshd settings
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-edge.conf
        owner: root
        mode: "0644"
        content: |
          Port 2222
          X11Forwarding no
          AllowAgentForwarding no
          AllowTcpForwarding no
        validate: /usr/sbin/sshd -t -f %s
      notify: "Restart sshd"

    - name: Remove superseded sshd port drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/00-port.conf
        state: absent
      notify: "Restart sshd"

    # Port is additive across files, so a leftover line in sshd_config would also bind :22, which haproxy owns
    - name: Remove SSH port from sshd_config
      ansible.builtin.lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "^Port\\s"
        state: absent
      notify: "Restart sshd"

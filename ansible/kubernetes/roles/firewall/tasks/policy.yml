# SPDX-License-Identifier: MIT-0
---
# runs after every allow rule so a deny default never lands before the ssh allow does
- name: Set default incoming policy
  community.general.ufw:
    default: "{{ firewall_default_incoming }}"
    direction: incoming

- name: Set default outgoing policy
  community.general.ufw:
    default: "{{ firewall_default_outgoing }}"
    direction: outgoing

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: low

---
- name: Setup tailscale ip forwarding params
  block:
    - name: Copy sysctl file for IP forwarding
      ansible.builtin.copy:
        src: ip-forward.conf
        dest: /etc/sysctl.d/99-ip-forward.conf
        owner: root
        mode: "0644"
      notify: Reload sysctl
      become: true
      become_user: root
      become_method: sudo

- name: Setup inotify limits
  block:
    - name: Copy sysctl file for inotify limits
      ansible.builtin.copy:
        src: inotify.conf
        dest: /etc/sysctl.d/99-inotify.conf
        owner: root
        mode: "0644"
      notify: Reload inotify sysctl
      become: true
      become_user: root
      become_method: sudo

- name: Setup redirect params
  block:
    - name: Copy sysctl file for redirects
      ansible.builtin.copy:
        src: redirects.conf
        dest: /etc/sysctl.d/99-redirects.conf
        owner: root
        mode: "0644"
      notify: Restart systemd-sysctl
      become: true
      become_user: root
      become_method: sudo

- name: Setup unprivileged ports for the lan proxy
  when: (node_labels | default({}))['inf-k8s.net/lan-proxy'] | default('') == 'true'
  block:
    - name: Copy sysctl file for unprivileged ports
      ansible.builtin.copy:
        src: unprivileged-ports.conf
        dest: /etc/sysctl.d/99-unprivileged-ports.conf
        owner: root
        mode: "0644"
      notify: Restart systemd-sysctl
      become: true
      become_user: root
      become_method: sudo

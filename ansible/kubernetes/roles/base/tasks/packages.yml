---
- name: Install required packages
  become: true
  become_user: root
  block:
    - name: Install Packages
      ansible.builtin.apt:
        update_cache: true
        package:
          - curl
          - nfs-common
          - open-iscsi
          - htop
          - zfsutils-linux

    - name: Enable iscsid
      ansible.builtin.systemd_service:
        name: iscsid
        enabled: true
        state: started

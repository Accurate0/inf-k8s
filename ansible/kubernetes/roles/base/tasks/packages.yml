---
- name: Install required packages
  become: true
  become_user: root
  block:
    - name: Install Packages
      ansible.builtin.apt:
        update_cache: true
        package:
          - curl
          - cryptsetup
          - dmsetup
          - open-iscsi
          - htop
          - zfsutils-linux

    - name: Install nfs-common
      ansible.builtin.apt:
        package: nfs-common
      when: "'proxy' not in group_names"

    - name: Remove rpcbind from the edge
      ansible.builtin.apt:
        package:
          - nfs-common
          - rpcbind
        state: absent
        purge: true
      when: "'proxy' in group_names"

    - name: Enable iscsid
      ansible.builtin.systemd_service:
        name: iscsid
        enabled: true
        state: started

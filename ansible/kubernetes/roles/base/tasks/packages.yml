---
- name: Install required packages
  become: true
  become_user: root
  block:
    - name: Install Packages
      ansible.builtin.apt:
        update_cache: true
        package:
          - curl
          - htop

    - name: Install storage packages
      ansible.builtin.apt:
        package:
          - cryptsetup
          - dmsetup
          - nfs-common
          - open-iscsi
          - zfsutils-linux
      when: "'proxy' not in group_names"

    - name: Enable iscsid
      ansible.builtin.systemd_service:
        name: iscsid
        enabled: true
        state: started
      when: "'proxy' not in group_names"

    - name: Remove unneeded services from the edge
      ansible.builtin.apt:
        package:
          - modemmanager
          - multipath-tools
          - nfs-common
          - open-iscsi
          - rpcbind
          - udisks2
          - zfs-zed
          - zfsutils-linux
        state: absent
        purge: true
        autoremove: true
      when: "'proxy' in group_names"

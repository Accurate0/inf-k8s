---
# sshd keeps the first value it reads, and provider drop-ins (10-binarylane.conf,
# 50-cloud-init.conf) load before sshd_config's body, so this must sort first.
- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

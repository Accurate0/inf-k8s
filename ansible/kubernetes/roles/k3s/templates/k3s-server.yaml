disable:
  - traefik
  - gateway-api-crd
flannel-backend: wireguard-native
node-external-ip: "{{ tailscale_ip_result.stdout }}"
node-ip: "{{ lan_ip }}"
advertise-address: "{{ lan_ip }}"
cluster-init: true
tls-san:
  - "{{ hostvars['k8s-optiplex-5'].tailscale_ip }}"
  - "{{ hostvars['k8s-optiplex-5'].lan_ip }}"
  - "{{ hostvars['k8s-optiplex-5'].public_ipv6 }}"
  - "ortzi.cloud"
etcd-expose-metrics: true
etcd-arg:
  - "heartbeat-interval=1000"
  - "election-timeout=10000"
token: "{{ k3s_cluster_token }}"
kubelet-arg:
  - "image-gc-high-threshold=50"
  - "image-gc-low-threshold=20"
  - "maximum-dead-containers=3"

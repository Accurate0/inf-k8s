- name: Upgrade K3S
  hosts:
    - agent
    - control
  become: true
  gather_facts: false
  serial: 1

  roles:
    - role: k3s
      vars:
        k3s_role: "{{ 'agent' if 'agent' in group_names else 'server' }}"
        k3s_cluster_token: "{{ lookup('ansible.builtin.env', 'K3S_CLUSTER_TOKEN') }}"
        k3s_registry_mirror_password: "{{ lookup('ansible.builtin.env', 'HARBOR_NODE_PULL_PASSWORD') }}"
        k3s_channel: "latest"
        k3s_version: "v1.37.1+k3s1"

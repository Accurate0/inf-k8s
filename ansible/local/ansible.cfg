[defaults]
inventory = inventory.yaml
remote_tmp = $HOME/.ansible/tmp
remote_user = root
# LXC guests are disposable and get new host keys whenever they are recreated,
# which otherwise fails every connection under BatchMode.
host_key_checking = False
interpreter_python = /usr/bin/python3
nocows = 1
roles_path = roles
retry_files_enabled = False
max_diff_size = 250000
stdout_callback = debug

[ssh_connection]
pipelining = True
scp_if_ssh = True
retries = 5

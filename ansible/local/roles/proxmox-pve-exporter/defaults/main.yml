---
proxmox_pve_exporter_bind: "{{ ansible_host }}"
proxmox_pve_exporter_port: 9221

proxmox_pve_exporter_version: 3.10.0
proxmox_pve_exporter_venv: /opt/prometheus-pve-exporter
proxmox_pve_exporter_user: prometheus@pve
proxmox_pve_exporter_token_name: exporter
proxmox_pve_exporter_role: PVEAuditor

proxmox_pve_exporter_service_user: prometheus
proxmox_pve_exporter_config: /etc/prometheus/pve.yml
proxmox_pve_exporter_module: default
proxmox_pve_exporter_verify_ssl: false

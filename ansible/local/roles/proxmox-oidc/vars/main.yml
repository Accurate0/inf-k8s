---
proxmox_oidc_realm_flags:
  - --issuer-url
  - "{{ proxmox_oidc_issuer_url }}"
  - --client-id
  - "{{ proxmox_oidc_client_id }}"
  - --client-key
  - "{{ proxmox_oidc_client_secret }}"
  - --scopes
  - "{{ proxmox_oidc_scopes }}"
  - --groups-claim
  - "{{ proxmox_oidc_groups_claim }}"
  - --groups-autocreate
  - "1"
  - --groups-overwrite
  - "1"
  - --autocreate
  - "1"

proxmox_oidc_realm_create_flags:
  - --username-claim
  - "{{ proxmox_oidc_username_claim }}"

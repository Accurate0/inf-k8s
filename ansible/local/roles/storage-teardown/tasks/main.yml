---
- name: Read the mount table
  ansible.builtin.command: findmnt --json --types fuse.mergerfs
  register: mergerfs_mounts
  changed_when: false
  failed_when: mergerfs_mounts.rc not in [0, 1]

- name: Index the mergerfs mountpoints
  ansible.builtin.set_fact:
    mergerfs_mountpoints: >-
      {{ (mergerfs_mounts.stdout | from_json).filesystems
         | default([]) | map(attribute='target') | list
         if mergerfs_mounts.stdout | length > 0 else [] }}

- name: Look for the pool unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ mergerfs_unit_name }}"
  register: mergerfs_unit_file

- name: Stop the pool unit
  ansible.builtin.systemd_service:
    name: "{{ mergerfs_unit_name }}"
    state: stopped
    enabled: false
  when: mergerfs_unit_file.stat.exists

- name: Remove the pool unit
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ mergerfs_unit_name }}"
    state: absent
  notify: Reload systemd

- name: Unmount the pools
  ansible.posix.mount:
    path: "{{ item }}"
    state: unmounted
  loop: "{{ mergerfs_mountpoints }}"

- name: Drop the fstab entries
  ansible.posix.mount:
    path: "{{ item }}"
    state: absent_from_fstab
  loop: "{{ mergerfs_mountpoints | union([mergerfs_pool_mount]) }}"

- name: Find the retired member drive mounts
  ansible.builtin.command: findmnt --json --list --output TARGET,SOURCE
  register: storage_all_mounts
  changed_when: false

- name: Index the member drive mounts
  ansible.builtin.set_fact:
    storage_member_mounts: >-
      {{ (storage_all_mounts.stdout | from_json).filesystems
         | default([]) | map(attribute='target') | list
         | select('match', storage_member_mount_pattern) | list }}

- name: Release the member drives
  ansible.posix.mount:
    path: "{{ item }}"
    state: absent
  loop: "{{ storage_member_mounts }}"

- name: Find guests still holding a stale pool mount
  ansible.builtin.shell: |
    set -o pipefail
    for id in $(pct list | awk 'NR > 1 && $2 == "running" {print $1}'); do
      if pct exec "$id" -- findmnt -rno FSTYPE 2>/dev/null | grep -q fuse.mergerfs; then
        echo "$id"
      fi
    done
  args:
    executable: /bin/bash
  register: storage_stale_guests
  changed_when: false

- name: Restart them onto the plain bind mount
  ansible.builtin.command: pct reboot {{ item }}
  loop: "{{ storage_stale_guests.stdout_lines }}"
  changed_when: true

- name: Gather the installed packages
  ansible.builtin.package_facts:
    manager: auto

- name: Clear the mergerfs package holds
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: "{{ mergerfs_packages | intersect(ansible_facts.packages.keys() | list) }}"
  when: ansible_os_family == 'Debian'

- name: Remove the mergerfs packages
  ansible.builtin.package:
    name: "{{ mergerfs_packages }}"
    state: absent

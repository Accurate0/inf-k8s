---
- name: Passwordless web console
  become: true
  become_user: root
  when: base_console_autologin
  block:
    - name: Remove the old per-instance getty override
      ansible.builtin.file:
        path: /etc/systemd/system/container-getty@1.service.d/autologin.conf
        state: absent

    - name: Create the getty override directories
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.d"
        state: directory
        mode: "0755"
      loop: "{{ base_console_getty_units }}"

    - name: Template the autologin overrides
      ansible.builtin.template:
        src: autologin.conf.j2
        dest: "/etc/systemd/system/{{ item }}.d/autologin.conf"
        mode: "0644"
      loop: "{{ base_console_getty_units }}"
      register: base_console_overrides

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: base_console_overrides.changed

    - name: List the running getty units
      ansible.builtin.command: systemctl list-units --state=running --no-legend --plain "*getty*.service"
      changed_when: false
      register: base_console_running_getty
      when: base_console_overrides.changed

    - name: Restart the running getty units so autologin takes effect
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop: "{{ base_console_running_getty.stdout_lines | default([]) | map('split') | map('first') | list }}"
      when: base_console_overrides.changed

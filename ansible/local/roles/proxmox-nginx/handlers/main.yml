---
- name: Reload nginx
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Restart pveproxy
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: pveproxy
    state: restarted

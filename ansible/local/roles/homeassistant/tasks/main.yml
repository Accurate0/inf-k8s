---
- name: Home Assistant
  become: true
  become_user: root
  block:
    - name: Create the config directory
      ansible.builtin.file:
        path: "{{ homeassistant_root }}/config"
        state: directory
        mode: "0755"

    - name: Set the listen port
      ansible.builtin.blockinfile:
        path: "{{ homeassistant_root }}/config/configuration.yaml"
        marker: "# {mark} ANSIBLE MANAGED: reverse proxy"
        block: |
          http:
            server_port: {{ homeassistant_port }}
        create: false
      notify: Restart home assistant

    - name: Template the compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ homeassistant_root }}/docker-compose.yml"
        mode: "0644"
      notify: Restart home assistant

    - name: Bring up the stack
      community.docker.docker_compose_v2:
        project_src: "{{ homeassistant_root }}"
        state: present
        pull: missing
        remove_orphans: true

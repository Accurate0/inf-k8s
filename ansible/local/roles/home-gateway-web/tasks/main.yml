---
- name: Home Gateway Web
  become: true
  become_user: root
  block:
    - name: Create compose project directory
      ansible.builtin.file:
        path: "{{ home_gateway_web_root }}"
        state: directory
        mode: "0755"

    - name: Template docker compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ home_gateway_web_root }}/docker-compose.yml"
        mode: "0644"
      notify: Restart home-gateway-web stack

    - name: Bring up the home-gateway-web stack
      community.docker.docker_compose_v2:
        project_src: "{{ home_gateway_web_root }}"
        state: present
        pull: missing
        remove_orphans: true

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Remove the Debian default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Template the reverse proxy site
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/conf.d/home-gateway-web.conf
        mode: "0644"
      notify: Reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and start nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

---
- name: Restart home-gateway-web stack
  become: true
  become_user: root
  community.docker.docker_compose_v2:
    project_src: "{{ home_gateway_web_root }}"
    state: restarted
    remove_orphans: true

- name: Reload nginx
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

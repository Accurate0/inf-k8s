---
- name: Recyclarr
  become: true
  become_user: root
  block:
    - name: Assert the arr API keys are available
      ansible.builtin.assert:
        that:
          - recyclarr_sonarr_api_key | length > 0
          - recyclarr_radarr_api_key | length > 0
        fail_msg: >-
          SONARR_API_KEY and RADARR_API_KEY must be exported. Both are
          generated by the apps themselves - read them from the restored
          configs at /var/lib/{sonarr,radarr}/config.xml.

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ recyclarr_user }}"
        group: "{{ recyclarr_group }}"
        mode: "0755"
      loop:
        - "{{ recyclarr_install_root }}"
        - "{{ recyclarr_config_root }}"

    - name: Download and unpack recyclarr
      ansible.builtin.unarchive:
        src: "{{ recyclarr_url }}"
        dest: "{{ recyclarr_install_root }}"
        remote_src: true
        owner: "{{ recyclarr_user }}"
        group: "{{ recyclarr_group }}"
        mode: "0755"
        creates: "{{ recyclarr_install_root }}/recyclarr"

    - name: Template the recyclarr configuration
      ansible.builtin.template:
        src: recyclarr.yml.j2
        dest: "{{ recyclarr_config_root }}/recyclarr.yml"
        owner: "{{ recyclarr_user }}"
        group: "{{ recyclarr_group }}"
        mode: "0644"

    - name: Write the API keys
      ansible.builtin.template:
        src: recyclarr.env.j2
        dest: "{{ recyclarr_config_root }}/recyclarr.env"
        owner: "{{ recyclarr_user }}"
        group: "{{ recyclarr_group }}"
        mode: "0600"

    - name: Install the systemd service and timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - recyclarr.service
        - recyclarr.timer
      notify: Reload systemd for recyclarr

    - name: Flush handlers so the units exist before enabling
      ansible.builtin.meta: flush_handlers

    - name: Enable the recyclarr timer
      ansible.builtin.systemd_service:
        name: recyclarr.timer
        enabled: true
        state: started

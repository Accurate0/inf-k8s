---
- name: Cleanuparr
  become: true
  become_user: root
  block:
    - name: Install dependencies
      ansible.builtin.apt:
        name: "{{ cleanuparr_packages }}"
        state: present
        update_cache: true

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ cleanuparr_user }}"
        group: "{{ cleanuparr_group }}"
        mode: "0755"
      loop:
        - "{{ cleanuparr_install_root }}"
        - "{{ cleanuparr_release_root }}"
        - "{{ cleanuparr_config_root }}"

    - name: Download and unpack cleanuparr
      ansible.builtin.unarchive:
        src: "{{ cleanuparr_url }}"
        dest: "{{ cleanuparr_release_root }}"
        remote_src: true
        owner: "{{ cleanuparr_user }}"
        group: "{{ cleanuparr_group }}"
        creates: "{{ cleanuparr_bin_root }}/Cleanuparr"

    - name: Install the systemd unit
      ansible.builtin.template:
        src: cleanuparr.service.j2
        dest: /etc/systemd/system/cleanuparr.service
        mode: "0644"
      notify:
        - Reload systemd for cleanuparr
        - Restart cleanuparr

    - name: Flush handlers so the unit exists before starting
      ansible.builtin.meta: flush_handlers

    - name: Find superseded releases
      ansible.builtin.find:
        paths: "{{ cleanuparr_install_root }}"
        file_type: any
        hidden: true
        excludes: ["{{ cleanuparr_version }}"]
      register: cleanuparr_superseded

    - name: Remove superseded releases
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ cleanuparr_superseded.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Enable and start cleanuparr
      ansible.builtin.systemd_service:
        name: cleanuparr
        enabled: true
        state: started

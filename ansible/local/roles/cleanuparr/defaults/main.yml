# SPDX-License-Identifier: MIT-0
---
cleanuparr_user: media
cleanuparr_group: media
# renovate: datasource=github-releases depName=Cleanuparr/Cleanuparr extractVersion=^v(?<version>.+)$
cleanuparr_version: "2.10.9"
cleanuparr_port: 11011
cleanuparr_bind_address: 127.0.0.1
cleanuparr_install_root: /opt/cleanuparr
cleanuparr_config_root: /var/lib/cleanuparr

cleanuparr_archive: "Cleanuparr-{{ cleanuparr_version }}-linux-amd64"
cleanuparr_release_root: "{{ cleanuparr_install_root }}/{{ cleanuparr_version }}"
cleanuparr_bin_root: "{{ cleanuparr_release_root }}/{{ cleanuparr_archive }}"
cleanuparr_url: "https://github.com/Cleanuparr/Cleanuparr/releases/download/v{{ cleanuparr_version }}/{{ cleanuparr_archive }}.zip"

cleanuparr_packages:
  - unzip
  - libicu-dev

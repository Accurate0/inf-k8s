---
- name: Proxmox apt repositories
  become: true
  become_user: root
  block:
    - name: Look for the enterprise repositories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: proxmox_repos_enterprise
      loop: "{{ proxmox_repos_enterprise_sources }}"

    - name: Disable the enterprise repositories
      ansible.builtin.lineinfile:
        path: "{{ item.item }}"
        regexp: "^Enabled:"
        line: "Enabled: false"
      loop: "{{ proxmox_repos_enterprise.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Add the no-subscription repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/proxmox.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ ansible_facts["distribution_release"] }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

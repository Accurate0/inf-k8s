# SPDX-License-Identifier: MIT-0
---
forgejo_runner_root: /opt/forgejo-runner
forgejo_runner_instance: https://git.anurag.sh
forgejo_runner_image: data.forgejo.org/forgejo/runner
# renovate: datasource=docker depName=data.forgejo.org/forgejo/runner
forgejo_runner_image_tag: "13.2.0"
forgejo_runner_job_image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:4288050ddd71ac2e5f42465c474aec8b838792dec85bb284405db7c180138580
forgejo_runner_capacity: 2
forgejo_runner_registry: registry.anurag.sh
forgejo_runner_registry_username: robot$node-pull
forgejo_runner_registry_password: ""
forgejo_runner_cache_port: 8088

forgejo_runner_labels:
  ubuntu-latest: "{{ forgejo_runner_job_image }}"
  default: "{{ forgejo_runner_job_image }}"
  docker: "{{ forgejo_runner_job_image }}"
  multiarch: "{{ forgejo_runner_job_image }}"

forgejo_runner_actions_secret: ""
forgejo_runner_secret: "{{ (forgejo_runner_actions_secret ~ ':' ~ inventory_hostname) | hash('sha1') }}"

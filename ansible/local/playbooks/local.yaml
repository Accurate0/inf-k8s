---

- ansible.builtin.import_playbook: proxmox-guests.yaml

- ansible.builtin.import_playbook: unifi-dns.yaml

- name: Proxmox host
  hosts: proxmox
  gather_facts: true

  vars:
    proxmox_oidc_client_secret: "{{ lookup('ansible.builtin.env', 'PVE_OIDC_CLIENT_SECRET') }}"

  roles:
    - proxmox-nginx
    - proxmox-oidc

- name: Wait for guests to accept SSH
  hosts: media_servers:gateway:home_automation:backup:mirror
  gather_facts: false

  tasks:
    - name: Wait for port 22
      ansible.builtin.wait_for_connection:
        delay: 15
        sleep: 5
        timeout: 300

- name: Base configuration
  hosts: media_servers:gateway:home_automation:backup:mirror
  gather_facts: true

  roles:
    - base

- name: Jellyfin
  hosts: jellyfin
  gather_facts: true

  roles:
    - jellyfin

- name: Media apps
  hosts: media-apps
  gather_facts: true

  roles:
    - arr
    - bazarr
    - flaresolverr
    - recyclarr
    - docker
    - seerr

- name: Transmission
  hosts: transmission
  gather_facts: true

  roles:
    - transmission

- name: Home gateway web
  hosts: gateway
  gather_facts: true

  roles:
    - docker
    - home-gateway-web

- name: Home Assistant
  hosts: home_automation
  gather_facts: true

  roles:
    - docker
    - homeassistant

- name: Arch mirror cache
  hosts: mirror
  gather_facts: true

  roles:
    - pacoloco

- name: Proxmox Backup Server
  hosts: backup
  gather_facts: true

  vars:
    pbs_b2_bucket: "{{ lookup('ansible.builtin.env', 'B2_BUCKET') }}"
    pbs_b2_access_key: "{{ lookup('ansible.builtin.env', 'B2_APPLICATION_KEY_ID') }}"
    pbs_b2_secret_key: "{{ lookup('ansible.builtin.env', 'B2_APPLICATION_KEY') }}"
    pbs_oidc_client_secret: "{{ lookup('ansible.builtin.env', 'PBS_OIDC_CLIENT_SECRET') }}"

  roles:
    - pbs

- name: Proxmox backup jobs
  hosts: proxmox
  gather_facts: false

  vars:
    proxmox_pbs_server: "{{ hostvars['pbs'].ansible_host }}"
    proxmox_pbs_token_secret: "{{ hostvars['pbs'].pbs_pve_token_secret }}"
    proxmox_pbs_fingerprint: "{{ hostvars['pbs'].pbs_fingerprint }}"

  roles:
    - proxmox-pbs

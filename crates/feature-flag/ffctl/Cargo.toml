[package]
name = "ffctl"
version = "0.1.0"
edition = "2024"

[dependencies]
feature-flag-proto = { path = "../feature-flag-proto" }
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
console = "0.16"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
open = "5"
prost-types = "0.14"
ratatui = "0.29"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
similar = "3"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["transport", "tls-aws-lc", "tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }

package:
  name: ff
  version: 0.2.1
  completions: clap
  description: feature-flags admin CLI and TUI, through the graph
  binary: ffctl
  aliases: [ffctl]
auth:
  client_id: graph
  token_env: GRAPH_TOKEN
  scopes: openid email profile groups
  # the TUI runs for a while; it refreshes its own graph session instead of one injected token
  lazy: true

[package]
name = "k8sctl"
version = "0.1.0"
edition = "2024"
description = "One CLI for every inf-k8s platform service"

[dependencies]
aig = { path = "../../platform-services/ai-gateway/cli" }
ffctl = { path = "../feature-flag/ffctl" }
janitor-cli = { path = "../../platform-services/janitor-bot/cli" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }

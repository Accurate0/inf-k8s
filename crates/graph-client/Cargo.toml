[package]
name = "graph-client"
version = "0.1.0"
edition = "2024"
description = "Typed cynic operations against graph.ortzi.cloud for the platform CLIs"

[dependencies]
anyhow = "1"
cli-auth = { path = "../cli-auth" }
cynic = "3.14.0"
futures = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

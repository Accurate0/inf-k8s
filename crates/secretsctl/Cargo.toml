[package]
name = "secretsctl"
version = "0.1.0"
edition = "2024"
description = "OpenBao secrets CLI"

[dependencies]
cli-auth = { path = "../cli-auth" }
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

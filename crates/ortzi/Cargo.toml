[package]
name = "ortzi"
version = "0.1.0"
edition = "2024"
description = "Pluggable CLI for the ortzi platform"

[dependencies]
cli-auth = { path = "../cli-auth" }
registry-api = { path = "../../platform-services/registry/api" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
comfy-table = "7"
dirs = "6"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.13", features = ["json", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
wasmtime = "50.0.0"
wasmtime-wasi = "50.0.0"

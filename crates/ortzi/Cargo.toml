[package]
name = "ortzi"
version = "0.1.0"
edition = "2024"
description = "Pluggable CLI for the ortzi platform"

[dependencies]
cli-auth = { path = "../cli-auth" }
registry-api = { path = "../../platform-services/registry/api" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
comfy-table = "7"
dirs = "6"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.13", features = ["json", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
wasmtime = "50.0.0"
wasmtime-wasi = "50.0.0"
kube = { version = "4.0.0", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
http = "1"
httparse = "1"
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-platform-verifier = "0.7"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }

name: Publish {name}
on:
  push:
    branches:
      - main
    paths:
      - {paths}
      - .forgejo/workflows/{workflow}
  workflow_dispatch:

enable-openid-connect: true

jobs:
  publish:
    runs-on: ortzi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ortzi publish {dir}

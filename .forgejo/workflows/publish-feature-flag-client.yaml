name: Publish feature-flag-client
on:
  push:
    branches:
      - main
    paths:
      - packages/feature-flag-client/**
      - .forgejo/workflows/publish-feature-flag-client.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  publish:
    runs-on: docker
    env:
      REGISTRY: https://git.anurag.sh/api/packages/anurag/npm/
      AUDIENCE: u:1:e3377b26-1928-45e0-9786-72bf809a01f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}/packages
      - run: pnpm --filter @accurate0/feature-flag-client build
        working-directory: ${{ github.workspace }}/packages

      - name: Publish if version is new
        working-directory: ${{ github.workspace }}/packages/feature-flag-client
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          printf '@accurate0:registry=%s\n//%s:_authToken=%s\n' "$REGISTRY" "${REGISTRY#https://}" "$token" > "$HOME/.npmrc"

          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish
          fi

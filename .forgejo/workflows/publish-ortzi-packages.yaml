name: Publish ortzi packages
on:
  push:
    branches:
      - main
    paths:
      - packages/ortzi-schemas/**
      - packages/ortzi-secrets/**
      - packages/ortzi-obs/**
      - packages/ortzi-graph/**
      - packages/ortzi-s3/**
      - packages/ortzi-cluster/**
      - packages/ortzi-host/**
      - packages/ortzi-kit/**
      - packages/pnpm-lock.yaml
      - .forgejo/workflows/publish-ortzi-packages.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  publish:
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        package: [ortzi-schemas, ortzi-secrets, ortzi-obs, ortzi-s3, ortzi-graph, ortzi-cluster]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: packages/package.json
      - uses: https://git.anurag.sh/anurag/workflows/setup-ortzi@main
      - run: ortzi publish packages/${{ matrix.package }}

name: Publish cnpg
on:
  push:
    branches:
      - main
    paths:
      - packages/upstream/cnpg/**
      - .forgejo/workflows/publish-cli-cnpg.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  publish:
    runs-on: ortzi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ortzi publish packages/upstream/cnpg

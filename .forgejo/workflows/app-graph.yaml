name: app graph
on:
  push:
    paths:
      - platform-services/graph/**
      - "!platform-services/graph/manifests/**"
      - "!platform-services/graph/application.yaml"
      - "!platform-services/graph/app.yaml"
      - "!platform-services/graph/image.values.yaml"
      - .forgejo/workflows/app-graph.yaml
  workflow_dispatch: null
enable-openid-connect: true
jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compute commit metadata
        id: commit-meta
        run: echo "committed-at=$(git show -s --format=%ct ${{ github.sha }})" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Install ortzi
        if: github.ref == 'refs/heads/main'
        run: |-
          curl -fsSL https://registry.anurag.sh/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Log in to harbor
        id: login
        if: github.ref == 'refs/heads/main'
        run: ortzi registry login containers:push
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: platform-services/graph
          file: platform-services/graph/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: registry.anurag.sh/containers/graph-router:latest,registry.anurag.sh/containers/graph-router:${{ github.sha }}
          labels: |-
            net.inf-k8s.commit-sha=${{ github.sha }}
            net.inf-k8s.committed-at=${{ steps.commit-meta.outputs.committed-at }}
          build-args: BINARY_NAME=graph-router
          cache-from: type=registry,ref=registry.anurag.sh/containers/graph-router:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=registry,ref=registry.anurag.sh/containers/graph-router:buildcache,mode=max' || '' }}
      - name: Sign image
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: ortzi registry sign "registry.anurag.sh/containers/graph-router@$DIGEST"
      - name: Log out of harbor
        if: ${{ always() && steps.login.outcome == 'success' }}
        run: ortzi registry logout
  test:
    runs-on: docker
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: apt-get update && apt-get install -y build-essential pkg-config
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1 && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: platform-services/graph/target
          key: ${{ runner.os }}-app-target-${{ hashFiles('**/Cargo.lock') }}-graph
      - run: cargo test
        working-directory: ${{ github.workspace }}/platform-services/graph
  deploy:
    needs:
      - build
      - test
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.build.result == 'success' && needs.test.result == 'success' }}
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Raise image update PR
        env:
          FORGEJO_TOKEN: ${{ secrets.CI_IMAGE_UPDATER_TOKEN }}
          SERVICE_NAME: graph
          IMAGE: registry.anurag.sh/containers/graph-router
          TAG: ${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          MANIFESTS_PATH: platform-services/graph
          VALUES_FILE: platform-services/graph/image.values.yaml
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          COMMITTED_AT=$(git show -s --format=%ct "$COMMIT_SHA")
          git config --global user.name ci-image-updater
          git config --global user.email ci-image-updater@git.anurag.sh
          git clone "https://x-access-token:$FORGEJO_TOKEN@git.anurag.sh/anurag/k8s.git" config-repo
          cd config-repo
          PR_BRANCH="ci/update-$SERVICE_NAME-app-$SERVICE_NAME-$TAG"
          TITLE="chore(deploy): update $SERVICE_NAME images to $TAG [skip ci]"
          git checkout -b "$PR_BRANCH"
          IMAGE="$IMAGE" yq -I2 -P -i '.images[strenv(IMAGE)] = strenv(TAG)' "$VALUES_FILE"
          git add "$MANIFESTS_PATH"
          git commit -m "$TITLE" || { echo "No changes to commit"; exit 0; }
          git push -f origin "$PR_BRANCH"
          METADATA=$(jq -cn --arg service "$SERVICE_NAME" --arg tag "$TAG" --arg images "$IMAGE" \
            --arg path "$MANIFESTS_PATH" --arg repo "$REPOSITORY" --arg ref "$REF_NAME" --arg run "$RUN_NUMBER" \
            --arg sha "$COMMIT_SHA" --arg committed_at "$COMMITTED_AT" \
            '{service: $service, tag: $tag, images: $images, path: $path, branch: "main", repo: $repo, ref: $ref, run: $run, sha: $sha, committed_at: $committed_at}')
          BODY=$(printf '## Image Update\n\n| Field | Value |\n|-------|-------|\n| **Service** | \x60%s\x60 |\n| **Tag** | \x60%s\x60 |\n| **Manifests Path** | \x60%s\x60 |\n| **Target Branch** | \x60main\x60 |\n\n**Triggered by:** [%s@%s](%s)\n\n<!-- metadata:%s -->\n' \
            "$SERVICE_NAME" "$TAG" "$MANIFESTS_PATH" "$REPOSITORY" "$REF_NAME" "$RUN_URL" "$METADATA")
          PAYLOAD=$(jq -n --arg title "$TITLE" --arg head "$PR_BRANCH" --arg body "$BODY" \
            '{title: $title, head: $head, base: "main", body: $body}')
          CODE=$(curl -s -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" -H 'Content-Type: application/json' \
            -d "$PAYLOAD" https://git.anurag.sh/api/v1/repos/anurag/k8s/pulls)
          case "$CODE" in
            2*) jq -r .html_url response.json ;;
            409) echo "PR already exists for $PR_BRANCH" ;;
            *) echo "failed to create PR (HTTP $CODE)"; cat response.json; exit 1 ;;
          esac

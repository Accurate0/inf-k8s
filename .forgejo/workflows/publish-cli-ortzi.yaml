name: Publish ortzi
on:
  push:
    branches:
      - main
    paths:
      - crates/ortzi/**
      - crates/cli-auth/**
      - platform-services/registry/api/**
      - packages/ortzi-host/wit/**
      - .forgejo/workflows/publish-cli-ortzi.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  publish:
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://git.anurag.sh/anurag/workflows/setup-zigbuild@main
      - uses: https://git.anurag.sh/anurag/workflows/setup-ortzi@main
      - run: ortzi publish crates/ortzi

name: Build & publish ortzi CI image
on:
  push:
    branches:
      - main
    paths:
      - crates/ortzi/**
      - crates/cli-auth/**
      - platform-services/registry/api/**
      - packages/ortzi-host/wit/**
      - .forgejo/workflows/build-publish-ortzi-ci.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build:
    runs-on: docker
    env:
      IMAGE: registry.anurag.sh/containers/ortzi-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install ortzi
        run: |
          curl -fsSL https://registry.anurag.sh/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to harbor
        id: login
        run: ortzi registry login containers:push

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./crates/ortzi/ci/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: ortzi registry sign "$IMAGE@$DIGEST"

      - name: Log out of harbor
        if: ${{ always() && steps.login.outcome == 'success' }}
        run: ortzi registry logout

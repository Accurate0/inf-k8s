    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: https://git.anurag.sh/anurag/workflows/setup-ortzi@main
        with:
          packages: app
      - name: Log in to harbor
        id: login
        run: ortzi registry login containers:push
      - name: Tag release
        env:

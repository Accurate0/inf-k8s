          docker buildx imagetools create --tag "registry.anurag.sh/containers/waf-manager:$TAG" "registry.anurag.sh/containers/waf-manager@$DIGEST"
      - name: Log out of harbor
        if: ${{ always() && steps.login.outcome == 'success' }}

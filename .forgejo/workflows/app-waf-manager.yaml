      - name: Log in to harbor
        id: login
        if: github.ref == 'refs/heads/main'
        run: ortzi registry login containers:push
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: platform-services/waf-manager/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: registry.anurag.sh/containers/waf-manager:latest,registry.anurag.sh/containers/waf-manager:${{ github.sha }}
          labels: |-
            net.inf-k8s.commit-sha=${{ github.sha }}
            net.inf-k8s.committed-at=${{ steps.commit-meta.outputs.committed-at }}
          build-args: BINARY_NAME=waf-manager
          cache-from: type=registry,ref=registry.anurag.sh/containers/waf-manager:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=registry,ref=registry.anurag.sh/containers/waf-manager:buildcache,mode=max' || '' }}
      - name: Sign image
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: ortzi registry sign "registry.anurag.sh/containers/waf-manager@$DIGEST"
      - name: Log out of harbor
        if: ${{ always() && steps.login.outcome == 'success' }}
        run: ortzi registry logout
  test:
    runs-on: docker
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: apt-get update && apt-get install -y build-essential pkg-config
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1 && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9

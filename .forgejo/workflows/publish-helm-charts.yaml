name: Publish helm charts
on:
  push:
    branches:
      - main
    paths:
      - charts/**
      - .forgejo/workflows/publish-helm-charts.yaml
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Login to registry.anurag.sh
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" |
            helm registry login registry.anurag.sh --username "$REGISTRY_USERNAME" --password-stdin

      - name: Package helm charts
        run: |
          helm package charts/k8s-secrets
          helm package charts/k8s-http-routes
          helm package charts/k8s-oidc
          helm package charts/k8s-postgres
          helm package charts/k8s-workload
          helm package charts/k8s-network
          helm package charts/k8s-observability
          helm package charts/k8s-storage

      - name: Push charts to registry.anurag.sh
        run: |
          shopt -s nullglob
          chart_registry="registry.anurag.sh/charts"
          for pkg in *.tgz; do
            chart_name=$(helm show chart "${pkg}" | sed -n 's/^name: //p')
            chart_version=$(helm show chart "${pkg}" | sed -n 's/^version: //p')
            if helm show chart "oci://${chart_registry}/${chart_name}" --version "${chart_version}" > /dev/null 2>&1; then
              echo "Chart oci://${chart_registry}/${chart_name}:${chart_version} already exists in repository - skipping..."
              continue
            fi

            helm push "${pkg}" "oci://${chart_registry}"
          done

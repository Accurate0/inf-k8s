name: Publish cluster
# flux syncs kubernetes/ from this artifact; the harbor receiver reconciles on push
on:
  push:
    branches:
      - main
    paths:
      - kubernetes/**
      - .forgejo/workflows/publish-cluster.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  publish:
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: https://git.anurag.sh/anurag/workflows/setup-ortzi@main
        with:
          packages: kustomize
      - run: ortzi kustomize build kubernetes > /dev/null
      - run: >-
          .forgejo/scripts/retry.sh 3 30
          ortzi registry push kubernetes oci://registry.anurag.sh/manifests/cluster
          --tag main --revision "${{ github.sha }}" --sign

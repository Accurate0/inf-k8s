name: Publish upstream CLIs
on:
  push:
    branches:
      - main
    paths:
      - packages/upstream/**
      - .forgejo/workflows/publish-cli-upstream.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  publish:
    runs-on: ortzi
    strategy:
      fail-fast: false
      matrix:
        package: [argocd, bao, cnpg, egctl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://git.anurag.sh/anurag/workflows/setup-ortzi@main
      - run: ortzi publish packages/upstream/${{ matrix.package }}

name: Publish and render apps
on:
  push:
    branches:
      - main
    paths:
      - "**/app.yaml"
      - "**/application.yaml"
      - "**/*.application.yaml"
      - "**/manifests/**"
      - "**/kustomization.yaml"
      - charts/**
      - platform/versions.yaml
      - platform/exports/**
      - packages/app/**
      - packages/ortzi-host/**
      - packages/ortzi-kit/**
      - packages/pnpm-lock.yaml
      - .forgejo/workflows/render-apps.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  changes:
    runs-on: ortzi
    outputs:
      package: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: package
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=true
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && git diff --quiet "$BEFORE" HEAD -- packages/app packages/ortzi-host packages/ortzi-kit packages/pnpm-lock.yaml; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    runs-on: ortzi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.package == 'true'
      - run: pnpm --dir packages install --frozen-lockfile
        if: needs.changes.outputs.package == 'true'
      - run: pnpm --dir packages/app test && pnpm --dir packages/app check
        if: needs.changes.outputs.package == 'true'

  publish:
    needs: [changes, test]
    runs-on: ortzi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.package == 'true'
      - run: |
          for attempt in 1 2 3; do
            ortzi publish packages/app && exit 0
            [ "$attempt" = 3 ] || sleep 30
          done
          exit 1
        if: needs.changes.outputs.package == 'true'

  render:
    needs: publish
    runs-on: ortzi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          for attempt in 1 2 3; do
            ortzi install app --force && exit 0
            [ "$attempt" = 3 ] || sleep 30
          done
          exit 1
      - name: Render and commit
        run: |
          git config user.name "reconciler[bot]"
          git config user.email "reconciler@noreply.git.anurag.sh"
          start="$(git rev-parse HEAD)"
          for attempt in 1 2 3; do
            ortzi app render --commit && exit 0
            git reset --quiet --hard "$start"
            git clean -fdq
            [ "$attempt" = 3 ] || sleep 30
          done
          exit 1
      - name: Push changes
        env:
          RECONCILER_TOKEN: ${{ secrets.RECONCILER_TOKEN }}
        run: |
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] && exit 0
          git remote set-url origin "$(git remote get-url origin | sed "s#://#://reconciler:${RECONCILER_TOKEN}@#")"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              git push origin HEAD:main && exit 0
            else
              git rebase --abort || true
            fi
            [ "$attempt" = 5 ] || sleep 15
          done
          exit 1

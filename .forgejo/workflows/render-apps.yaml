name: Publish and render apps
on:
  push:
    branches:
      - main
    paths:
      - "**/app.yaml"
      - "**/application.yaml"
      - "**/*.application.yaml"
      - "**/manifests/**"
      - "**/kustomization.yaml"
      - "**/image.values.yaml"
      - selfhosted/*/*.values.yaml
      - system-components/*/*.values.yaml
      - charts/**
      - platform/versions.yaml
      - platform/exports/**
      - packages/ortzi-app/**
      - packages/ortzi-host/**
      - packages/ortzi-kit/**
      - packages/pnpm-lock.yaml
      - .forgejo/workflows/render-apps.yaml
      - .forgejo/scripts/retry.sh
  workflow_dispatch:

enable-openid-connect: true

jobs:
  changes:
    runs-on: ortzi
    outputs:
      package: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: package
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=true
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && git diff --quiet "$BEFORE" HEAD -- packages/ortzi-app packages/ortzi-host packages/ortzi-kit packages/pnpm-lock.yaml; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    runs-on: ortzi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.package == 'true'
      - run: pnpm --dir packages install --frozen-lockfile
        if: needs.changes.outputs.package == 'true'
      - run: pnpm --dir packages/ortzi-app test && pnpm --dir packages/ortzi-app check
        if: needs.changes.outputs.package == 'true'

  publish:
    needs: [changes, test]
    runs-on: ortzi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.package == 'true'
      - uses: https://git.anurag.sh/anurag/workflows/setup-ortzi@main
        if: needs.changes.outputs.package == 'true'
      - run: .forgejo/scripts/retry.sh 3 30 ortzi publish packages/ortzi-app
        if: needs.changes.outputs.package == 'true'

  render:
    needs: publish
    runs-on: ortzi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: https://git.anurag.sh/anurag/workflows/setup-ortzi@main
        with:
          packages: app
      - name: Render and commit
        run: |
          git config user.name "reconciler[bot]"
          git config user.email "reconciler@noreply.git.anurag.sh"
          export START="$(git rev-parse HEAD)"
          .forgejo/scripts/retry.sh 3 30 bash -c 'ortzi app render --commit || { git reset --quiet --hard "$START"; git clean -fdq; exit 1; }'
      - name: Push changes
        env:
          RECONCILER_TOKEN: ${{ secrets.RECONCILER_TOKEN }}
        run: |
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] && exit 0
          git remote set-url origin "$(git remote get-url origin | sed "s#://#://reconciler:${RECONCILER_TOKEN}@#")"
          .forgejo/scripts/retry.sh 5 15 bash -c 'if git pull --rebase origin main; then git push origin HEAD:main; else git rebase --abort; exit 1; fi'
      - name: Log in to harbor
        id: login
        run: |
          ortzi registry login charts:pull
          echo "HELM_REGISTRY_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}/config.json" >> "$GITHUB_ENV"
      - name: Publish artifacts
        run: .forgejo/scripts/retry.sh 3 30 ortzi app publish
      - name: Log out of harbor
        if: ${{ always() && steps.login.outcome == 'success' }}
        run: ortzi registry logout

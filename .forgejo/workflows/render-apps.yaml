name: Publish and render apps
on:
  push:
    branches:
      - main
    paths:
      - "**/app.yaml"
      - "**/application.yaml"
      - "**/*.application.yaml"
      - "**/manifests/**"
      - "**/kustomization.yaml"
      - charts/**
      - platform/versions.yaml
      - platform/exports/**
      - packages/app/**
      - packages/ortzi-host/**
      - packages/ortzi-kit/**
      - packages/pnpm-lock.yaml
      - .forgejo/workflows/render-apps.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  changes:
    runs-on: ortzi
    outputs:
      package: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: package
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=true
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && git diff --quiet "$BEFORE" HEAD -- packages/app packages/ortzi-host packages/ortzi-kit packages/pnpm-lock.yaml; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    runs-on: ortzi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.package == 'true'
      - run: pnpm --dir packages install --frozen-lockfile
        if: needs.changes.outputs.package == 'true'
      - run: pnpm --dir packages/app test && pnpm --dir packages/app check
        if: needs.changes.outputs.package == 'true'

  publish:
    needs: [changes, test]
    runs-on: ortzi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.package == 'true'
      - run: ortzi publish packages/app
        if: needs.changes.outputs.package == 'true'

  render:
    needs: publish
    runs-on: ortzi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ortzi install app --force
      - run: ortzi app render
      - name: Commit changes
        env:
          RECONCILER_TOKEN: ${{ secrets.RECONCILER_TOKEN }}
        run: |
          git add -A projects platform-services .github/workflows system-components/postgres-cluster terraform
          git diff --cached --quiet && exit 0
          skip_ci=" [skip ci]"
          git diff --cached --quiet -- .github/workflows terraform system-components/postgres-cluster || skip_ci=""
          git config user.name "reconciler[bot]"
          git config user.email "reconciler@noreply.git.anurag.sh"
          git commit -m "chore(render): update generated applications${skip_ci}"
          git remote set-url origin "$(git remote get-url origin | sed "s#://#://reconciler:${RECONCILER_TOKEN}@#")"
          git pull --rebase origin main
          git push origin HEAD:main

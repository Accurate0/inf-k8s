name: Publish waf
on:
  push:
    branches:
      - main
    paths:
      - platform-services/waf-manager/cli/**
      - platform-services/waf-manager/api/**
      - crates/cli-auth/**
      - platform-services/waf-manager/Cargo.lock
      - .forgejo/workflows/publish-cli-waf.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  publish:
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://git.anurag.sh/anurag/workflows/setup-zigbuild@main
      - uses: https://git.anurag.sh/anurag/workflows/setup-ortzi@main
      - run: ortzi publish platform-services/waf-manager/cli

name: Publish ortzi packages
on:
  push:
    branches:
      - main
    paths:
      - packages/ortzi-schemas/**
      - packages/ortzi-secrets/**
      - packages/ortzi-obs/**
      - packages/ortzi-graph/**
      - packages/ortzi-s3/**
      - packages/ortzi-host/**
      - packages/ortzi-kit/**
      - packages/pnpm-lock.yaml
      - .forgejo/workflows/publish-cli-deploy.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  publish:
    runs-on: ortzi
    strategy:
      fail-fast: false
      matrix:
        package: [ortzi-schemas, ortzi-secrets, ortzi-obs, ortzi-s3, ortzi-graph]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ortzi publish packages/${{ matrix.package }}

package:
  name: app
  description: define apps in app.yaml, render them to flux, roll back what's deployed
  version: 0.79.0
  completions: cobra
auth:
  client_id: graph
  token_env: GRAPH_TOKEN
  lazy: true
  ci_account: ci_deployer
permissions:
  exec: [diff, docker, git, helm, kustomize, kubeconform]
  fs: [.]
  kube: [get, patch]
  http: [raw.githubusercontent.com, git.anurag.sh, k8s-schemas.anurag.sh, graph.ortzi.cloud]
  registry: [manifests, containers]
build:
  kind: wasm
  wasm:
    entry: src/main.ts

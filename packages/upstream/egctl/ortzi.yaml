package:
  name: egctl
  description: Envoy Gateway CLI (upstream envoyproxy/gateway)
  # renovate: datasource=github-releases depName=envoyproxy/gateway extractVersion=^v(?<version>.+)$
  version: 1.9.3
  completions: cobra
build:
  kind: prebuilt
  prebuilt:
    darwin-arm64:
      url: https://github.com/envoyproxy/gateway/releases/download/v${version}/egctl_v${version}_darwin_arm64.tar.gz
      sha256: 276a8b0cb060f0e915d83ca4b399373675c8d296cb82eef283ec5510caf75626
      extract: bin/darwin/arm64/egctl
    linux-amd64:
      url: https://github.com/envoyproxy/gateway/releases/download/v${version}/egctl_v${version}_linux_amd64.tar.gz
      sha256: 82b6164a6cd966fcb6e244a5931c6c3e46193816714a0b69043db1606098150f
      extract: bin/linux/amd64/egctl

package:
  name: helm
  description: Helm CLI (upstream helm/helm)
  # renovate: datasource=github-releases depName=helm/helm extractVersion=^v(?<version>.+)$
  version: 4.3.1
  completions: cobra
build:
  kind: prebuilt
  prebuilt:
    darwin-arm64:
      url: https://get.helm.sh/helm-v${version}-darwin-arm64.tar.gz
      sha256: 6b4e61c8cd27d99e5a801e63ff25dd5c70b36875c2cd659d3e9ce6b76fc23198
      extract: darwin-arm64/helm
    linux-amd64:
      url: https://get.helm.sh/helm-v${version}-linux-amd64.tar.gz
      sha256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
      extract: linux-amd64/helm

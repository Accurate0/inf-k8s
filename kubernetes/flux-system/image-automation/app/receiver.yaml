# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/notification.toolkit.fluxcd.io/receiver_v1.json
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: harbor-containers
spec:
  type: harbor
  secretRef:
    name: harbor-receiver
  # every container push rescans the image repositories
  resources:
    - apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImageRepository
      name: "*"
      matchLabels:
        kustomize.toolkit.fluxcd.io/namespace: flux-system

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/image.toolkit.fluxcd.io/imageupdateautomation_v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: k8s
spec:
  interval: 1h
  # lets every image of one build (maccas, ozbargain) land in a single commit
  policyChangeDelay: 1m
  sourceRef:
    kind: GitRepository
    name: k8s
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: reconciler[bot]
        email: reconciler@noreply.git.anurag.sh
      # deploy <app>, or deploy N apps; the body tables each image's short sha change
      messageTemplate: |
        {{- $apps := len .Changed.FileChanges -}}
        deploy {{ if eq $apps 1 }}{{ range $file, $_ := .Changed.FileChanges }}{{ $file | dir | base }}{{ end }}{{ else }}{{ $apps }} apps{{ end }}

        | {{ printf "%-16s" "app" }} | {{ printf "%-24s" "image" }} | {{ printf "%-8s" "from" }} | {{ printf "%-8s" "to" }} |
        |{{ repeat 18 "-" }}|{{ repeat 26 "-" }}|{{ repeat 10 "-" }}|{{ repeat 10 "-" }}|
        {{ range $file, $objects := .Changed.FileChanges -}}
        {{- $app := $file | dir | base -}}
        {{- range $_, $changes := $objects -}}
        {{- range $change := $changes -}}
        {{- $image := index (splitList ":" $change.Setter) 1 | trimPrefix (printf "%s-" $app) -}}
        {{- $from := splitList "@" $change.OldValue | first | splitList "-" | last | trunc 8 -}}
        {{- $to := splitList "-" $change.NewValue | last | trunc 8 -}}
        | {{ printf "%-16s" $app }} | {{ printf "%-24s" $image }} | {{ printf "%-8s" $from }} | {{ printf "%-8s" $to }} |
        {{ end -}}
        {{- end -}}
        {{- end -}}
    push:
      branch: main
  # setters live in each app's image.values.yaml; deploy-cluster renders and publishes the commit
  update:
    path: ./
    strategy: Setters

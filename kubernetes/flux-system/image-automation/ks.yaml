# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: image-automation
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1h
  # the image controllers and their CRDs come from flux-instance
  dependsOn:
    - name: flux-operator
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  path: "./flux-system/image-automation/app"
  prune: true
  wait: true
  timeout: 5m

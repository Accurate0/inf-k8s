# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator-k8s-secrets
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: flux-operator
spec:
  interval: 1h
  url: oci://registry.anurag.sh/charts/k8s-secrets
  ref:
    tag: 0.7.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  secretRef:
    name: harbor
---

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/notification.toolkit.fluxcd.io/receiver_v1.json
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: harbor
spec:
  type: harbor
  secretRef:
    name: harbor-receiver
  # every manifests push: the cluster artifact and each app's own manifests artifact
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      name: "*"

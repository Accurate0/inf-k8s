# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns-patch-config
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: coredns-patch
spec:
  interval: 1h
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  path: "./kube-system/coredns-patch/config"
  prune: true
  wait: true
  timeout: 10m

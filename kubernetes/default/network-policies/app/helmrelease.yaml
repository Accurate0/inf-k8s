# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: network-policies
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: network-policies
spec:
  interval: 1h
  releaseName: network-policies
  targetNamespace: default
  storageNamespace: default
  chartRef:
    kind: OCIRepository
    name: network-policies
    namespace: flux-system
  maxHistory: 3
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
  rollback:
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    namespaces:
      garage:
        ingress:
          - envoy-gateway-system
          - monitoring
          - bom
          - graph
          - registry
          - spotify
      dragonfly:
        ingress:
          - dragonfly-system
          - monitoring
          - forgejo
          - dawarich
          - maccas-api
          - feature-flags
          - ai-gateway
          - immich
          - registry

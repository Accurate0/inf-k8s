# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-gateway-helm
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: envoy-gateway
spec:
  interval: 1h
  releaseName: envoy-gateway
  targetNamespace: envoy-gateway-system
  storageNamespace: envoy-gateway-system
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-gateway-helm
    namespace: flux-system
  maxHistory: 3
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
  rollback:
    cleanupOnFail: true
  driftDetection:
    mode: warn
  values:
    config:
      envoyGateway:
        extensionApis:
          enableLua: true
    deployment:
      replicas: 1
      envoyGateway:
        resources:
          limits:
            cpu: 700m
            memory: 256Mi

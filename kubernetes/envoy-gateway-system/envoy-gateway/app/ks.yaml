# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: envoy-gateway
spec:
  interval: 1h
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  path: "./envoy-gateway-system/envoy-gateway/config"
  prune: true
  wait: true
  timeout: 10m

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-forgejo
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: forgejo
spec:
  interval: 1h
  releaseName: forgejo
  targetNamespace: forgejo
  storageNamespace: forgejo
  chartRef:
    kind: OCIRepository
    name: forgejo-forgejo
    namespace: flux-system
  maxHistory: 3
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
  rollback:
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    extraVolumes:
      - name: forgejo-themes
        configMap:
          name: forgejo-themes
      - name: forgejo-ssh-host
        secret:
          secretName: forgejo-ssh-host-managed-secrets
      - name: forgejo-ssh-signing
        secret:
          secretName: forgejo-ssh-signing-managed-secrets
          defaultMode: 292
      - name: anubis-policy
        configMap:
          name: forgejo-anubis-policy
    extraContainers:
      - name: anubis
        image: ghcr.io/techarohq/anubis:v1.25.0@sha256:5cf4c0d6c7ea01a356c6685a779971bdd28d6a5a4a6719201f73a9c4ae108db0
        imagePullPolicy: IfNotPresent
        ports:
          - name: anubis-http
            containerPort: 8923
          - name: anubis-metrics
            containerPort: 9090
        env:
          - name: BIND
            value: :8923
          - name: METRICS_BIND
            value: :9090
          - name: TARGET
            value: http://localhost:3000
          - name: DIFFICULTY
            value: "4"
          - name: SERVE_ROBOTS_TXT
            value: "true"
          - name: OG_PASSTHROUGH
            value: "true"
          - name: OG_EXPIRY_TIME
            value: 24h
          - name: POLICY_FNAME
            value: /data/cfg/botPolicies.yaml
          - name: ED25519_PRIVATE_KEY_HEX
            valueFrom:
              secretKeyRef:
                name: forgejo-anubis-managed-secrets
                key: ED25519_PRIVATE_KEY_HEX
        volumeMounts:
          - name: anubis-policy
            mountPath: /data/cfg/botPolicies.yaml
            subPath: botPolicies.yaml
            readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
    extraContainerVolumeMounts:
      - name: forgejo-themes
        readOnly: true
        mountPath: /data/gitea/public/assets/css
      - name: forgejo-ssh-host
        mountPath: /data/gitea/ssh/ssh_host_ed25519_key
        subPath: ssh_host_ed25519_key
      - name: forgejo-ssh-signing
        mountPath: /data/signing
        readOnly: true
    extraInitVolumeMounts:
      - name: forgejo-ssh-signing
        mountPath: /data/signing
        readOnly: true
    image:
      rootless: true
      tag: 17.0.2
      digest: sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04
    replicaCount: 1
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - k8s-pve-1
    topologySpreadConstraints:
      - topologyKey: inf-k8s.net/location
        whenUnsatisfiable: ScheduleAnyway
        maxSkew: 1
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: forgejo
    httpRoute:
      enabled: false
    tcpRoute:
      enabled: false
    persistence:
      enabled: true
      size: 100Gi
      storageClass: longhorn-replicated
      accessModes:
        - ReadWriteOnce
      labels:
        recurring-job.longhorn.io/source: enabled
        recurring-job-group.longhorn.io/daily-backup: enabled
    signing:
      enabled: false
    gitea:
      readinessProbe:
        enabled: true
        httpGet:
          path: /api/healthz
          port: http
        initialDelaySeconds: 5
        timeoutSeconds: 1
        periodSeconds: 120
        successThreshold: 1
        failureThreshold: 3
      livenessProbe:
        enabled: true
        tcpSocket:
          port: http
        initialDelaySeconds: 200
        timeoutSeconds: 1
        periodSeconds: 120
        successThreshold: 1
        failureThreshold: 10
      admin:
        username: ""
        existingSecret: ""
      config:
        APP_NAME: git
        APP_SLOGAN: ""
        ui:
          THEMES: forgejo-auto,forgejo-light,forgejo-dark,anthracite,anthracite-dark,anthracite-light
          DEFAULT_THEME: anthracite
        admin:
          EXTERNAL_USER_DISABLE_FEATURES: manage_password, deletion
        indexer:
          REPO_INDEXER_ENABLED: true
        storage:

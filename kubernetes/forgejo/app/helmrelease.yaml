apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-k8s-secrets
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: forgejo
spec:
  interval: 1h
  releaseName: forgejo-k8s-secrets
  targetNamespace: forgejo
  storageNamespace: forgejo
  chartRef:
    kind: OCIRepository
    name: forgejo-k8s-secrets
    namespace: flux-system
  maxHistory: 3
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
  rollback:
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    defaults:
      namespace: forgejo
      provider: openbao
      resyncInterval: 900
      annotations:
        inf-k8s.net/app: forgejo
        inf-k8s.net/repository: https://github.com/Accurate0/inf-k8s
    secrets:
      - name: ssh-signing
        managedSecrets:
          - secretName: forgejo-ssh-signing-managed-secrets
            template:
              includeAllSecrets: false
              data:
                ed25519: "{{ .SSH_SIGNING_KEY }}"
                ed25519.pub: "{{ .SSH_SIGNING_KEY_PUBLIC }}"
      - name: ssh-host
        managedSecrets:
          - secretName: forgejo-ssh-host-managed-secrets
            template:
              includeAllSecrets: false
              data:
                ssh_host_ed25519_key: "{{ .SSH_HOST_KEY }}"
      - name: gpg
        managedSecrets:
          - secretName: forgejo-gpg-managed-secrets
            template:
              includeAllSecrets: false
              data:
                privateKey: "{{ .GPG_PRIVATE_KEY }}"
      - name: anubis
        managedSecrets:
          - secretName: forgejo-anubis-managed-secrets
            template:
              includeAllSecrets: false
              data:
                ED25519_PRIVATE_KEY_HEX: "{{ .ED25519_PRIVATE_KEY_HEX }}"
      - name: resource-storage
        managedSecrets:
          - secretName: forgejo-storage-bucket-secrets
            template:
              data:
                MINIO_ENDPOINT: '{{ .S3_ENDPOINT | trimPrefix "https://" }}'
                MINIO_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
                MINIO_SECRET_ACCESS_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"

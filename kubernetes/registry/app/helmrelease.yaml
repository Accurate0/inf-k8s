apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: registry-harbor
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: registry
spec:
  interval: 1h
  releaseName: registry
  targetNamespace: registry
  storageNamespace: registry
  chart:
    spec:
      chart: harbor
      version: 1.19.4
      sourceRef:
        kind: HelmRepository
        name: registry-harbor
        namespace: flux-system
  maxHistory: 3
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
  rollback:
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    expose:
      type: clusterIP
      tls:
        enabled: false
      clusterIP:
        name: harbor
        ports:
          httpPort: 80
    externalURL: https://registry.anurag.sh
    existingSecretAdminPassword: harbor-generated-secrets
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    existingSecretSecretKey: harbor-generated-secrets
    persistence:
      enabled: false
      imageChartStorage:
        disableredirect: true
        type: s3
        s3:
          region: garage
          bucket: harbor
          regionendpoint: http://garage.garage.svc.cluster.local:3900
          existingSecret: harbor-storage-bucket-secrets
          v4auth: true
    database:
      type: external
      external:
        host: cloudnative-pg-cluster-pooler-rw.cnpg-system
        port: "5432"
        username: harbor
        coreDatabase: harbor
        existingSecret: harbor-database-password
        sslmode: disable
    redis:
      type: external
      external:
        addr: cache.dragonfly.svc.cluster.local:6379
        coreDatabaseIndex: "0"
        jobserviceDatabaseIndex: "0"
        registryDatabaseIndex: "0"
        trivyAdapterIndex: "0"
        harborDatabaseIndex: "0"
        cacheLayerDatabaseIndex: "0"
    core:
      existingSecret: harbor-generated-secrets
      existingXsrfSecret: harbor-generated-secrets
      existingXsrfSecretKey: CSRF_KEY
      secretName: harbor-token-secrets
      extraEnvVars:
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kanidm-harbor-oidc
              key: client-secret
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: kanidm-harbor-oidc
              key: client-id
        - name: CONFIG_OVERWRITE_JSON
          value: '{"auth_mode":"oidc_auth", "oidc_name":"Kanidm", "oidc_endpoint":"https://idm.anurag.sh/oauth2/openid/harbor", "oidc_client_id":"$(OIDC_CLIENT_ID)", "oidc_client_secret":"$(OIDC_CLIENT_SECRET)", "oidc_scope":"openid,email,profile,groups", "oidc_user_claim":"preferred_username", "oidc_groups_claim":"harbor_groups", "oidc_admin_group":"admin", "oidc_verify_cert":true, "oidc_auto_onboard":true, "primary_auth_mode":true, "self_registration":false}'
    jobservice:
      existingSecret: harbor-generated-secrets
      existingSecretKey: JOBSERVICE_SECRET
      jobLoggers:
        - database
    registry:
      registry:
        extraEnvVars:
          - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE
            value: "true"
      existingSecret: harbor-generated-secrets
      existingSecretKey: REGISTRY_HTTP_SECRET
      credentials:
        username: harbor_registry_user
        existingSecret: harbor-registry-credentials
    trivy:
      enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        metricRelabelings: []
        relabelings: []

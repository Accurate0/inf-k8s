# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: cert-manager
spec:
  interval: 1h
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  path: "./cert-manager/config"
  prune: true
  wait: true
  timeout: 10m
  targetNamespace: cert-manager

# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader-reloader
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: reloader
spec:
  interval: 1h
  releaseName: reloader
  targetNamespace: reloader
  storageNamespace: reloader
  chart:
    spec:
      chart: reloader
      version: 2.2.20
      sourceRef:
        kind: HelmRepository
        name: reloader-reloader
        namespace: flux-system
  maxHistory: 3
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
  rollback:
    cleanupOnFail: true
  driftDetection:
    mode: warn
  values:
    reloader:
      watchGlobally: true
      deployment:
        replicas: 1

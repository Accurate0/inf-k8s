apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: graph-k8s-workload
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: graph
spec:
  interval: 1h
  releaseName: graph-k8s-workload
  targetNamespace: graph
  storageNamespace: graph
  chartRef:
    kind: OCIRepository
    name: graph-k8s-workload
    namespace: flux-system
  maxHistory: 3
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
  rollback:
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: graph-image-values
      valuesKey: values.yaml
  values:
    namespace: graph
    namespaceLabels:
      internal-gateway-access: "true"
    workloads:
      - name: router
        image: registry.anurag.sh/containers/graph-router
        autoscale:
          min: 2
          max: 4
          cpu: 70
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        ports:
          - name: http
            containerPort: 4000
          - name: metrics
            containerPort: 9090
        env:
          - name: ROUTER_CONFIG_FILE_PATH
            value: /etc/graph/supergraph/router.yaml
          - name: OTEL_TRACING_URL
            value: http://monitoring-tempo.monitoring.svc.cluster.local:4318/v1/traces
          - name: GRAPH_PASSPORT_SEED
            valueFrom:
              secretKeyRef:
                name: graph-passport-secrets
                key: SEED
        envFrom:
          - secretRef:
              name: supergraph-bucket-secrets
        service:
          name: router
          ports:
            - name: http
              port: 80
              targetPort: 4000
              protocol: TCP
            - name: metrics
              port: 9090
              targetPort: 9090
              protocol: TCP
        readinessProbe:
          httpGet:
            path: /readiness
            port: 4000
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 3
          periodSeconds: 30
        volumes:
          - name: config
            configMap:
              name: graph-router
              items:
                - key: router.yaml
                  path: supergraph/router.yaml
                - key: supergraph.graphql
                  path: supergraph/supergraph.graphql
                - key: persisted-documents.json
                  path: supergraph/persisted-documents.json
        volumeMounts:
          - name: config
            mountPath: /etc/graph
            readOnly: true
      - name: supergraph-upload
        image: curlimages/curl
        kind: Job
        phase: postSync
        command:
          - sh
          - -c
        args:
          - |-
            set -e
            for file in supergraph.graphql persisted-documents.json; do
              curl -fsS --retry 5 --retry-connrefused --retry-delay 2 \
                --aws-sigv4 "aws:amz:$S3_REGION:s3" \
                --user "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" \
                -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" \
                -T "/etc/graph/supergraph/$file" \
                "$S3_ENDPOINT/$S3_BUCKET/$file"
            done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
        envFrom:
          - secretRef:
              name: supergraph-bucket-secrets
        volumes:
          - name: config
            configMap:
              name: graph-router
              items:
                - key: router.yaml
                  path: supergraph/router.yaml
                - key: supergraph.graphql
                  path: supergraph/supergraph.graphql
                - key: persisted-documents.json
                  path: supergraph/persisted-documents.json
        volumeMounts:
          - name: config
            mountPath: /etc/graph
            readOnly: true
    createNamespace: false
---

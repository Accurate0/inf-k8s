# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-dragonfly-operator
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: dragonfly
spec:
  interval: 1h
  releaseName: dragonfly
  targetNamespace: dragonfly-system
  storageNamespace: dragonfly-system
  chartRef:
    kind: OCIRepository
    name: dragonfly-dragonfly-operator
    namespace: flux-system
  maxHistory: 3
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
  rollback:
    cleanupOnFail: true
  driftDetection:
    mode: warn
  values:
    serviceMonitor:
      enabled: true

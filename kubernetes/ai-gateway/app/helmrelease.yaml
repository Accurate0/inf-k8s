apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway-k8s-workload
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: ai-gateway
spec:
  interval: 1h
  releaseName: ai-gateway-k8s-workload
  targetNamespace: ai-gateway
  storageNamespace: ai-gateway
  chartRef:
    kind: OCIRepository
    name: ai-gateway-k8s-workload
    namespace: flux-system
  maxHistory: 3
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
  rollback:
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    images: {}
    namespace: ai-gateway
    namespaceLabels:
      internal-gateway-access: "true"
    workloads:
      - name: ai-gateway
        image: registry.anurag.sh/containers/ai-gateway
        replicas: 2
        resources:
          requests:
            memory: 32Mi
        ports:
          - name: http
            containerPort: 3000
        env:
          - name: CONFIG_PATH
            value: /etc/ai-gateway/config.yaml
          - name: REDIS_URL
            value: redis://cache.dragonfly.svc.cluster.local
          - name: OTEL_TRACING_URL
            value: http://monitoring-tempo.monitoring.svc.cluster.local:4318/v1/traces
          - name: FEATURE_FLAGS_URL
            value: http://api.feature-flags.svc.cluster.local:50051
        envFrom:
          - secretRef:
              name: ai-gateway-managed-secrets
          - secretRef:
              name: ai-gateway-database-secret
        service:
          name: api
          ports:
            - name: http
              port: 80
              targetPort: 3000
              protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 60
        volumes:
          - name: config
            configMap:
              name: ai-gateway-config
              items:
                - key: config.yaml
                  path: config.yaml
        volumeMounts:
          - name: config
            mountPath: /etc/ai-gateway
            readOnly: true
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: ai-gateway
        topologySpreadConstraints:
          - topologyKey: inf-k8s.net/location
            maxSkew: 1
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: ai-gateway
      - name: ai-gateway-pricing-sync
        image: registry.anurag.sh/containers/ai-gateway
        kind: CronJob
        schedule: 17 4 * * *
        backoffLimit: 2
        command:
          - aig
          - prices
          - sync
        resources:
          requests:
            memory: 32Mi
          limits:
            memory: 128Mi
        env:
          - name: AIG_ADMIN_TOKEN
            valueFrom:
              secretKeyRef:
                name: ai-gateway-managed-secrets
                key: ADMIN_TOKEN
          - name: AIG_URL
            value: http://api.ai-gateway.svc.cluster.local
    createNamespace: false
---

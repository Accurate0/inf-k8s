# yaml-language-server: $schema=https://k8s-schemas.anurag.sh/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-driver-nfs-config
  namespace: flux-system
  annotations:
    event.toolkit.fluxcd.io/app: csi-driver-nfs
spec:
  interval: 1h
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  path: "./csi-driver-nfs/config"
  prune: true
  wait: true
  timeout: 10m
  targetNamespace: csi-driver-nfs
